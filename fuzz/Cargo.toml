[package]
name = "laneflow-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0"

# 本地运行：cargo +nightly fuzz run <target>。
# 注意：Windows MSVC 下 nightly 不附带 clang_rt.asan_dynamic-x86_64.dll，
# 需从 VS（VC/Tools/MSVC/<ver>/bin/Hostx64/x64/）复制到 exe 旁才能执行；
# `--sanitizer none` 在 windows-msvc 缺 __start_/__stop___sancov_pcs 无法链接。
# 权威执行环境是 .github/workflows/fuzz.yml 的 ubuntu runner。
[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
laneflow-compiler = { path = "../crates/laneflow-compiler", version = "0.0.0" }
laneflow-format = { path = "../crates/laneflow-format", version = "0.0.0", features = ["std"] }
laneflow-runtime = { path = "../crates/laneflow-runtime", version = "0.0.0" }
laneflow-static-contract = { path = "../crates/laneflow-static-contract", version = "0.0.0" }
laneflow-static-network = { path = "../crates/laneflow-static-network", version = "0.0.0" }
sha2 = { version = "0.11", default-features = false }
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[[bin]]
name = "lfre_arbitrary_bytes"
path = "fuzz_targets/lfre_arbitrary_bytes.rs"
test = false
doc = false

[[bin]]
name = "lfre_writer_differential"
path = "fuzz_targets/lfre_writer_differential.rs"
test = false
doc = false

[[bin]]
name = "portable_arbitrary_bytes"
path = "fuzz_targets/portable_arbitrary_bytes.rs"
test = false
doc = false

[[bin]]
name = "portable_bundle_mutation"
path = "fuzz_targets/portable_bundle_mutation.rs"
test = false
doc = false

[[bin]]
name = "lfrs_restore"
path = "fuzz_targets/lfrs_restore.rs"
test = false
doc = false

[[bin]]
name = "cutover_inputs"
path = "fuzz_targets/cutover_inputs.rs"
test = false
doc = false
