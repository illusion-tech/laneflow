[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.3"
# default-features 关闭：encoding 特性只为解码非 UTF-8 输入引入 encoding_rs
# （其 BSD-3-Clause 条款需 deny.toml 例外），本仓库 workflow/config 均为 UTF-8。
yaml-rust2 = { version = "0.10", default-features = false }

[lints]
workspace = true
