# CI 受影响验证计划的额外输入注册表（#1464，设计合同 §3.2）。
#
# 三个职责：
# - triggers.full：命中即扩大到完整适用套件的路径模式（全局构建配置、工具链、
#   workflow、计划器自身等；workspace 成员的 Cargo.toml 由算法规则内置，不在此列）。
# - triggers.not_applicable：有明确依据不适用重活检查的路径模式（治理文档、
#   编辑器配置、由其他 workflow 承载的 schema 与 fuzz 等）。白名单制：未落入
#   任何规则的路径走「未知」态扩大为全量，不静默跳过。
# - embed：跨包编译期嵌入图（被嵌入文件 → 嵌入方包名全集；同包嵌入不需要
#   条目，嵌入文件所属包经所有者规则自动成为种子）。由 ci-plan 模块的一致性
#   测试对全仓 include_str! / include_bytes! 清点对账，新增跨包嵌入时测试抓
#   红、在此补条目；清单由 `xtask ci-plan --dump-embed-map` 再生成。
#
# 已知非字面量实参（无法静态解析，人工核对项）：laneflow-lust-converter 的
# pipeline.rs 以 concat!(env!("CARGO_MANIFEST_DIR"), …) 嵌入根 Cargo.lock——
# 该路径已是全量触发器，归类正确性不受影响。
#
# 本文件自身是计划器输入：任何变更即全量（triggers.full 中的显式条目）。

schema_version = 1

[triggers]
full = [
    "Cargo.toml",
    "Cargo.lock",
    ".cargo/**",
    "rust-toolchain*",
    "deny.toml",
    ".config/nextest.toml",
    ".github/workflows/**",
    ".github/actions/**",
    "xtask/**/*.rs",
    "xtask/Cargo.toml",
    "xtask/data/ci-extra-inputs.toml",
]
not_applicable = [
    "docs/**",
    "README.md",
    "CONTRIBUTING.md",
    "AGENTS.md",
    "LICENSE",
    ".agents/**",
    ".cursor/**",
    ".codex/**",
    ".vscode/**",
    ".github/**",
    ".editorconfig",
    ".gitattributes",
    ".gitignore",
    ".githooks/**",
    "assets/**",
    "mcpls.toml",
    "schemas/**",
    "fuzz/**",
    "xtask/data/**",
]

