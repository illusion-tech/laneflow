# 运行时读取声明（std::fs::read 等非编译期嵌入的仓库文件依赖）。无法自动
# 对账——新增测试以运行时读取仓库文件时人工登记：先例是两个 generator 的
# checked-in 产物精确性测试（tests/junction.rs / tests/corridor.rs 的
# checked_in_artifacts_are_exact_generator_outputs），catalog.toml 侧已被
# 嵌入边覆盖，lfca 侧只被运行时读取。
[[input]]
path = "examples/data/v0.1-complex-junction.lfca"
consumers = ["laneflow-junction-generator"]

[[input]]
path = "examples/data/v0.2-signalized-corridor.lfca"
consumers = ["laneflow-corridor-generator"]
