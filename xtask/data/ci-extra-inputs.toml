# CI 受影响验证计划的额外输入注册表（#1464，设计合同 §3.2）。
#
# 四个职责：
# - triggers.full：命中即扩大到完整适用套件的路径模式（全局构建配置、工具链、
#   workflow、计划器自身等；workspace 成员的 Cargo.toml 由算法规则内置，不在此列）。
# - triggers.not_applicable：有明确依据不适用重活检查的路径模式（治理文档、
#   编辑器配置、由其他 workflow 承载的 schema 与 fuzz 等）。白名单制：未落入
#   任何规则的路径走「未知」态扩大为全量，不静默跳过。
# - embed：跨包编译期嵌入图（被嵌入文件 → 嵌入方包名全集；同包嵌入不需要
#   条目，嵌入文件所属包经所有者规则自动成为种子）。每次生成计划前，ci-plan
#   对全仓 include_str! / include_bytes! 清点（含嵌在其他宏实参里的形态）并与
#   本表对账：不一致时受影响计划不成立，退回全量并列出差异。新增跨包嵌入须
#   在同一变更里补条目；清单由 `xtask ci-plan --dump-embed-map` 再生成。
# - input：运行时读取声明（见文件末尾说明）。
#
# 本文件自身是计划器输入：任何变更即全量（triggers.full 中的显式条目）。

schema_version = 1

# 已人工核对的非字面量 include 实参：源文件的仓库相对路径，逐出现登记，
# 不去重。这类实参（如 concat!(env!("CARGO_MANIFEST_DIR"), …)）无法静态解析
# 出目标：扫描只记出现位置，不产出目标路径，也不进 embed 图。对账时按出现
# 位置与本清单比对，出现未登记的一处即退回全量。
#
# 登记即声明已人工读出目标，且目标不构成未登记的跨包输入：它属于嵌入方
# 自己的包，或已是全量触发器（改它即全量）。embed 表登记不了这类目标——
# 扫描清点不到，补了条目会被判「登记的跨包嵌入已不存在」，计划持续退回
# 全量。现有两处都在 lust-converter 的 pipeline.rs，分别嵌入仓库根的
# Cargo.lock 与 rust-toolchain.toml，两者都已是全量触发器。
#
# 目标跨包且不在全量触发器内的非字面量实参，本清单与 embed 表都覆盖不了，
# 不得径行登记。要让 embed 表管起来，须把实参改成字面量相对路径，扫描
# 清点得到后再登记；否则先另行确定人工声明与扫描结果的对账方式。
reviewed_unparsed_includes = [
    "tools/laneflow-lust-converter/src/output/pipeline.rs",
    "tools/laneflow-lust-converter/src/output/pipeline.rs",
]

[triggers]
full = [
    "Cargo.toml",
    "Cargo.lock",
    ".cargo/**",
    "rust-toolchain*",
    "deny.toml",
    ".config/nextest.toml",
    ".github/workflows/**",
    ".github/actions/**",
    "xtask/**/*.rs",
    "xtask/Cargo.toml",
    "xtask/data/ci-extra-inputs.toml",
]
not_applicable = [
    "docs/**",
    "README.md",
    # 工具说明由 check-docs 检查。计划前对账会拦住新增的同包或跨包 README 嵌入。
    "tools/laneflow-synth-harness/README.md",
    "CONTRIBUTING.md",
    "AGENTS.md",
    "LICENSE",
    ".agents/**",
    ".cursor/**",
    ".codex/**",
    ".vscode/**",
    ".github/**",
    ".editorconfig",
    ".gitattributes",
    ".gitignore",
    ".githooks/**",
    "assets/**",
    "schemas/**",
    "fuzz/**",
    "xtask/data/**",
]

