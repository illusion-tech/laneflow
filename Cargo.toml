[workspace]
members = [
    "crates/laneflow-bevy",
    "crates/laneflow-compiler",
    "crates/laneflow-format",
    "crates/laneflow-format-mmap",
    "crates/laneflow-motion-kernel",
    "crates/laneflow-road-editing-wire",
    "crates/laneflow-runtime",
    "crates/laneflow-runtime-snapshot-wire",
    "crates/laneflow-scenario",
    "crates/laneflow-spatial",
    "crates/laneflow-static-contract",
    "crates/laneflow-static-network",
    "research/issue-123-spatial-prototype",
    "research/issue-682-sparse-cost",
    "research/issue-762-post-p3-hotspots",
    "tools/laneflow-corridor-generator",
    "tools/laneflow-junction-generator",
    "tools/laneflow-lust-converter",
    "tools/laneflow-urban-generator",
    "tools/laneflow-urban-harness",
    "xtask",
]
# cargo-fuzz 标准布局：独立 package + 独立 lockfile，需要 nightly 与 libFuzzer
# 运行时，不参与主工作区构建与 MSRV 检查（.github/workflows/fuzz.yml 单独驱动）。
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/illusion-tech/laneflow"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

# 测试夹具全管线（Road Editing 来源写入 → 可移植发射 → 后发射检查 → 建网）
# 是测试套件主成本：debug 档单次近 50 s，其中发射与后发射检查约七成半、
# 来源写入约两成半（#748 P0 实测）。测试档把这些管线 crate 与摘要 crate
# 优化编译，测试代码本身保持 debug。
[profile.dev.package.laneflow-compiler]
opt-level = 2
[profile.dev.package.laneflow-format]
opt-level = 2
[profile.dev.package.laneflow-static-network]
opt-level = 2
[profile.dev.package.sha2]
opt-level = 2
[profile.dev.package.digest]
opt-level = 2

# CI 测试阶段的另一主成本是仿真重 crate 在 opt-level=0 下跑全量等价性/soak
# 矩阵（#899：前 20 个重测试占测试 CPU 约六成，实验测量见该 Issue）。测试档
# 为这些 crate 与其热路径依赖开优化；debug-assertions 与 overflow-checks
# 保持默认开启，被测语义不变。不使用 package."*"：避免 bevy 依赖树开优化，
# 拖慢依赖缓存失效后的全量编译。与上方 [profile.dev.package.*] 块（#748）
# 及 #802 的构建产物体积配置正交。
[profile.test.package.laneflow-runtime]
opt-level = 2
[profile.test.package.laneflow-scenario]
opt-level = 2
[profile.test.package.laneflow-urban-harness]
opt-level = 2
[profile.test.package.serde]
opt-level = 2
[profile.test.package.serde_json]
opt-level = 2
[profile.test.package.sha2]
opt-level = 2
[profile.test.package.toml]
opt-level = 2
