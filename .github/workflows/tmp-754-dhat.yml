name: TMP-754-dhat

# #754 临时取证：ubuntu 上循环运行零分配证据测试并以 dhat 剖析档取证
# （该 flaky 仅在 ubuntu 出现，Windows 无法复现）。合并前撤除。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dhat-loop:
    name: dhat allocation probe loop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust MSRV toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: laneflow-msrv-1.98.0-placement-fixtures

      - name: Loop waiting_budget_evidence 20 times with dhat profiles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dhat-evidence"
          for i in $(seq 1 20); do
            echo "=== iter ${i} ==="
            set +e
            cargo +1.98.0 test -p laneflow-runtime --test waiting_budget_evidence \
              --features placement-fixtures 2>&1 | tee "$RUNNER_TEMP/iter-${i}.log"
            status=${PIPESTATUS[0]}
            set -e
            if [ -f crates/laneflow-runtime/dhat-heap.json ]; then
              if [ "$status" -ne 0 ]; then
                mv crates/laneflow-runtime/dhat-heap.json "$RUNNER_TEMP/dhat-evidence/dhat-fail-${i}.json"
                echo "FAILED at iter ${i}; profile saved"
                break
              elif [ "$i" -eq 1 ]; then
                mv crates/laneflow-runtime/dhat-heap.json "$RUNNER_TEMP/dhat-evidence/dhat-pass-baseline.json"
              else
                rm -f crates/laneflow-runtime/dhat-heap.json
              fi
            fi
          done

      - name: Upload dhat evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dhat-evidence
          path: ${{ runner.temp }}/dhat-evidence
          if-no-files-found: warn
