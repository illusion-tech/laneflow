name: TMP-754-dhat

# #754 临时取证：以真实失败命令（nextest 全量 placement 套件）循环运行并以
# dhat 剖析档取证（该 flaky 仅在 ubuntu 的 nextest 并发进程压力下出现）。
# 合并前撤除。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dhat-loop:
    name: dhat allocation probe loop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust MSRV toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: laneflow-msrv-1.98.0-placement-fixtures

      - name: Install cargo-nextest 0.9.145
        shell: bash
        env:
          CARGO_NEXTEST_SHA256: cd3c85194e8b28ad26676d287f41f0d6b4d456cef5bd94700def5dea8e328883
          CARGO_NEXTEST_VERSION: 0.9.145
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-nextest.tar.gz"
          extract_dir="$RUNNER_TEMP/cargo-nextest-extract"
          curl --proto '=https' --tlsv1.2 --fail --show-error --location --retry 3 \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${CARGO_NEXTEST_VERSION}/cargo-nextest-${CARGO_NEXTEST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output "$archive"
          echo "${CARGO_NEXTEST_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$extract_dir"
          tar --extract --gzip --file "$archive" --directory "$extract_dir"
          install -m 0755 "$extract_dir/cargo-nextest" "$RUNNER_TEMP/cargo-nextest"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Loop full placement suite 8 times with dhat profiles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dhat-evidence"
          for i in $(seq 1 8); do
            echo "=== iter ${i} ==="
            set +e
            cargo +1.98.0 nextest run -p laneflow-runtime --locked --features placement-fixtures 2>&1 | tee "$RUNNER_TEMP/iter-${i}.log"
            status=${PIPESTATUS[0]}
            set -e
            if [ -f crates/laneflow-runtime/dhat-heap.json ]; then
              if [ "$status" -ne 0 ]; then
                mv crates/laneflow-runtime/dhat-heap.json "$RUNNER_TEMP/dhat-evidence/dhat-fail-${i}.json"
                echo "FAILED at iter ${i}; profile saved"
                break
              elif [ "$i" -eq 1 ]; then
                mv crates/laneflow-runtime/dhat-heap.json "$RUNNER_TEMP/dhat-evidence/dhat-pass-baseline.json"
              else
                rm -f crates/laneflow-runtime/dhat-heap.json
              fi
            fi
          done

      - name: Upload dhat evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dhat-evidence
          path: ${{ runner.temp }}/dhat-evidence
          if-no-files-found: warn
