name: Fuzz

on:
  pull_request:
    paths:
      - "crates/laneflow-road-editing-wire/**"
      - "crates/laneflow-compiler/**"
      - "crates/laneflow-format-mmap/**"
      - "crates/laneflow-format/**"
      - "crates/laneflow-static-contract/**"
      - "crates/laneflow-static-network/**"
      - "crates/laneflow-runtime/**"
      - "crates/laneflow-runtime-snapshot-wire/**"
      - "crates/laneflow-motion-kernel/**"
      - "schemas/road-editing/**"
      - "schemas/runtime-snapshot/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "每个目标的有界运行秒数；#536 正式窗口使用 1800"
        type: choice
        options:
          - "300"
          - "1800"
        default: "300"

# #1463：同一 PR 推送新 head 时取消未完成的旧运行。分组限定同一 workflow、
# 同一 PR；merge_group / 手工以 run_id 兜底（唯一分组），永不互相取消——
# merge queue 的 checks_requested 依赖每个候选的检查完整执行。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # #1363：merge_group 路径门。PR 是否触发由上方 workflow 级 pull_request.paths
  # 决定，workflow_dispatch 恒全量，两者不经本 job；本 job 只在合并组上按快照
  # 相对 base 的累计 diff 判定，口径与 pull_request.paths 保持一致。
  changes:
    name: Detect fuzz path changes
    runs-on: ubuntu-latest
    if: github.event_name == 'merge_group'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      fuzz: ${{ steps.filter.outputs.fuzz }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect fuzz path changes on the merge-group snapshot
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            fuzz:
              - 'crates/laneflow-road-editing-wire/**'
              - 'crates/laneflow-compiler/**'
              - 'crates/laneflow-format-mmap/**'
              - 'crates/laneflow-format/**'
              - 'crates/laneflow-static-contract/**'
              - 'crates/laneflow-static-network/**'
              - 'crates/laneflow-runtime/**'
              - 'crates/laneflow-runtime-snapshot-wire/**'
              - 'crates/laneflow-motion-kernel/**'
              - 'schemas/road-editing/**'
              - 'schemas/runtime-snapshot/**'
              - 'fuzz/**'
              - '.github/workflows/fuzz.yml'

  prepare:
    name: Prepare Input fuzz
    needs: changes
    # #1363：纯文档合并组不拉起六路 campaign。只有检测 job 明确判 false 才跳过
    # （job 级跳过、不分配 runner）；检测失败或输出缺失时失败关闭——照常全跑，
    # 不静默跳过。PR 路径命中即触发、workflow_dispatch 恒全量，均不受此门影响。
    if: &fuzz-path-gate ${{ !cancelled() && needs.changes.outputs.fuzz != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      inputs_artifact_id: ${{ steps.inputs-artifact.outputs.artifact-id }}
    steps:
      - &fuzz-checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust nightly toolchain for libFuzzer
        shell: bash
        run: rustup toolchain install nightly --profile minimal --component clippy

      - name: Cache Rust dependencies for fuzz
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: laneflow-nightly-fuzz
          save-if: false
          cache-targets: true

      - name: Validate harness oracles
        run: cargo +nightly test --manifest-path fuzz/Cargo.toml --locked --lib

      - name: Check fuzz harness lints
        run: cargo +nightly clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings

      - name: Prepare seed corpus and byte inventory
        run: cargo +nightly run --manifest-path fuzz/Cargo.toml --locked --example seed_corpus -- fuzz/corpus

      - name: Stage campaign launcher
        run: cargo +nightly run --manifest-path fuzz/Cargo.toml --locked --example run_campaign -- --prepare

      - name: Publish prepared Fuzz inputs
        id: inputs-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: input-fuzz-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            fuzz/target/prepared-campaigns/
            fuzz/corpus/
          compression-level: 1
          if-no-files-found: error
          retention-days: 90

  build:
    name: Build Input fuzz
    needs: changes
    if: *fuzz-path-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FUZZ_RELEASE_DIR: fuzz/target/x86_64-unknown-linux-gnu/release
    outputs:
      build_artifact_id: ${{ steps.build-artifact.outputs.artifact-id }}
    steps:
      - *fuzz-checkout

      - name: Install Rust nightly toolchain for libFuzzer
        run: rustup toolchain install nightly --profile minimal

      - name: Cache Rust dependencies for fuzz
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: laneflow-nightly-fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: true

      - name: Install cargo-fuzz 0.13.2
        run: cargo +nightly install cargo-fuzz --locked --version 0.13.2

      - name: Compile all ASan targets
        run: >-
          cargo +nightly fuzz build --target x86_64-unknown-linux-gnu
          --target-dir fuzz/target --sanitizer address

      # cargo-fuzz 0.13.2 不提供 --locked，构建后核对所有受检文件。
      - name: Verify build checkout stayed unchanged
        run: git diff --exit-code HEAD --

      - name: Record ASan build identity
        run: |
          mkdir -p "$FUZZ_RELEASE_DIR/metadata"
          git rev-parse HEAD > "$FUZZ_RELEASE_DIR/metadata/context"
          printf '%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "${ImageVersion:-}" >> "$FUZZ_RELEASE_DIR/metadata/context"
          sha256sum Cargo.lock fuzz/Cargo.lock > "$FUZZ_RELEASE_DIR/metadata/locks.sha256"
          rustc +nightly --version --verbose > "$FUZZ_RELEASE_DIR/metadata/rustc"
          cargo +nightly --version > "$FUZZ_RELEASE_DIR/metadata/cargo"
          cargo +nightly fuzz --version > "$FUZZ_RELEASE_DIR/metadata/cargo-fuzz"

      - name: Record ASan executable hashes
        working-directory: ${{ env.FUZZ_RELEASE_DIR }}
        run: >-
          sha256sum lfre_arbitrary_bytes lfre_writer_differential portable_arbitrary_bytes
          portable_bundle_mutation lfrs_restore cutover_inputs > metadata/binaries.sha256

      - name: Publish shared ASan targets
        id: build-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: input-fuzz-binaries-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.FUZZ_RELEASE_DIR }}/metadata/
            ${{ env.FUZZ_RELEASE_DIR }}/lfre_arbitrary_bytes
            ${{ env.FUZZ_RELEASE_DIR }}/lfre_writer_differential
            ${{ env.FUZZ_RELEASE_DIR }}/portable_arbitrary_bytes
            ${{ env.FUZZ_RELEASE_DIR }}/portable_bundle_mutation
            ${{ env.FUZZ_RELEASE_DIR }}/lfrs_restore
            ${{ env.FUZZ_RELEASE_DIR }}/cutover_inputs
          compression-level: 1
          if-no-files-found: error
          retention-days: 90

  input-fuzz:
    name: Input fuzz (${{ matrix.target }})
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # 一个 target 出 crash 时另一个仍要跑完并各自上传 artifact。
      fail-fast: false
      matrix:
        target:
          - lfre_arbitrary_bytes
          - lfre_writer_differential
          - portable_arbitrary_bytes
          - portable_bundle_mutation
          - lfrs_restore
          - cutover_inputs
    env:
      # 每个 target 的有界运行秒数，保持 PR 反馈在分钟级。
      FUZZ_MAX_TOTAL_TIME: ${{ inputs.duration_seconds || '300' }}
      FUZZ_TARGET: ${{ matrix.target }}
      FUZZ_INPUTS_ARTIFACT_ID: ${{ needs.prepare.outputs.inputs_artifact_id }}
      FUZZ_BUILD_ARTIFACT_ID: ${{ needs.build.outputs.build_artifact_id }}
    steps:
      - *fuzz-checkout

      - name: Check prepared artifact IDs
        run: |
          test -n "$FUZZ_INPUTS_ARTIFACT_ID"
          test -n "$FUZZ_BUILD_ARTIFACT_ID"

      - name: Download prepared Fuzz inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.inputs_artifact_id }}
          path: fuzz/
          merge-multiple: true

      - name: Download shared ASan targets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.build_artifact_id }}
          path: fuzz/target/prepared-asan/
          merge-multiple: true

      - name: Restore executable permissions
        run: >-
          chmod +x fuzz/target/prepared-campaigns/run_campaign
          "fuzz/target/prepared-asan/${FUZZ_TARGET}"

      - name: Fuzz ${{ matrix.target }}
        run: fuzz/target/prepared-campaigns/run_campaign "${FUZZ_TARGET}" --prepared

      - name: Verify dependency lockfiles stayed unchanged
        run: git diff --exit-code -- Cargo.lock fuzz/Cargo.lock

      - name: Preserve corpus and crash artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: input-fuzz-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            fuzz/corpus/${{ matrix.target }}/
            fuzz/corpus/seed-inventory.tsv
            fuzz/artifacts/${{ matrix.target }}/
            fuzz/receipts/${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 90
