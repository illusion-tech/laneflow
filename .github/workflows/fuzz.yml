name: Fuzz

on:
  pull_request:
    paths:
      - "crates/laneflow-road-editing-wire/**"
      - "crates/laneflow-compiler/**"
      - "crates/laneflow-format-mmap/**"
      - "schemas/road-editing/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lfre-fuzz:
    name: LFRE fuzz bounded smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # 一个 target 出 crash 时另一个仍要跑完并各自上传 artifact。
      fail-fast: false
      matrix:
        target:
          - lfre_arbitrary_bytes
          - lfre_writer_differential
    env:
      # 每个 target 的有界运行秒数，保持 PR 反馈在分钟级。
      FUZZ_MAX_TOTAL_TIME: "300"
      # 单个输入的执行超时秒数，把近死循环输入判为 crash 而不是拖住 job。
      FUZZ_TIMEOUT: "25"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust nightly toolchain for libFuzzer
        shell: bash
        run: rustup toolchain install nightly --profile minimal

      - name: Cache Rust dependencies for fuzz
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: laneflow-nightly-fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: true

      # 与 cargo-deny 相同的供应链纪律：固定工具版本与依赖解析（--locked），
      # 避免上游 cargo-fuzz 新版本改变 libFuzzer 默认参数或 sanitizer 行为，
      # 导致 fuzz 结果不可复现。
      - name: Install cargo-fuzz 0.13.2
        shell: bash
        run: cargo +nightly install cargo-fuzz --locked --version 0.13.2

      - name: Fuzz ${{ matrix.target }}
        shell: bash
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: >-
          cargo +nightly fuzz run ${FUZZ_TARGET} --
          -max_total_time=${FUZZ_MAX_TOTAL_TIME} -timeout=${FUZZ_TIMEOUT}

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lfre-fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
