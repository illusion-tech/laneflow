        uses: ./.github/actions/fetch-verified-archive
        with:
          url: https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          sha256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
          filename: cargo-deny.tar.gz

      - name: Install cargo-deny 0.20.2
        shell: bash
        env:
          ARCHIVE: ${{ steps.cargo-deny-archive.outputs.archive }}
        run: |
          set -euo pipefail

          extract_dir="$RUNNER_TEMP/cargo-deny-extract"
          mkdir -p "$extract_dir"
          tar --extract --gzip --file "$ARCHIVE" --directory "$extract_dir" --strip-components=1
          install -m 0755 "$extract_dir/cargo-deny" "$RUNNER_TEMP/cargo-deny"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Check advisories, licenses, bans, and sources
        shell: bash
        run: |
          set -euo pipefail
          cargo-deny --version
          cargo-deny --locked --all-features check advisories bans licenses sources

      - name: Check fuzz package policy
        shell: bash
        run: >-
          cargo-deny --manifest-path fuzz/Cargo.toml --config deny.toml
          --locked --all-features check advisories bans licenses sources
