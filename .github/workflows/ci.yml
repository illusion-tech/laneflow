name: CI

on:
  pull_request:
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  commit-message:
    name: Commit message
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch base branch for commit message checks
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Install Rust MSRV toolchain for commit message checks
        shell: bash
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Cache Rust dependencies for commit message checks
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: laneflow-msrv-1.96.0-commit-message
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: true

      - name: Check commit messages
        shell: bash
        run: cargo +1.96.0 run --locked -p xtask -- check-commit-messages

  markdown-tables:
    name: Markdown tables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust MSRV toolchain for markdown table checks
        shell: bash
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Cache Rust dependencies for markdown table checks
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: laneflow-msrv-1.96.0-markdown-tables
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: true

      - name: Warn on Markdown table formatting
        shell: bash
        run: |
          set +e
          cargo +1.96.0 run --locked -p xtask -- format-md-tables --check \
            README.md AGENTS.md CONTRIBUTING.md crates docs research schemas .github .agents .cursor
          status=$?
          set -e
          if [[ "$status" -ne 0 ]]; then
            echo "::warning::Markdown table formatting differs from xtask format-md-tables; merge is not blocked."
          fi

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect Rust and Bevy path changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'xtask/**'
              - 'tools/**'
              - 'examples/**'
              - 'research/**'
              - 'schemas/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/codeql.yml'
              - '.github/workflows/external-review.yml'
              - '.github/workflows/external-review-signal.yml'
              - '.github/workflows/road-editing-codegen.yml'
              - '.github/trusted-reviewers.json'
              - 'docs/governance/github-workflow.md'
            bevy:
              - 'crates/laneflow-bevy/**'
              - 'crates/laneflow-runtime/**'
              - 'crates/laneflow-spatial/**'
              - 'crates/laneflow-scenario/**'
              - 'examples/data/**'
              - 'examples/config/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'

      - name: Install Rust MSRV toolchain
        if: steps.filter.outputs.rust == 'true'
        shell: bash
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt

      - name: Cache Rust dependencies
        if: steps.filter.outputs.rust == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: laneflow-msrv-1.96.0-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: true

      - name: Check Rust toolchain
        if: steps.filter.outputs.rust == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rustc +1.96.0 --version
          cargo +1.96.0 --version

      - name: Check formatting
        if: steps.filter.outputs.rust == 'true'
        shell: bash
        run: cargo +1.96.0 fmt --all -- --check

      - name: Run workspace tests
        if: steps.filter.outputs.rust == 'true'
        shell: bash
        run: cargo +1.96.0 test --workspace --locked

      - name: Check signalized corridor artifacts
        if: steps.filter.outputs.rust == 'true'
        shell: bash
        run: cargo +1.96.0 run --locked -p laneflow-corridor-generator -- check --config examples/config/v0.10-signalized-corridor.toml

      - name: Compile Bevy native examples
        if: steps.filter.outputs.bevy == 'true'
        shell: bash
        run: >-
          cargo +1.96.0 check --locked -p laneflow-bevy
          --example runtime_min
          --features native-example

      - name: Skip heavy Rust checks for non-Rust paths
        if: steps.filter.outputs.rust != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "No Rust/Cargo/CI-workflow paths changed; skipping cargo fmt/test/check/benches."
          echo "Commit-message and dependency-policy jobs still cover docs and deny.toml when applicable."
  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust MSRV toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Install cargo-deny 0.20.2
        shell: bash
        env:
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
          CARGO_DENY_VERSION: 0.20.2
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/cargo-deny.tar.gz"
          extract_dir="$RUNNER_TEMP/cargo-deny-extract"
          curl --proto '=https' --tlsv1.2 --fail --show-error --location --retry 3 \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output "$archive"
          echo "${CARGO_DENY_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$extract_dir"
          tar --extract --gzip --file "$archive" --directory "$extract_dir" --strip-components=1
          install -m 0755 "$extract_dir/cargo-deny" "$RUNNER_TEMP/cargo-deny"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Check advisories, licenses, bans, and sources
        shell: bash
        run: |
          set -euo pipefail
          cargo-deny --version
          cargo-deny --locked --all-features check advisories bans licenses sources
