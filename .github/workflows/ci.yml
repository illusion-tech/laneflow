name: CI

on:
  pull_request:
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  commit-message:
    name: Commit message
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch base branch for commit message checks
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Install Rust MSRV toolchain for commit message checks
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Cache Rust dependencies for commit message checks
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: laneflow-msrv-1.99.1-commit-message
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: true

      - name: Check commit messages
        shell: bash
        run: cargo +1.99.1 run --locked -p xtask -- check-commit-messages

  markdown-tables:
    name: Markdown tables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust MSRV toolchain for markdown table checks
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Cache Rust dependencies for markdown table checks
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: laneflow-msrv-1.99.1-markdown-tables
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: true

      - name: Warn on Markdown table formatting
        shell: bash
        run: |
          set +e
          cargo +1.99.1 run --locked -p xtask -- format-md-tables --check \
            README.md AGENTS.md CONTRIBUTING.md crates docs research schemas .github .agents .cursor
          status=$?
          set -e
          if [[ "$status" -ne 0 ]]; then
            echo "::warning::Markdown table formatting differs from xtask format-md-tables; merge is not blocked."
          fi

  changes:
    name: Detect path changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      bevy: ${{ steps.filter.outputs.bevy }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect Rust and Bevy path changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'xtask/**'
              - 'tools/**'
              - 'examples/**'
              - 'research/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - 'deny.toml'
              - '.config/nextest.toml'
              - '.github/workflows/**'
              - 'docs/governance/github-workflow.md'
            bevy:
              - 'crates/laneflow-bevy/**'
              - 'crates/laneflow-runtime/**'
              - 'crates/laneflow-spatial/**'
              - 'crates/laneflow-scenario/**'
              - 'crates/laneflow-format/**'
              - 'crates/laneflow-format-mmap/**'
              - 'crates/laneflow-static-contract/**'
              - 'crates/laneflow-static-network/**'
              - 'crates/laneflow-compiler/**'
              - 'examples/data/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    needs: changes
    # 路径检测失败时本 job 必须红而不是被跳过：被跳过的 required check 会停在
    # Expected 卡住入队，静默当成功则是门禁假绿。取消（cancelled）仍随整个运行跳过。
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    # #1074：sccache 内容寻址编译缓存（GHA 原生后端，#1071 评估记录）。仅此三个
    # 有收益 job 挂包装器；wire-audit 不挂——hermetic 子编译经 env 剔除不触碰
    # 包装器，审计器引导构建不经缓存。写只在 main push，PR 与 merge_group 只读。
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_GHA_CACHE_TO: sccache-v1-
      SCCACHE_GHA_CACHE_FROM: sccache-v1-
      # #1074 测量探针：对照期间 PR 侧临时放开写入（R1'/R2' 可读写），采集
      # 完成后收敛为条件式（PR 与 merge_group 只读、main push 读写）。
      SCCACHE_GHA_RW_MODE: READ_WRITE
    steps:
      - name: Fail closed when path detection did not succeed
        if: needs.changes.result != 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Detect path changes result=${{ needs.changes.result }}; Rust checks fail closed."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust MSRV toolchain
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy

      - name: Cache Rust dependencies
        if: needs.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: laneflow-msrv-1.99.1-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: true

      - name: Install cargo-nextest 0.9.145
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        env:
          CARGO_NEXTEST_SHA256: cd3c85194e8b28ad26676d287f41f0d6b4d456cef5bd94700def5dea8e328883
          CARGO_NEXTEST_VERSION: 0.9.145
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/cargo-nextest.tar.gz"
          extract_dir="$RUNNER_TEMP/cargo-nextest-extract"
          curl --proto '=https' --tlsv1.2 --fail --show-error --location --retry 3 \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${CARGO_NEXTEST_VERSION}/cargo-nextest-${CARGO_NEXTEST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output "$archive"
          echo "${CARGO_NEXTEST_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$extract_dir"
          tar --extract --gzip --file "$archive" --directory "$extract_dir"
          install -m 0755 "$extract_dir/cargo-nextest" "$RUNNER_TEMP/cargo-nextest"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install sccache 0.19.0
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        env:
          # 资产摘要钉版；解出的包装器二进制摘要镜像钉在
          # tools/laneflow-lust-converter/src/output/pipeline.rs（ADR 0034）。
          SCCACHE_SHA256: aa73c7270c997894038c0d8f0d297865f57569e1687883322bc431713d4bb9dd
          SCCACHE_VERSION: 0.19.0
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/sccache.tar.gz"
          extract_dir="$RUNNER_TEMP/sccache-extract"
          curl --proto '=https' --tlsv1.2 --fail --show-error --location --retry 3 \
            "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/sccache-v${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output "$archive"
          echo "${SCCACHE_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$extract_dir"
          tar --extract --gzip --file "$archive" --directory "$extract_dir"
          install -m 0755 "$extract_dir/sccache-v${SCCACHE_VERSION}-x86_64-unknown-linux-musl/sccache" "$RUNNER_TEMP/sccache"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # sccache 官方 docs/GHA.md 的凭据注入方式：runner 只把缓存 API 凭据注入
      # action 进程，run: 步骤不可见（R1 实测 unbound variable），经 github-script
      # 转出；内嵌 JS 仅两行 exportVariable，无逻辑分支（#1074 立项审查扩范围）。
      - name: Configure sccache
        if: needs.changes.outputs.rust == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Check Rust toolchain
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rustc +1.99.1 --version
          cargo +1.99.1 --version

      - name: Check formatting
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: cargo +1.99.1 fmt --all -- --check

      - name: Check clippy lints
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: cargo +1.99.1 clippy --workspace --all-targets --locked -- -D warnings

      # 证据构建 feature 默认关闭；单独检查，防止 cfg 链在默认构建之外失修。
      - name: Check execution evidence lints
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: cargo +1.99.1 clippy -p laneflow-runtime -p laneflow-urban-harness --all-targets --locked --features laneflow-runtime/execution-evidence,laneflow-urban-harness/execution-evidence -- -D warnings

      - name: Run workspace tests
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: cargo +1.99.1 nextest run --workspace --locked

      - name: Run execution evidence tests
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: cargo +1.99.1 nextest run -p laneflow-runtime --locked --features execution-evidence -E 'test(execution_evidence)'

      # cargo-nextest 不执行 doctest，doctest 仍由 libtest 覆盖。
      - name: Run workspace doctests
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: cargo +1.99.1 test --workspace --doc --locked

      - name: Compile Bevy native examples
        if: needs.changes.outputs.bevy == 'true'
        shell: bash
        run: >-
          cargo +1.99.1 check --locked -p laneflow-bevy
          --example quickstart --example corridor_traffic --example junction_debug
          --features native-example

      - name: Show sccache statistics
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        shell: bash
        run: sccache --show-stats

      - name: Skip heavy Rust checks for non-Rust paths
        if: needs.changes.outputs.rust != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "No Rust/Cargo/CI-workflow paths changed; skipping cargo fmt/test."
          echo "Commit-message and dependency-policy jobs still cover docs and deny.toml when applicable."

  # wire 工具链审计与运行时架构检查自 Rust checks 拆出、与之并行，压缩合并路径
  # 关键路径（#1061）；检查语义不变，成为独立 required check。
  wire-audit:
    name: Wire toolchain audit
    runs-on: ubuntu-latest
    needs: changes
    # 同 Rust checks：路径检测失败时红而不是被跳过，取消随整个运行跳过。
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    steps:
      - name: Fail closed when path detection did not succeed
        if: needs.changes.result != 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Detect path changes result=${{ needs.changes.result }}; Wire toolchain audit fail closed."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust MSRV toolchain
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Cache Rust dependencies
        if: needs.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: laneflow-msrv-1.99.1-wire-audit
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: true

      - name: Check wire toolchain audit
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        env:
          # hermetic 子进程经 rustup shim 解析 rustc；固定 MSRV，避免 runner 默认工具链漂移。
          RUSTUP_TOOLCHAIN: 1.99.1
        run: |
          set -euo pipefail
          # 审计器自身引导必须免疫仓库 cargo 配置：`[target.*] runner` 可让
          # `cargo run`/`cargo test` 空转退出 0（门禁假绿），`[build]`
          # rustc-wrapper 可给审计器编译换源。cargo 配置按 cwd 向上发现，
          # 因此构建在子 shell 内从仓库外临时 cwd 以 --manifest-path 进行
          # （仓库 config 不参与构建）；审计执行回到仓库根（xtask 以 cwd 为
          # 仓库根），直接执行二进制（不经 cargo run，runner 不适用）。
          # 仓库 config 的 [env]/runner/rustc* 键由审计自身在源头禁绝。
          bootstrap_dir="$(mktemp -d)"
          (cd "$bootstrap_dir" && cargo +1.99.1 build --locked --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" -p xtask)
          "$GITHUB_WORKSPACE/target/debug/xtask" check-wire-audit

      - name: Check runtime architecture
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: 1.99.1
        run: |
          cargo +1.99.1 fetch --locked
          "$GITHUB_WORKSPACE/target/debug/xtask" check-runtime-architecture

      - name: Skip wire toolchain audit for non-Rust paths
        if: needs.changes.outputs.rust != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "No Rust/Cargo/CI-workflow paths changed; skipping wire toolchain audit checks."

  # placement-fixtures 是空 feature，开启时全量重跑以护栏 feature 副作用；
  # 与 Rust checks 并行执行，压缩合并路径墙钟（#748 P3）。
  placement-fixtures:
    name: Placement fixture tests
    runs-on: ubuntu-latest
    needs: changes
    # 同 Rust checks：路径检测失败时红而不是被跳过，取消随整个运行跳过。
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    # #1074：sccache 配置同 Rust checks；wrapper 作用域限定三个有收益 job。
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_GHA_CACHE_TO: sccache-v1-
      SCCACHE_GHA_CACHE_FROM: sccache-v1-
      # #1074 测量探针：对照期间 PR 侧临时放开写入（R1'/R2' 可读写），采集
      # 完成后收敛为条件式（PR 与 merge_group 只读、main push 读写）。
      SCCACHE_GHA_RW_MODE: READ_WRITE
    steps:
      - name: Fail closed when path detection did not succeed
        if: needs.changes.result != 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Detect path changes result=${{ needs.changes.result }}; Placement fixture tests fail closed."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust MSRV toolchain
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy

      - name: Cache Rust dependencies
        if: needs.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: laneflow-msrv-1.99.1-placement-fixtures
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: true

      - name: Install cargo-nextest 0.9.145
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        env:
          CARGO_NEXTEST_SHA256: cd3c85194e8b28ad26676d287f41f0d6b4d456cef5bd94700def5dea8e328883
          CARGO_NEXTEST_VERSION: 0.9.145
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/cargo-nextest.tar.gz"
          extract_dir="$RUNNER_TEMP/cargo-nextest-extract"
          curl --proto '=https' --tlsv1.2 --fail --show-error --location --retry 3 \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${CARGO_NEXTEST_VERSION}/cargo-nextest-${CARGO_NEXTEST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output "$archive"
          echo "${CARGO_NEXTEST_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$extract_dir"
          tar --extract --gzip --file "$archive" --directory "$extract_dir"
          install -m 0755 "$extract_dir/cargo-nextest" "$RUNNER_TEMP/cargo-nextest"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install sccache 0.19.0
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        env:
          # 资产摘要钉版；解出的包装器二进制摘要镜像钉在
          # tools/laneflow-lust-converter/src/output/pipeline.rs（ADR 0034）。
          SCCACHE_SHA256: aa73c7270c997894038c0d8f0d297865f57569e1687883322bc431713d4bb9dd
          SCCACHE_VERSION: 0.19.0
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/sccache.tar.gz"
          extract_dir="$RUNNER_TEMP/sccache-extract"
          curl --proto '=https' --tlsv1.2 --fail --show-error --location --retry 3 \
            "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/sccache-v${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output "$archive"
          echo "${SCCACHE_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$extract_dir"
          tar --extract --gzip --file "$archive" --directory "$extract_dir"
          install -m 0755 "$extract_dir/sccache-v${SCCACHE_VERSION}-x86_64-unknown-linux-musl/sccache" "$RUNNER_TEMP/sccache"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # sccache 官方 docs/GHA.md 的凭据注入方式：runner 只把缓存 API 凭据注入
      # action 进程，run: 步骤不可见（R1 实测 unbound variable），经 github-script
      # 转出；内嵌 JS 仅两行 exportVariable，无逻辑分支（#1074 立项审查扩范围）。
      - name: Configure sccache
        if: needs.changes.outputs.rust == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Check placement fixture lints
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: |
          cargo +1.99.1 clippy -p laneflow-runtime --all-targets --locked --features placement-fixtures -- -D warnings
          cargo +1.99.1 clippy -p laneflow-scenario --all-targets --locked --features placement-fixtures -- -D warnings
          cargo +1.99.1 clippy -p laneflow-junction-generator --all-targets --locked --features placement-fixtures -- -D warnings

      - name: Run placement fixture tests
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: |
          cargo +1.99.1 nextest run -p laneflow-runtime --locked --features placement-fixtures
          cargo +1.99.1 nextest run -p laneflow-scenario --locked --features placement-fixtures
          cargo +1.99.1 nextest run -p laneflow-junction-generator --locked --features placement-fixtures

      - name: Show sccache statistics
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        shell: bash
        run: sccache --show-stats

      - name: Skip placement fixture tests for non-Rust paths
        if: needs.changes.outputs.rust != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "No Rust/Cargo/CI-workflow paths changed; skipping placement fixture checks."

  rust-urban:
    name: Urban harness tests
    runs-on: ubuntu-latest
    needs: changes
    # 同 Rust checks：路径检测失败时红而不是被跳过，取消随整个运行跳过。
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    # #1074：sccache 配置同 Rust checks；wrapper 作用域限定三个有收益 job。
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_GHA_CACHE_TO: sccache-v1-
      SCCACHE_GHA_CACHE_FROM: sccache-v1-
      # #1074 测量探针：对照期间 PR 侧临时放开写入（R1'/R2' 可读写），采集
      # 完成后收敛为条件式（PR 与 merge_group 只读、main push 读写）。
      SCCACHE_GHA_RW_MODE: READ_WRITE
    steps:
      - name: Fail closed when path detection did not succeed
        if: needs.changes.result != 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Detect path changes result=${{ needs.changes.result }}; Urban harness tests fail closed."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust MSRV toolchain
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Cache Rust dependencies
        if: needs.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: laneflow-msrv-1.99.1-rust-urban
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: true

      - name: Install cargo-nextest 0.9.145
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        env:
          CARGO_NEXTEST_SHA256: cd3c85194e8b28ad26676d287f41f0d6b4d456cef5bd94700def5dea8e328883
          CARGO_NEXTEST_VERSION: 0.9.145
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/cargo-nextest.tar.gz"
          extract_dir="$RUNNER_TEMP/cargo-nextest-extract"
          curl --proto '=https' --tlsv1.2 --fail --show-error --location --retry 3 \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${CARGO_NEXTEST_VERSION}/cargo-nextest-${CARGO_NEXTEST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output "$archive"
          echo "${CARGO_NEXTEST_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$extract_dir"
          tar --extract --gzip --file "$archive" --directory "$extract_dir"
          install -m 0755 "$extract_dir/cargo-nextest" "$RUNNER_TEMP/cargo-nextest"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install sccache 0.19.0
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        env:
          # 资产摘要钉版；解出的包装器二进制摘要镜像钉在
          # tools/laneflow-lust-converter/src/output/pipeline.rs（ADR 0034）。
          SCCACHE_SHA256: aa73c7270c997894038c0d8f0d297865f57569e1687883322bc431713d4bb9dd
          SCCACHE_VERSION: 0.19.0
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/sccache.tar.gz"
          extract_dir="$RUNNER_TEMP/sccache-extract"
          curl --proto '=https' --tlsv1.2 --fail --show-error --location --retry 3 \
            "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/sccache-v${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output "$archive"
          echo "${SCCACHE_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$extract_dir"
          tar --extract --gzip --file "$archive" --directory "$extract_dir"
          install -m 0755 "$extract_dir/sccache-v${SCCACHE_VERSION}-x86_64-unknown-linux-musl/sccache" "$RUNNER_TEMP/sccache"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # sccache 官方 docs/GHA.md 的凭据注入方式：runner 只把缓存 API 凭据注入
      # action 进程，run: 步骤不可见（R1 实测 unbound variable），经 github-script
      # 转出；内嵌 JS 仅两行 exportVariable，无逻辑分支（#1074 立项审查扩范围）。
      - name: Configure sccache
        if: needs.changes.outputs.rust == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Run urban Adapter harness tests
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: cargo +1.99.1 nextest run --locked -p laneflow-urban-harness --features adapter

      - name: Show sccache statistics
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        shell: bash
        run: sccache --show-stats

      - name: Skip urban harness tests for non-Rust paths
        if: needs.changes.outputs.rust != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "No Rust/Cargo/CI-workflow paths changed; skipping urban harness tests."
  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust MSRV toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1

      - name: Install cargo-deny 0.20.2
        shell: bash
        env:
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
          CARGO_DENY_VERSION: 0.20.2
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/cargo-deny.tar.gz"
          extract_dir="$RUNNER_TEMP/cargo-deny-extract"
          curl --proto '=https' --tlsv1.2 --fail --show-error --location --retry 3 \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output "$archive"
          echo "${CARGO_DENY_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$extract_dir"
          tar --extract --gzip --file "$archive" --directory "$extract_dir" --strip-components=1
          install -m 0755 "$extract_dir/cargo-deny" "$RUNNER_TEMP/cargo-deny"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Check advisories, licenses, bans, and sources
        shell: bash
        run: |
          set -euo pipefail
          cargo-deny --version
          cargo-deny --locked --all-features check advisories bans licenses sources

      - name: Check fuzz package policy
        shell: bash
        run: >-
          cargo-deny --manifest-path fuzz/Cargo.toml --config deny.toml
          --locked --all-features check advisories bans licenses sources
