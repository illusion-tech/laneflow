name: CI

on:
  pull_request:
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main

# #1463：同一 PR 推送新 head 时取消未完成的旧运行。分组限定同一 workflow、
# 同一 PR；merge_group / push 以 run_id 兜底（唯一分组），永不互相取消——
# merge queue 的 checks_requested 依赖每个候选的检查完整执行。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commit-message:
    name: Commit message
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch base branch for commit message checks
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Install Rust MSRV toolchain for commit message checks
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Cache Rust dependencies for commit message checks
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: laneflow-msrv-1.99.1-commit-message
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: true

      - name: Check commit messages
        shell: bash
        run: cargo +1.99.1 run --locked -p xtask -- check-commit-messages

      - name: Check documentation model and generated indexes
        shell: bash
        run: cargo +1.99.1 run --locked -p xtask -- check-docs

      - name: Test documentation checks
        shell: bash
        run: cargo +1.99.1 test --locked -p xtask doc_checks

      # 注册表数据的模块级校验测试（与 doc 域同模式：命令检查与它的测试同 job）。
      # 测试二进制已由上一步编译，边际成本秒级；数据变更不再触发全量重活（#1459）。
      - name: Test commit harness and model registries
        shell: bash
        run: cargo +1.99.1 test --locked -p xtask -- commit_harnesses commit_models

  markdown-tables:
    name: Markdown tables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust MSRV toolchain for markdown table checks
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Cache Rust dependencies for markdown table checks
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: laneflow-msrv-1.99.1-markdown-tables
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: true

      - name: Warn on Markdown table formatting
        shell: bash
        run: |
          set +e
          cargo +1.99.1 run --locked -p xtask -- format-md-tables --check \
            README.md AGENTS.md CONTRIBUTING.md crates docs schemas .github .agents .cursor
          status=$?
          set -e
          if [[ "$status" -ne 0 ]]; then
            echo "::warning::Markdown table formatting differs from xtask format-md-tables; merge is not blocked."
          fi

  changes:
    name: Detect path changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      bevy: ${{ steps.filter.outputs.bevy }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect Rust and Bevy path changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              # xtask 精确到 Rust 文件与 Cargo 清单（#1459）：xtask/data 的注册表
              # 与文档检查数据由常驻 Commit message job 校验（命令检查 + 模块级
              # 测试），数据变更不再需要全量重活。crates/examples 维持目录级：
              # crate README 被 lib.rs 嵌入进 doctest，examples config/data 被
              # 工具测试嵌入。
              - 'xtask/**/*.rs'
              - 'xtask/Cargo.toml'
              # tools 精确到实际输入（#1298，100 目标嵌入清点背书）：嵌入与测试
              # 数据只在 .rs、Cargo 清单/锁文件、tests/、fixtures/、evidence/、
              # licenses/；README 等文档零嵌入。
              - 'tools/**/*.rs'
              - 'tools/**/Cargo.toml'
              - 'tools/**/Cargo.lock'
              - 'tools/**/tests/**'
              - 'tools/**/fixtures/**'
              - 'tools/**/evidence/**'
              - 'tools/**/licenses/**'
              - 'examples/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - 'deny.toml'
              - '.config/nextest.toml'
              # 未列入清单的路径不会自动回退全量（检测成功而无匹配即跳过重活）；
              # tests/fixtures 测试数据类新位置由全局条目兜底，其余新增编译期
              # 嵌入位置须在引入时同步补过滤器条目（#1299 评审更正）。
              - '**/tests/**'
              - '**/fixtures/**'
              - '.github/actions/**'
              - '.github/workflows/**'
            bevy:
              - 'crates/laneflow-bevy/**'
              - 'crates/laneflow-runtime/**'
              - 'crates/laneflow-spatial/**'
              - 'crates/laneflow-scenario/**'
              - 'crates/laneflow-format/**'
              - 'crates/laneflow-format-mmap/**'
              - 'crates/laneflow-static-contract/**'
              - 'crates/laneflow-static-network/**'
              - 'crates/laneflow-compiler/**'
              - 'examples/data/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'

  # PR 按计划选择工作步骤。队列独立运行影子计划。
  pr-plan:
    name: PR verification plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    outputs:
      urban_evidence: ${{ steps.plan.outputs.urban_evidence }}
      corridor_smoke: ${{ steps.plan.outputs.corridor_smoke }}
      placement: ${{ steps.plan.outputs.placement }}
      urban_adapter: ${{ steps.plan.outputs.urban_adapter }}
      evidence_receipt: ${{ steps.plan.outputs.evidence_receipt }}
      placement_receipt: ${{ steps.plan.outputs.placement_receipt }}
      urban_receipt: ${{ steps.plan.outputs.urban_receipt }}
      evidence_clippy: ${{ steps.plan.outputs.evidence_clippy }}
      evidence_tests: ${{ steps.plan.outputs.evidence_tests }}
      workspace_packages: ${{ steps.plan.outputs.workspace_packages }}
      rust_receipt: ${{ steps.plan.outputs.rust_receipt }}
    steps:
      - &plan-checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - &plan-toolchain
        name: Install Rust MSRV toolchain
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal

      - &plan-cache
        name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: laneflow-msrv-1.99.1-commit-message
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: true

      - name: Plan PR specialist checks
        id: plan
        run: cargo +1.99.1 run --quiet --locked -p xtask -- ci-plan --pr-specialists

  shadow-plan:
    name: Shadow plan
    runs-on: ubuntu-latest
    if: github.event_name == 'merge_group'
    permissions:
      contents: read
    steps:
      - *plan-checkout
      - *plan-toolchain
      - *plan-cache
      - name: Run shadow plan
        run: cargo +1.99.1 run --quiet --locked -p xtask -- ci-plan --shadow

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    needs: [changes, pr-plan]
    # 路径检测失败时本 job 必须红而不是被跳过：被跳过的 required check 会停在
    # Expected 卡住入队，静默当成功则是门禁假绿。取消（cancelled）仍随整个运行跳过。
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    # #1074：sccache 内容寻址编译缓存（GHA 原生后端，#1071 评估记录）。仅此三个
    # 有收益 job 挂包装器；wire-audit 不挂——hermetic 子编译经 env 剔除不触碰
    # 包装器，审计器引导构建不经缓存。写只在 main push，PR 与 merge_group 只读。
    env:
      WORKSPACE_PACKAGES: >-
        ${{ (github.event_name != 'pull_request' && (needs.changes.outputs.rust == 'true' && '*' || '[]')) ||
            needs.pr-plan.outputs.workspace_packages }}
      RUN_EVIDENCE_CLIPPY: >-
        ${{ (github.event_name == 'pull_request' && needs.pr-plan.outputs.evidence_clippy == 'true') ||
            (github.event_name != 'pull_request' && needs.changes.outputs.rust == 'true') }}
      RUN_EVIDENCE_TESTS: >-
        ${{ (github.event_name == 'pull_request' && needs.pr-plan.outputs.evidence_tests == 'true') ||
            (github.event_name != 'pull_request' && needs.changes.outputs.rust == 'true') }}
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "on"
      # #1074 根因修复：缓存服务 v2（Twirp）开关。不设时 ghac 走 v1 旧路径
      # _apis/artifactcache/*，在现行 results-receiver 上 404，能力探测失败使
      # 存储降级只读、写入静默全拒（main 首跑 641/641）；设置后走 Twirp 端点，
      # 与 sccache-action「Force the github action v2」同一机制。零逻辑分支。
      ACTIONS_CACHE_SERVICE_V2: "on"
      # PR 与 merge_group 只读，main push 读写（#1071 威胁模型：写只在默认分支）。
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
      # #1094：CI 链接器用 lld。稳态实测关键路径 -29%（Rust checks 631s→445s，
      # workspace tests 441s→296s）。RUSTFLAGS 参与指纹与 sccache 键，变更即换代。
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    steps:
      - name: Check Rust verification prerequisites
        if: needs.changes.result != 'success' || (github.event_name == 'pull_request' && needs.pr-plan.result != 'success')
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Rust checks prerequisites failed (changes=${{ needs.changes.result }}, pr-plan=${{ needs.pr-plan.result }})."
          exit 1

      - name: Checkout
        if: &rust-tools >-
          needs.changes.outputs.rust == 'true' || needs.changes.outputs.bevy == 'true' ||
          (env.WORKSPACE_PACKAGES != '' && env.WORKSPACE_PACKAGES != '[]') ||
          env.RUN_EVIDENCE_CLIPPY == 'true' || env.RUN_EVIDENCE_TESTS == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust MSRV toolchain
        if: *rust-tools
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy

      - name: Cache Rust dependencies
        if: *rust-tools
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: laneflow-msrv-1.99.1-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: true

      - name: Fetch cargo-nextest 0.9.145
        id: cargo-nextest-archive
        if: *rust-tools
        uses: ./.github/actions/fetch-verified-archive
        with:
          url: https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.145/cargo-nextest-0.9.145-x86_64-unknown-linux-musl.tar.gz
          sha256: cd3c85194e8b28ad26676d287f41f0d6b4d456cef5bd94700def5dea8e328883
          filename: cargo-nextest.tar.gz

      - name: Install cargo-nextest 0.9.145
        if: *rust-tools
        shell: bash
        env:
          ARCHIVE: ${{ steps.cargo-nextest-archive.outputs.archive }}
        run: |
          set -euo pipefail

          extract_dir="$RUNNER_TEMP/cargo-nextest-extract"
          mkdir -p "$extract_dir"
          tar --extract --gzip --file "$ARCHIVE" --directory "$extract_dir"
          install -m 0755 "$extract_dir/cargo-nextest" "$RUNNER_TEMP/cargo-nextest"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Fetch sccache 0.19.0
        id: sccache-archive
        if: *rust-tools
        uses: ./.github/actions/fetch-verified-archive
        with:
          url: https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-unknown-linux-musl.tar.gz
          # 资产摘要钉版；解出的包装器二进制摘要镜像钉在
          # tools/laneflow-lust-converter/src/output/pipeline.rs（ADR 0034）。
          sha256: aa73c7270c997894038c0d8f0d297865f57569e1687883322bc431713d4bb9dd
          filename: sccache.tar.gz

      - name: Install sccache 0.19.0
        if: *rust-tools
        shell: bash
        env:
          ARCHIVE: ${{ steps.sccache-archive.outputs.archive }}
        run: |
          set -euo pipefail

          extract_dir="$RUNNER_TEMP/sccache-extract"
          mkdir -p "$extract_dir"
          tar --extract --gzip --file "$ARCHIVE" --directory "$extract_dir"
          install -m 0755 "$extract_dir/sccache-v0.19.0-x86_64-unknown-linux-musl/sccache" "$RUNNER_TEMP/sccache"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # sccache 官方 docs/GHA.md 的凭据注入方式：runner 只把缓存 API 凭据注入
      # action 进程，run: 步骤不可见（R1 实测 unbound variable），经 github-script
      # 转出；内嵌 JS 仅两行 exportVariable，无逻辑分支（#1074 立项审查扩范围）。
      - name: Configure sccache
        id: configure_sccache
        if: *rust-tools
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Check Rust toolchain
        if: *rust-tools
        shell: bash
        run: |
          set -euo pipefail
          rustc +1.99.1 --version
          cargo +1.99.1 --version

      - name: Check formatting
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: cargo +1.99.1 fmt --all -- --check

      - name: Check clippy lints
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: cargo +1.99.1 clippy --workspace --all-targets --locked -- -D warnings

      # 证据构建 feature 默认关闭；单独检查，防止 cfg 链在默认构建之外失修。
      - name: Check execution evidence lints
        id: evidence_clippy
        if: env.RUN_EVIDENCE_CLIPPY == 'true'
        shell: bash
        run: cargo +1.99.1 clippy -p laneflow-runtime -p laneflow-urban-harness --all-targets --locked --features laneflow-runtime/execution-evidence,laneflow-urban-harness/execution-evidence -- -D warnings

      # #1500 只读运动诊断 feature 默认关闭；打点紧邻运动求值热路径，单独检查。
      - name: Check motion trace lints
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: cargo +1.99.1 clippy -p laneflow-runtime -p laneflow-scenario --all-targets --locked --features laneflow-runtime/motion-trace,laneflow-scenario/motion-trace -- -D warnings

      - name: Run workspace tests
        id: workspace_tests
        if: env.WORKSPACE_PACKAGES != '' && env.WORKSPACE_PACKAGES != '[]'
        shell: bash
        run: cargo +1.99.1 run --quiet --locked -p xtask -- run-workspace-tests "$WORKSPACE_PACKAGES"

      # #1462：三项目标测试均为 lib 单元测试，--lib 把构建集合收窄到 lib，
      # 不再为 3 项测试构建全部 [[test]] 集成目标（917 skipped 的来源）；-E
      # 过滤保留显式意图。
      - name: Run execution evidence tests
        id: evidence_tests
        if: env.RUN_EVIDENCE_TESTS == 'true'
        shell: bash
        run: cargo +1.99.1 nextest run -p laneflow-runtime --lib --locked --features execution-evidence -E 'test(execution_evidence)'

      # #1500：Runtime 对照回归只构建 lib；走廊样本重放（含开关记录一致性与
      # 预览复用记录）只构建该集成目标。记录器线程局部，nextest 逐测试进程执行。
      - name: Run motion trace tests
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: |
          cargo +1.99.1 nextest run -p laneflow-runtime --lib --locked --features motion-trace -E 'test(yellow_boundary_ride_trace)'
          cargo +1.99.1 nextest run -p laneflow-scenario --test signalized_corridor_yellow_trace --locked --features motion-trace

      # cargo-nextest 不执行 doctest，doctest 仍由 libtest 覆盖。
      - name: Run workspace doctests
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: cargo +1.99.1 test --workspace --doc --locked

      - name: Compile Bevy native examples
        if: needs.changes.outputs.bevy == 'true'
        shell: bash
        run: >-
          cargo +1.99.1 check --locked -p laneflow-bevy
          --example quickstart --example corridor_traffic --example junction_debug --example culling_extraction --example parking_lifecycle --example revision_cutover
          --features native-example

      - name: Show sccache statistics
        if: ${{ !cancelled() && steps.configure_sccache.outcome == 'success' }}
        shell: bash
        run: sccache --show-stats

      - name: Skip heavy Rust checks for non-Rust paths
        if: github.event_name != 'pull_request' && needs.changes.outputs.rust != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "No Rust/Cargo/CI-workflow paths changed; skipping cargo fmt/test."
          echo "Commit-message and dependency-policy jobs still cover docs and deny.toml when applicable."

      - name: Verify planned Rust steps and default test packages
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          EXPECTED: ${{ needs.pr-plan.outputs.rust_receipt }}
          OBSERVED: ${{ needs.pr-plan.result }}/rust/${{ steps.evidence_clippy.outcome }}/${{ steps.workspace_tests.outcome }}/${{ steps.evidence_tests.outcome }}/${{ steps.workspace_tests.outcome == 'skipped' && env.WORKSPACE_PACKAGES || steps.workspace_tests.outputs.covered_packages }}
        run: test "$EXPECTED" = "$OBSERVED"

  # #1108 重测分层：证据仪器与夹具重测自 Rust checks 的 workspace 步拆出、
  # 与之并行承载（urban-harness 浸泡/存档仪器、urban-generator 生成器、bevy
  # 走廊夹具），压缩合并路径墙钟；与 workspace 步互补，合计覆盖不变（对照
  # 清单见 PR）。成为独立 required check（合并后维护者在 Ruleset 增列）。
  evidence-fixtures:
    name: Evidence fixture tests
    runs-on: ubuntu-latest
    needs: [changes, pr-plan]
    # PR 即使缺计划也要核对结果，避免依赖 job 被跳过后误报成功。
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    # #1074 / #1094 接线同 Rust checks：sccache（GHA 后端、写只在 main push）
    # 与 lld 链接器；wrapper 作用域限定有收益 job，wire-audit 等不挂。
    env:
      RUN_URBAN_EVIDENCE: >-
        ${{ (github.event_name == 'pull_request' && needs.pr-plan.outputs.urban_evidence == 'true') ||
            (github.event_name != 'pull_request' && needs.changes.outputs.rust == 'true') }}
      RUN_CORRIDOR_SMOKE: >-
        ${{ (github.event_name == 'pull_request' && needs.pr-plan.outputs.corridor_smoke == 'true') ||
            (github.event_name != 'pull_request' && needs.changes.outputs.rust == 'true') }}
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "on"
      ACTIONS_CACHE_SERVICE_V2: "on"
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    steps:
      - name: Fail closed when path detection did not succeed
        if: needs.changes.result != 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Detect path changes result=${{ needs.changes.result }}; Evidence fixture tests fail closed."
          exit 1

      - name: Checkout
        if: env.RUN_URBAN_EVIDENCE == 'true' || env.RUN_CORRIDOR_SMOKE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust MSRV toolchain
        if: env.RUN_URBAN_EVIDENCE == 'true' || env.RUN_CORRIDOR_SMOKE == 'true'
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Cache Rust dependencies
        if: env.RUN_URBAN_EVIDENCE == 'true' || env.RUN_CORRIDOR_SMOKE == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: laneflow-msrv-1.99.1-evidence-fixtures
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: true

      - name: Fetch cargo-nextest 0.9.145
        id: cargo-nextest-archive
        if: env.RUN_URBAN_EVIDENCE == 'true' || env.RUN_CORRIDOR_SMOKE == 'true'
        uses: ./.github/actions/fetch-verified-archive
        with:
          url: https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.145/cargo-nextest-0.9.145-x86_64-unknown-linux-musl.tar.gz
          sha256: cd3c85194e8b28ad26676d287f41f0d6b4d456cef5bd94700def5dea8e328883
          filename: cargo-nextest.tar.gz

      - name: Install cargo-nextest 0.9.145
        if: env.RUN_URBAN_EVIDENCE == 'true' || env.RUN_CORRIDOR_SMOKE == 'true'
        shell: bash
        env:
          ARCHIVE: ${{ steps.cargo-nextest-archive.outputs.archive }}
        run: |
          set -euo pipefail

          extract_dir="$RUNNER_TEMP/cargo-nextest-extract"
          mkdir -p "$extract_dir"
          tar --extract --gzip --file "$ARCHIVE" --directory "$extract_dir"
          install -m 0755 "$extract_dir/cargo-nextest" "$RUNNER_TEMP/cargo-nextest"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Fetch sccache 0.19.0
        id: sccache-archive
        if: env.RUN_URBAN_EVIDENCE == 'true' || env.RUN_CORRIDOR_SMOKE == 'true'
        uses: ./.github/actions/fetch-verified-archive
        with:
          url: https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-unknown-linux-musl.tar.gz
          # 资产摘要钉版；解出的包装器二进制摘要镜像钉在
          # tools/laneflow-lust-converter/src/output/pipeline.rs（ADR 0034）。
          sha256: aa73c7270c997894038c0d8f0d297865f57569e1687883322bc431713d4bb9dd
          filename: sccache.tar.gz

      - name: Install sccache 0.19.0
        if: env.RUN_URBAN_EVIDENCE == 'true' || env.RUN_CORRIDOR_SMOKE == 'true'
        shell: bash
        env:
          ARCHIVE: ${{ steps.sccache-archive.outputs.archive }}
        run: |
          set -euo pipefail

          extract_dir="$RUNNER_TEMP/sccache-extract"
          mkdir -p "$extract_dir"
          tar --extract --gzip --file "$ARCHIVE" --directory "$extract_dir"
          install -m 0755 "$extract_dir/sccache-v0.19.0-x86_64-unknown-linux-musl/sccache" "$RUNNER_TEMP/sccache"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # sccache 官方 docs/GHA.md 的凭据注入方式：runner 只把缓存 API 凭据注入
      # action 进程，run: 步骤不可见（R1 实测 unbound variable），经 github-script
      # 转出；内嵌 JS 仅两行 exportVariable，无逻辑分支（#1074 立项审查扩范围）。
      - name: Configure sccache
        if: env.RUN_URBAN_EVIDENCE == 'true' || env.RUN_CORRIDOR_SMOKE == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # #1108：重测集合 = urban-harness（浸泡/存档/报告仪器）与 urban-generator
      # （夹具生成）整包 + bevy 走廊夹具 smoke；与 workspace 步的补集构成全量。
      - name: Run evidence and generator tests
        id: run_urban_evidence
        if: env.RUN_URBAN_EVIDENCE == 'true'
        shell: bash
        run: cargo +1.99.1 nextest run --locked -p laneflow-urban-harness -p laneflow-urban-generator

      # #1462：--test 直接选择构建目标（Cargo.toml [[test]]，路径在
      # examples/support/），不再先构建包内其他测试目标再按 binary 名过滤。
      - name: Run corridor fixture smoke tests
        id: run_corridor_smoke
        if: env.RUN_CORRIDOR_SMOKE == 'true'
        shell: bash
        run: cargo +1.99.1 nextest run --locked -p laneflow-bevy --test corridor_traffic_smoke

      - name: Show sccache statistics
        if: ${{ !cancelled() && (env.RUN_URBAN_EVIDENCE == 'true' || env.RUN_CORRIDOR_SMOKE == 'true') }}
        shell: bash
        run: sccache --show-stats

      - name: Skip evidence fixture tests for non-Rust paths
        if: github.event_name != 'pull_request' && needs.changes.outputs.rust != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "No Rust/Cargo/CI-workflow paths changed; skipping evidence fixture tests."

      - name: Verify planned evidence steps
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          EXPECTED: ${{ needs.pr-plan.outputs.evidence_receipt }}
          OBSERVED: ${{ needs.pr-plan.result }}/evidence/${{ steps.run_urban_evidence.outcome }}/${{ steps.run_corridor_smoke.outcome }}
        run: test "$EXPECTED" = "$OBSERVED"

  # wire 工具链审计与运行时架构检查自 Rust checks 拆出、与之并行，压缩合并路径
  # 关键路径（#1061）；检查语义不变，成为独立 required check。
  wire-audit:
    name: Wire toolchain audit
    runs-on: ubuntu-latest
    needs: changes
    # 同 Rust checks：路径检测失败时红而不是被跳过，取消随整个运行跳过。
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    steps:
      - name: Fail closed when path detection did not succeed
        if: needs.changes.result != 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Detect path changes result=${{ needs.changes.result }}; Wire toolchain audit fail closed."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust MSRV toolchain
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Cache Rust dependencies
        if: needs.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: laneflow-msrv-1.99.1-wire-audit
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: true

      - name: Check wire toolchain audit
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        env:
          # hermetic 子进程经 rustup shim 解析 rustc；固定 MSRV，避免 runner 默认工具链漂移。
          RUSTUP_TOOLCHAIN: 1.99.1
        run: |
          set -euo pipefail
          # 审计器自身引导必须免疫仓库 cargo 配置：`[target.*] runner` 可让
          # `cargo run`/`cargo test` 空转退出 0（门禁假绿），`[build]`
          # rustc-wrapper 可给审计器编译换源。cargo 配置按 cwd 向上发现，
          # 因此构建在子 shell 内从仓库外临时 cwd 以 --manifest-path 进行
          # （仓库 config 不参与构建）；审计执行回到仓库根（xtask 以 cwd 为
          # 仓库根），直接执行二进制（不经 cargo run，runner 不适用）。
          # 仓库 config 的 [env]/runner/rustc* 键由审计自身在源头禁绝。
          bootstrap_dir="$(mktemp -d)"
          (cd "$bootstrap_dir" && cargo +1.99.1 build --locked --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" -p xtask)
          "$GITHUB_WORKSPACE/target/debug/xtask" check-wire-audit

      - name: Check runtime architecture
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: 1.99.1
        run: |
          cargo +1.99.1 fetch --locked
          "$GITHUB_WORKSPACE/target/debug/xtask" check-runtime-architecture

      - name: Skip wire toolchain audit for non-Rust paths
        if: needs.changes.outputs.rust != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "No Rust/Cargo/CI-workflow paths changed; skipping wire toolchain audit checks."

  # placement-fixtures 是空 feature，开启时全量重跑以护栏 feature 副作用；
  # 与 Rust checks 并行执行，压缩合并路径墙钟（#748 P3）。
  placement-fixtures:
    name: Placement fixture tests
    runs-on: ubuntu-latest
    needs: [changes, pr-plan]
    # PR 即使缺计划也要核对结果，避免依赖 job 被跳过后误报成功。
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    # #1074：sccache 配置同 Rust checks；wrapper 作用域限定三个有收益 job。
    env:
      RUN_PLACEMENT: >-
        ${{ (github.event_name == 'pull_request' && needs.pr-plan.outputs.placement == 'true') ||
            (github.event_name != 'pull_request' && needs.changes.outputs.rust == 'true') }}
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "on"
      # #1074 根因修复：缓存服务 v2（Twirp）开关。不设时 ghac 走 v1 旧路径
      # _apis/artifactcache/*，在现行 results-receiver 上 404，能力探测失败使
      # 存储降级只读、写入静默全拒（main 首跑 641/641）；设置后走 Twirp 端点，
      # 与 sccache-action「Force the github action v2」同一机制。零逻辑分支。
      ACTIONS_CACHE_SERVICE_V2: "on"
      # PR 与 merge_group 只读，main push 读写（#1071 威胁模型：写只在默认分支）。
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
      # #1094：CI 链接器用 lld。稳态实测关键路径 -29%（Rust checks 631s→445s，
      # workspace tests 441s→296s）。RUSTFLAGS 参与指纹与 sccache 键，变更即换代。
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    steps:
      - name: Fail closed when path detection did not succeed
        if: needs.changes.result != 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Detect path changes result=${{ needs.changes.result }}; Placement fixture tests fail closed."
          exit 1

      - name: Checkout
        if: env.RUN_PLACEMENT == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust MSRV toolchain
        if: env.RUN_PLACEMENT == 'true'
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy

      - name: Cache Rust dependencies
        if: env.RUN_PLACEMENT == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: laneflow-msrv-1.99.1-placement-fixtures
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: true

      - name: Fetch cargo-nextest 0.9.145
        id: cargo-nextest-archive
        if: env.RUN_PLACEMENT == 'true'
        uses: ./.github/actions/fetch-verified-archive
        with:
          url: https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.145/cargo-nextest-0.9.145-x86_64-unknown-linux-musl.tar.gz
          sha256: cd3c85194e8b28ad26676d287f41f0d6b4d456cef5bd94700def5dea8e328883
          filename: cargo-nextest.tar.gz

      - name: Install cargo-nextest 0.9.145
        if: env.RUN_PLACEMENT == 'true'
        shell: bash
        env:
          ARCHIVE: ${{ steps.cargo-nextest-archive.outputs.archive }}
        run: |
          set -euo pipefail

          extract_dir="$RUNNER_TEMP/cargo-nextest-extract"
          mkdir -p "$extract_dir"
          tar --extract --gzip --file "$ARCHIVE" --directory "$extract_dir"
          install -m 0755 "$extract_dir/cargo-nextest" "$RUNNER_TEMP/cargo-nextest"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Fetch sccache 0.19.0
        id: sccache-archive
        if: env.RUN_PLACEMENT == 'true'
        uses: ./.github/actions/fetch-verified-archive
        with:
          url: https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-unknown-linux-musl.tar.gz
          # 资产摘要钉版；解出的包装器二进制摘要镜像钉在
          # tools/laneflow-lust-converter/src/output/pipeline.rs（ADR 0034）。
          sha256: aa73c7270c997894038c0d8f0d297865f57569e1687883322bc431713d4bb9dd
          filename: sccache.tar.gz

      - name: Install sccache 0.19.0
        if: env.RUN_PLACEMENT == 'true'
        shell: bash
        env:
          ARCHIVE: ${{ steps.sccache-archive.outputs.archive }}
        run: |
          set -euo pipefail

          extract_dir="$RUNNER_TEMP/sccache-extract"
          mkdir -p "$extract_dir"
          tar --extract --gzip --file "$ARCHIVE" --directory "$extract_dir"
          install -m 0755 "$extract_dir/sccache-v0.19.0-x86_64-unknown-linux-musl/sccache" "$RUNNER_TEMP/sccache"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # sccache 官方 docs/GHA.md 的凭据注入方式：runner 只把缓存 API 凭据注入
      # action 进程，run: 步骤不可见（R1 实测 unbound variable），经 github-script
      # 转出；内嵌 JS 仅两行 exportVariable，无逻辑分支（#1074 立项审查扩范围）。
      - name: Configure sccache
        if: env.RUN_PLACEMENT == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Check placement fixture lints
        id: placement_clippy
        if: env.RUN_PLACEMENT == 'true'
        shell: bash
        run: |
          cargo +1.99.1 clippy -p laneflow-runtime --all-targets --locked --features placement-fixtures -- -D warnings
          cargo +1.99.1 clippy -p laneflow-scenario --all-targets --locked --features placement-fixtures -- -D warnings
          cargo +1.99.1 clippy -p laneflow-junction-generator --all-targets --locked --features placement-fixtures -- -D warnings

      - name: Run placement fixture tests
        id: placement_tests
        if: env.RUN_PLACEMENT == 'true'
        shell: bash
        run: |
          cargo +1.99.1 nextest run -p laneflow-runtime --locked --features placement-fixtures
          cargo +1.99.1 nextest run -p laneflow-scenario --locked --features placement-fixtures
          cargo +1.99.1 nextest run -p laneflow-junction-generator --locked --features placement-fixtures

      - name: Show sccache statistics
        if: ${{ !cancelled() && env.RUN_PLACEMENT == 'true' }}
        shell: bash
        run: sccache --show-stats

      - name: Skip placement fixture tests for non-Rust paths
        if: github.event_name != 'pull_request' && needs.changes.outputs.rust != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "No Rust/Cargo/CI-workflow paths changed; skipping placement fixture checks."

      - name: Verify planned placement steps
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          EXPECTED: ${{ needs.pr-plan.outputs.placement_receipt }}
          OBSERVED: ${{ needs.pr-plan.result }}/placement/${{ steps.placement_clippy.outcome }}/${{ steps.placement_tests.outcome }}
        run: test "$EXPECTED" = "$OBSERVED"

  rust-urban:
    name: Urban harness tests
    runs-on: ubuntu-latest
