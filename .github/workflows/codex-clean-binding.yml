name: Codex Clean Binding

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  dispatch:
    name: Dispatch binding action for PR #${{ github.event.issue.number }}
    if: >-
      github.event.issue.pull_request != null && (
        (github.event.comment.user.login == 'wangzishi' &&
         github.event.comment.body == 'external-review: request-codex-review') ||
        github.event.comment.user.login == 'chatgpt-codex-connector[bot]'
      )
    # 与 publisher 的 unbound sweep 配对：串行化消除并发读-选-发竞态；同组只允许
    # 一个 pending run 而被挤掉的中间事件，由后续 run 的 sweep 统一补绑。
    concurrency:
      group: codex-clean-binding-pr-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted validator from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          git diff --exit-code

      - name: Install Rust MSRV toolchain for trusted validator
        shell: bash
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Publish controlled Codex review request marker
        if: github.event.comment.user.login == 'wangzishi'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          cargo +1.96.0 run --locked -p xtask -- \
            request-codex-review \
            --repo "$REPOSITORY" \
            --pr "$PR_NUMBER"

      - name: Publish Codex clean binding record
        if: github.event.comment.user.login == 'chatgpt-codex-connector[bot]'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          CLEAN_COMMENT_NODE_ID: ${{ github.event.comment.node_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cargo +1.96.0 run --locked -p xtask -- \
            publish-codex-clean-binding \
            --repo "$REPOSITORY" \
            --pr "$PR_NUMBER" \
            --clean-comment-id "$CLEAN_COMMENT_NODE_ID" \
            --run-url "$RUN_URL"

      # GITHUB_TOKEN 发布的 record 评论不会再触发 Gate workflow（GitHub 递归
      # 防护），绑定发布后必须在同一 run 内自行刷新 shadow check。
      # always()：绑定命令对不可绑定的 Codex comment（如 provider 不可用提示）
      # fail-closed 退出非零，此时仍须刷新，让 shadow 及时反映 evaluator 结论。
      - name: Refresh External Review Gate Shadow
        if: always() && github.event.comment.user.login == 'chatgpt-codex-connector[bot]'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          set -euo pipefail
          trusted_ref_oid="$(git rev-parse HEAD)"
          cargo +1.96.0 run --locked -p xtask -- \
            publish-external-review-check \
            --repo "$REPOSITORY" \
            --pr "$PR_NUMBER" \
            --details-url "$RUN_URL" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --trusted-ref-oid "$trusted_ref_oid"
