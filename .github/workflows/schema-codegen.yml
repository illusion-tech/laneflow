name: Schema Codegen

on:
  pull_request:
    paths:
      - "schemas/road-editing/**"
      - "schemas/runtime-snapshot/**"
      - "crates/laneflow-road-editing-wire/**"
      - "crates/laneflow-runtime-snapshot-wire/**"
      - "**/Cargo.toml"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain*"
      - ".github/workflows/**"
      - "tools/lfre-crosslang-writer/**"
      - "crates/laneflow-compiler/tests/fixtures/lfre-crosslang/**"
      - "crates/laneflow-compiler/tests/crosslang_lfre_fixtures.rs"
  push:
    branches:
      - main
    paths:
      - "schemas/road-editing/**"
      - "schemas/runtime-snapshot/**"
      - "crates/laneflow-road-editing-wire/**"
      - "crates/laneflow-runtime-snapshot-wire/**"
      - "**/Cargo.toml"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain*"
      - ".github/workflows/**"
      - "tools/lfre-crosslang-writer/**"
      - "crates/laneflow-compiler/tests/fixtures/lfre-crosslang/**"
      - "crates/laneflow-compiler/tests/crosslang_lfre_fixtures.rs"

permissions:
  contents: read

jobs:
  codegen:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Ubuntu pinned flatc
            os: ubuntu-latest
            asset: Linux.flatc.binary.clang++-18.zip
            bytes: 2750934
            sha256: 50c1915deeeb714f2a05c8ec795bd1af898d251a62e2774067703b29188efc90
          - label: Windows pinned flatc
            os: windows-latest
            asset: Windows.flatc.binary.zip
            bytes: 1412094
            sha256: fff9445c9db907227bc64b54cc98743084c4949282aa4e576cff6a955724ddc8
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust MSRV toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: laneflow-msrv-1.98.0-road-editing-codegen-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: true

      - name: Download and verify pinned flatc on Ubuntu
        if: runner.os == 'Linux'
        id: flatc-linux
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          EXPECTED_BYTES: ${{ matrix.bytes }}
          EXPECTED_SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/flatc.zip"
          destination="$RUNNER_TEMP/flatc"
          curl --fail --location --show-error \
            "https://github.com/google/flatbuffers/releases/download/v25.12.19/$ASSET" \
            --output "$archive"
          test "$(stat --format=%s "$archive")" = "$EXPECTED_BYTES"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$destination"
          unzip -q "$archive" -d "$destination"
          flatc_path="$(find "$destination" -type f -name flatc -print -quit)"
          test -n "$flatc_path"
          chmod +x "$flatc_path"
          printf 'flatc_path=%s\n' "$flatc_path" >> "$GITHUB_OUTPUT"

      - name: Download and verify pinned flatc on Windows
        if: runner.os == 'Windows'
        id: flatc-windows
        shell: pwsh
        env:
          ASSET: ${{ matrix.asset }}
          EXPECTED_BYTES: ${{ matrix.bytes }}
          EXPECTED_SHA256: ${{ matrix.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'flatc.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'flatc'
          $uri = "https://github.com/google/flatbuffers/releases/download/v25.12.19/$env:ASSET"
          Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $archive
          $actualBytes = (Get-Item -LiteralPath $archive).Length
          if ($actualBytes -ne [int64]$env:EXPECTED_BYTES) {
            throw "flatc asset byte length mismatch: expected=$env:EXPECTED_BYTES actual=$actualBytes"
          }
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $env:EXPECTED_SHA256) {
            throw "flatc asset SHA-256 mismatch: expected=$env:EXPECTED_SHA256 actual=$actualSha256"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $flatc = Get-ChildItem -LiteralPath $destination -Recurse -File -Filter 'flatc.exe' |
            Select-Object -First 1
          if ($null -eq $flatc) {
            throw 'flatc.exe was not present in the verified archive'
          }
          "flatc_path=$($flatc.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check exact code generation and unsafe boundary
        shell: bash
        env:
          LINUX_FLATC: ${{ steps.flatc-linux.outputs.flatc_path }}
          WINDOWS_FLATC: ${{ steps.flatc-windows.outputs.flatc_path }}
        run: |
          set -euo pipefail
          flatc_path="${LINUX_FLATC:-${WINDOWS_FLATC:-}}"
          test -n "$flatc_path"
          cargo +1.98.0 run --locked -p xtask -- \
            check-road-editing-codegen --flatc "$flatc_path"
          cargo +1.98.0 run --locked -p xtask -- \
            check-runtime-snapshot-codegen --flatc "$flatc_path"

      - name: Check wire toolchain audit
        shell: bash
        run: cargo +1.98.0 run --locked -p xtask -- check-wire-audit

      - name: Compile generated Rust bindings
        shell: bash
        run: |
          cargo +1.98.0 test --locked -p laneflow-road-editing-wire
          cargo +1.98.0 test --locked -p laneflow-runtime-snapshot-wire

  crosslang-fixture:
    name: Cross-language LFRE writer fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download and verify pinned flatc
        id: flatc
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/flatc.zip"
          destination="$RUNNER_TEMP/flatc"
          curl --fail --location --show-error \
            "https://github.com/google/flatbuffers/releases/download/v25.12.19/Linux.flatc.binary.clang++-18.zip" \
            --output "$archive"
          test "$(stat --format=%s "$archive")" = "2750934"
          printf '%s  %s\n' \
            "50c1915deeeb714f2a05c8ec795bd1af898d251a62e2774067703b29188efc90" \
            "$archive" | sha256sum --check --strict
          mkdir -p "$destination"
          unzip -q "$archive" -d "$destination"
          flatc_path="$(find "$destination" -type f -name flatc -print -quit)"
          test -n "$flatc_path"
          chmod +x "$flatc_path"
          printf 'flatc_path=%s\n' "$flatc_path" >> "$GITHUB_OUTPUT"

      - name: Download and verify pinned flatbuffers sources
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/flatbuffers-src.zip"
          curl --fail --location --show-error \
            "https://codeload.github.com/google/flatbuffers/zip/7e163021e59cca4f8e1e35a7c828b5c6b7915953" \
            --output "$archive"
          printf '%s  %s\n' \
            "bda1ae95dca76000278a05936fd8b0c66eb5c2835ccbe7aa311081faa423e482" \
            "$archive" | sha256sum --check --strict
          source_root="$RUNNER_TEMP/flatbuffers-src"
          mkdir -p "$source_root"
          unzip -q "$archive" -d "$source_root"
          source_dir="$source_root/flatbuffers-7e163021e59cca4f8e1e35a7c828b5c6b7915953"
          test -d "$source_dir"
          mkdir -p target/flatbuffers-25.12.19
          cp -r "$source_dir/include" target/flatbuffers-25.12.19/
          cp -r "$source_dir/net" target/flatbuffers-25.12.19/

      - name: Generate C++ and C# bindings with pinned flatc
        shell: bash
        env:
          FLATC: ${{ steps.flatc.outputs.flatc_path }}
        run: |
          set -euo pipefail
          mkdir -p target/road-editing-codegen/cpp target/road-editing-codegen/csharp
          "$FLATC" --cpp -o target/road-editing-codegen/cpp \
            schemas/road-editing/v3/road-editing.fbs
          "$FLATC" --csharp -o target/road-editing-codegen/csharp \
            schemas/road-editing/v3/road-editing.fbs

      - name: Build and run C++ writer
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra \
            -I target/flatbuffers-25.12.19/include \
            -I target/road-editing-codegen/cpp \
            tools/lfre-crosslang-writer/cpp/writer.cpp -o "$RUNNER_TEMP/cpp-writer"
          "$RUNNER_TEMP/cpp-writer" "$RUNNER_TEMP/cpp_writer.lfre"

      - name: Install dotnet SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "9.0.x"

      - name: Build and run C# writer
        shell: bash
        run: |
          dotnet run --project tools/lfre-crosslang-writer/csharp \
            --configuration Release -- "$RUNNER_TEMP/csharp_writer.lfre"

      - name: Compare regenerated bytes against golden fixtures
        shell: bash
        run: |
          set -euo pipefail
          cmp "$RUNNER_TEMP/cpp_writer.lfre" \
            crates/laneflow-compiler/tests/fixtures/lfre-crosslang/cpp_writer.lfre
          cmp "$RUNNER_TEMP/csharp_writer.lfre" \
            crates/laneflow-compiler/tests/fixtures/lfre-crosslang/csharp_writer.lfre
