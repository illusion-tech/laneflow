name: CodeQL

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect CodeQL paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # push/调度/手工走 gate 步骤（恒 true）；PR 与 merge_group 走 dorny 过滤器。
      # gate 步骤在 PR 事件下被跳过、输出为空，`||` 回落到 filter 输出。
      analyze: ${{ steps.gate.outputs.analyze || steps.filter.outputs.analyze }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 安全基线不设门：main push、每周调度与手工 dispatch 恒全量分析
      #（security-scanning.md §2.1）。路径门只作用于 PR 与 merge_group。
      - name: Force full analysis outside PR and merge queue
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        id: gate
        shell: bash
        run: echo "analyze=true" >> "$GITHUB_OUTPUT"

      # 过滤器与 ci.yml 的 rust 过滤器同口径，宁可多跑不少跑；`.github/workflows/**`
      # 同时覆盖 actions 语言的扫描对象；`fuzz/**` 不在 workspace，但 CodeQL 的
      # rust 库按仓库全部 Rust 文件构建，fuzz 独立包仍在扫描范围内（#1284 评审）；
      # `research/**` 与 `tools/**` 精确到 Rust 文件：研究结论与工具文档不改变
      # rust 库扫描集（#1293、#1298）。
      - name: Detect CodeQL-applicable path changes
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            analyze:
              - 'crates/**'
              - 'xtask/**'
              - 'tools/**/*.rs'
              - 'examples/**'
              - 'research/**/*.rs'
              - 'fuzz/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - 'deny.toml'
              - '.config/nextest.toml'
              - '.github/workflows/**'

  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    # 同 ci.yml 的 Rust checks：路径检测失败时本 job 必须红而不是被跳过，
    # 否则两个 required Analyze 会停在 Expected 卡住入队。
    if: ${{ !cancelled() }}
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - name: Fail closed when path detection did not succeed
        if: needs.changes.result != 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Detect CodeQL paths result=${{ needs.changes.result }}; Analyze (${{ matrix.language }}) fails closed."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        if: needs.changes.outputs.analyze == 'true'
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          build-mode: ${{ matrix.build-mode }}
          languages: ${{ matrix.language }}

      - name: Analyze
        if: needs.changes.outputs.analyze == 'true'
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

      # 跳过必须显式记录理由，security-scanning.md §4.1 不允许静默忽略。
      - name: Skip CodeQL analysis for non-source paths
        if: needs.changes.outputs.analyze != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "No CodeQL-applicable source paths changed; skipping Analyze (${{ matrix.language }})."
          echo "main push, scheduled runs and manual dispatch always analyze in full."

      # main ruleset 的原生 code_scanning 规则要求 PR 有 CodeQL 结果，required checks
      # 全绿不能替代（纯文档 PR #1300 被无限期阻断的实证）。skip 分支为两个类别各上传
      # 一份不含告警的 SARIF：tool.driver.name 为 CodeQL、category 与真实分析一致，
      # run 内写明未执行分析与 workflow 运行链接，可与真实分析区分。上传只满足原生
      # 规则的“结果存在”要求，不构成扫描证据（security-scanning.md §2.1、§4.1）。
      # 仅 pull_request 事件上传：merge_group 不适用原生规则（队列证据仍是两个
      # required check）；main push、调度与手工 dispatch 恒全量、从不走本分支。
      # SARIF 生成或上传失败时本 job 必须红，不得静默成功（#1302）。
      - name: Synthesize skip SARIF
        if: needs.changes.outputs.analyze != 'true' && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          # GITHUB_RUN_URL 不是平台默认环境变量，按官方文档用三元变量构造。
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          sarif="${RUNNER_TEMP}/codeql-skip-${{ matrix.language }}.sarif"
          # 不写 automationDetails：upload-sarif 只在该字段缺失时才用 category 输入
          # 填充最终分析 category（upload-lib.ts 的 populateRunAutomationDetails），
          # 显式 id 会把 category 顶成 codeql/skip/* 而非 /language:<语言>。
          # 对象值不做 jq 拼接：jq 1.7 拒绝未加括号的 +（1.8 才放宽），runner 预装 1.7。
          jq -n --arg run_url "$run_url" '{
            version: "2.1.0",
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            runs: [{
              tool: {
                driver: {
                  name: "CodeQL",
                  informationUri: "https://codeql.github.com/",
                  rules: []
                }
              },
              properties: {
                skip: true,
                skipNotice: "路径检测判定无适用源代码路径，未执行分析；本结果只满足原生 code_scanning 规则的结果存在要求，不构成扫描证据。",
                skipReason: "path detection determined no CodeQL-applicable source paths; analysis not executed",
                workflowRunUrl: $run_url
              },
              results: []
            }]
          }' > "$sarif"
          echo "Synthesized skip SARIF for /language:${{ matrix.language }}:"
          cat "$sarif"

      - name: Upload skip SARIF
        if: needs.changes.outputs.analyze != 'true' && github.event_name == 'pull_request'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/codeql-skip-${{ matrix.language }}.sarif
          category: /language:${{ matrix.language }}
