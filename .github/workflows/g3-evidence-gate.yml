name: G3 Evidence Gate Shadow

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - closed
      - synchronize
      - ready_for_review
      - converted_to_draft
      - edited
      - review_requested
      - review_request_removed
  issue_comment:
    types:
      - created
      - edited
      - deleted
  issues:
    types:
      - edited
      - closed
      - reopened
  workflow_run:
    workflows:
      - External Review Signal
    types:
      - completed
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to evaluate
        required: true
        type: string

concurrency:
  group: >-
    g3-evidence-gate-${{
      (
        (github.event_name == 'issue_comment' && github.event.action == 'created' && github.event.comment.body == 'g3-evidence: changed') ||
        (github.event_name == 'pull_request_target' && github.event.action == 'edited' && github.event.changes.body.from != null && github.event.changes.base == null && contains(fromJSON('["dependabot", "dependabot[bot]", "app/dependabot"]'), github.event.sender.login) && contains(fromJSON('["dependabot", "dependabot[bot]", "app/dependabot"]'), github.event.pull_request.user.login))
      )
    }}-${{
      github.run_attempt
    }}-${{
      github.event.pull_request.number ||
      github.event.issue.number ||
      github.event.workflow_run.pull_requests[0].number ||
      inputs.pr_number ||
      github.run_id
    }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: write

jobs:
  resolve-targets:
    name: Resolve direct and dependent PR targets
    if: >-
      (github.event_name != 'issue_comment' || github.event.issue.pull_request != null) &&
      github.run_attempt == 1 &&
      (
        (
          github.event_name == 'issue_comment' &&
          github.event.action == 'created' &&
          github.event.comment.body == 'g3-evidence: changed'
        ) ||
        (
          github.event_name == 'pull_request_target' &&
          github.event.action == 'edited' &&
          github.event.changes.body.from != null &&
          github.event.changes.base == null &&
          contains(fromJSON('["dependabot", "dependabot[bot]", "app/dependabot"]'), github.event.sender.login) &&
          contains(fromJSON('["dependabot", "dependabot[bot]", "app/dependabot"]'), github.event.pull_request.user.login)
        )
      )
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.targets.outputs.count }}
      matrix: ${{ steps.targets.outputs.matrix }}
      publish: ${{ steps.targets.outputs.publish }}
    steps:
      - name: Resolve direct PR numbers from trusted event metadata
        id: direct
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          MANUAL_PR: ${{ inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          workflow_run_prs() {
            local direct_prs
            local head_sha
            local associated_prs

            direct_prs="$(
              jq -c \
                '[.workflow_run.pull_requests[].number |
                  select(type == "number" and . > 0)] | unique' \
                "$GITHUB_EVENT_PATH"
            )"
            if [[ "$(jq -r 'length' <<<"$direct_prs")" != "0" ]]; then
              printf '%s\n' "$direct_prs"
              return
            fi

            head_sha="$(jq -er '.workflow_run.head_sha' "$GITHUB_EVENT_PATH")"
            if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "workflow_run head_sha must be a full lowercase Git OID" >&2
              exit 1
            fi
            associated_prs="$(
              gh api --paginate --slurp \
                "repos/${REPOSITORY}/commits/${head_sha}/pulls?per_page=100"
            )"
            jq -ce \
              '[.[][] |
                select(
                  ((.number | type) == "number") and
                  (.number > 0) and
                  .state == "open" and
                  .base.ref == "main"
                ) |
                .number] |
                unique' \
              <<<"$associated_prs"
          }

          case "$EVENT_NAME" in
            pull_request_target)
              pr_numbers="$(jq -c '[.pull_request.number]' "$GITHUB_EVENT_PATH")"
              ;;
            issue_comment)
              pr_numbers="$(jq -c '[.issue.number]' "$GITHUB_EVENT_PATH")"
              ;;
            workflow_run)
              pr_numbers="$(workflow_run_prs)"
              ;;
            issues)
              jq -e '.issue.number | type == "number" and . > 0' \
                "$GITHUB_EVENT_PATH" >/dev/null
              pr_numbers='[]'
              ;;
            workflow_dispatch)
              if [[ "$MANUAL_PR" =~ ^[1-9][0-9]*$ ]]; then
                pr_numbers="$(jq -cn --argjson number "$MANUAL_PR" '[$number]')"
              else
                echo "pr_number must be a positive integer" >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported trusted event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          pr_numbers="$(
            jq -ce \
              'if type != "array" then error("PR target must be an array")
               else [.[] | select(type == "number" and . > 0)] | unique
               end' \
              <<<"$pr_numbers"
          )"
          echo "pr_numbers=$pr_numbers" >>"$GITHUB_OUTPUT"

      - name: Checkout trusted resolver from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          git diff --exit-code

      - name: Install Rust MSRV toolchain for trusted resolver
        shell: bash
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Include Delivery PRs affected by Related PR changes
        id: targets
        shell: bash
        env:
          MARKER_SUCCESS_EVENT: "${{ github.run_attempt == 1 && github.event_name == 'issue_comment' && github.event.action == 'created' && github.event.comment.body == 'g3-evidence: changed' }}"
          REUSE_MARKER_EVENT: >-
            ${{ github.run_attempt == 1 &&
                github.event_name == 'pull_request_target' &&
                github.event.action == 'edited' &&
                github.event.changes.body.from != null &&
                github.event.changes.base == null &&
                contains(fromJSON('["dependabot", "dependabot[bot]", "app/dependabot"]'), github.event.sender.login) &&
                contains(fromJSON('["dependabot", "dependabot[bot]", "app/dependabot"]'), github.event.pull_request.user.login) }}
          DIRECT_PRS: ${{ steps.direct.outputs.pr_numbers }}
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          publish_check_event="$([[ "$MARKER_SUCCESS_EVENT" == "true" || "$REUSE_MARKER_EVENT" == "true" ]] && echo true || echo false)"

          all_open_prs() {
            local open_prs
            open_prs="$(gh api --paginate \
              "repos/${REPOSITORY}/pulls?state=open&base=main&per_page=100" \
              --jq '.[].number')"
            printf '%s\n' "$open_prs" |
              jq -Rsc 'split("\n") | map(select(length > 0) | tonumber) | unique'
          }

          direct_prs="$DIRECT_PRS"
          resolver_failed=false
          if [[ "$EVENT_NAME" == "issues" ]]; then
            issue_resolver_stderr="${RUNNER_TEMP}/g3-evidence-issue-event-resolver.stderr"
            set +e
            direct_prs="$(
              cargo +1.96.0 run --quiet --locked -p xtask -- \
                resolve-g3-evidence-shadow-issue-event-targets \
                --repo "$REPOSITORY" \
                --event-path "$GITHUB_EVENT_PATH" 2>"$issue_resolver_stderr"
            )"
            issue_resolver_status=$?
            set -e
            if [[ "$issue_resolver_status" -ne 0 ]] || ! jq -e \
              'type == "array" and all(.[]; type == "number" and . > 0)' \
              <<<"$direct_prs" >/dev/null; then
              echo "::warning::Issue event target discovery failed; refreshing every open main PR"
              printf '%s\n' "$direct_prs" >&2
              if [[ -s "$issue_resolver_stderr" ]]; then
                sed 's/^/issue resolver stderr: /' "$issue_resolver_stderr" >&2
              fi
              direct_prs='[]'
              resolver_failed=true
            fi
          fi

          targets="$direct_prs"
          while [[ "$resolver_failed" == "false" ]] && IFS= read -r pr_number; do
            resolver_stderr="${RUNNER_TEMP}/g3-evidence-resolver-${pr_number}.stderr"
            set +e
            discovered="$(
              cargo +1.96.0 run --quiet --locked -p xtask -- \
                resolve-g3-evidence-shadow-targets \
                --repo "$REPOSITORY" \
                --pr "$pr_number" 2>"$resolver_stderr"
            )"
            resolver_status=$?
            set -e
            if [[ "$resolver_status" -ne 0 ]] || ! jq -e \
              'type == "array" and all(.[]; type == "number" and . > 0)' \
              <<<"$discovered" >/dev/null; then
              echo "::warning::Dependent target discovery failed for PR #${pr_number}; refreshing every open main PR"
              printf '%s\n' "$discovered" >&2
              if [[ -s "$resolver_stderr" ]]; then
                sed 's/^/resolver stderr: /' "$resolver_stderr" >&2
              fi
              resolver_failed=true
              break
            fi
            targets="$(
              jq -cn \
                --argjson current "$targets" \
                --argjson discovered "$discovered" \
                '$current + $discovered | unique'
            )"
          done < <(jq -r '.[]' <<<"$direct_prs")

          if [[ "$resolver_failed" == "true" ]]; then
            open_prs="$(all_open_prs)"
            targets="$(
              jq -cn \
                --argjson direct "$direct_prs" \
                --argjson open "$open_prs" \
                '$direct + $open | unique'
            )"
            REUSE_MARKER_EVENT=false
          fi

          matrix="$(
            jq -cn \
              --argjson targets "$targets" \
              --argjson direct "$direct_prs" \
              --argjson marker_success "$MARKER_SUCCESS_EVENT" \
              --argjson reuse_marker "$REUSE_MARKER_EVENT" '
                {include: [
                  $targets[] as $pr |
                  {
                    pr: $pr,
                    allow_success: (
                      ($marker_success and (($direct | index($pr)) != null)) or
                      $reuse_marker
                    ),
                    reuse_marker: $reuse_marker
                  }
                ]}'
          )"
          count="$(jq -r '.include | length' <<<"$matrix")"
          echo "count=$count" >>"$GITHUB_OUTPUT"
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"
          echo "publish=$publish_check_event" >>"$GITHUB_OUTPUT"

  publish-shadow-check:
    name: Publish G3 evidence shadow Check for PR #${{ matrix.pr }}
    needs:
      - resolve-targets
    if: >-
      needs.resolve-targets.outputs.count != '0' &&
      needs.resolve-targets.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-targets.outputs.matrix) }}
    concurrency:
      group: g3-evidence-gate-pr-${{ matrix.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted validator from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          git diff --exit-code

      - name: Install Rust MSRV toolchain for trusted validator
        shell: bash
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Evaluate metadata and publish completed shadow Check
        shell: bash
        env:
          ALLOW_SUCCESS: "${{ matrix.allow_success }}"
          GH_TOKEN: ${{ github.token }}
          MARKER_COMMENT_ID: "${{ matrix.allow_success && github.event.comment.id || '' }}"
          REUSE_MARKER: "${{ matrix.reuse_marker }}"
          PR_NUMBER: ${{ matrix.pr }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          set -euo pipefail

          initial_pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          initial_head="$(jq -er '.head.sha' <<<"$initial_pr")"
          initial_base="$(jq -er '.base.sha' <<<"$initial_pr")"
          initial_head_repo="$(jq -er '.head.repo.full_name' <<<"$initial_pr")"
          if [[ ! "$initial_head" =~ ^[0-9a-f]{40}$ || ! "$initial_base" =~ ^[0-9a-f]{40}$ ]]; then
            echo "PR identity must contain full lowercase Git OIDs" >&2
            exit 1
          fi
          if [[ "$initial_head_repo" != "$REPOSITORY" ]]; then
            echo "::notice::PR #${PR_NUMBER} is cross-repository; no G3 evidence shadow Check is published"
            exit 0
          fi

          initial_eligibility="$(
            jq -r '
              if .state != "open" then "not-open"
              elif .draft then "draft"
              elif .base.ref != "main" then "non-main"
              else "eligible"
              end
            ' <<<"$initial_pr"
          )"

          if [[ "$initial_eligibility" == "eligible" ]]; then
            marker_comment_id="$MARKER_COMMENT_ID"
            if [[ "$REUSE_MARKER" == "true" ]]; then
              marker_comment_id="$(
                gh api --paginate --slurp \
                  "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" |
                  jq -r '
                    [.[][] |
                      select(
                        .body == "g3-evidence: changed" and
                        .created_at == .updated_at
                      )] |
                    sort_by(.created_at, .id) |
                    last |
                    (.id // "")
                  '
              )"
            fi

            evaluate_evidence() {
              local eligibility_exit
              local eligibility_output
              local marker_exit
              local marker_output

              set +e
              validation_output="$(
                cargo +1.96.0 run --locked -p xtask -- \
                  check-gate-evidence-target \
                  --repo "$REPOSITORY" \
                  --pr "$PR_NUMBER" 2>&1
              )"
              validation_exit=$?
              set -e
              if [[ "$validation_exit" -eq 0 && "$ALLOW_SUCCESS" == "true" ]]; then
                set +e
                eligibility_output="$(
                  cargo +1.96.0 run --locked -p xtask -- \
                    check-g3-shadow-success-eligibility \
                    --repo "$REPOSITORY" \
                    --pr "$PR_NUMBER" 2>&1
                )"
                eligibility_exit=$?
                set -e
                validation_output="${validation_output}\n\n${eligibility_output}"
                if [[ "$eligibility_exit" -ne 0 ]]; then
                  validation_exit=$eligibility_exit
                elif [[ ! "$marker_comment_id" =~ ^[1-9][0-9]*$ ]]; then
                  validation_output="${validation_output}\n\nTrusted marker comment ID is missing or invalid."
                  validation_exit=1
                else
                  set +e
                  marker_output="$(
                    cargo +1.96.0 run --locked -p xtask -- \
                      check-g3-evidence-marker \
                      --repo "$REPOSITORY" \
                      --pr "$PR_NUMBER" \
                      --comment-id "$marker_comment_id" 2>&1
                  )"
                  marker_exit=$?
                  set -e
                  validation_output="${validation_output}\n\n${marker_output}"
                  if [[ "$marker_exit" -ne 0 ]]; then
                    validation_exit=$marker_exit
                  fi
                fi
              fi
            }

            evaluate_evidence
          else
            echo "::notice::PR #${PR_NUMBER} is not eligible for G3 evidence: ${initial_eligibility}; no G3 evidence shadow Check is published"
            exit 0
          fi

          final_pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          final_head="$(jq -er '.head.sha' <<<"$final_pr")"
          final_base="$(jq -er '.base.sha' <<<"$final_pr")"
          final_head_repo="$(jq -er '.head.repo.full_name' <<<"$final_pr")"
          final_eligibility="$(
            jq -r --arg repo "$REPOSITORY" '
              if .state != "open" then "not-open"
              elif .draft then "draft"
              elif .base.ref != "main" then "non-main"
              elif .head.repo.full_name != $repo then "cross-repository"
              else "eligible"
              end
            ' <<<"$final_pr"
          )"
          if [[ "$initial_head" != "$final_head" || "$initial_base" != "$final_base" || "$final_head_repo" != "$REPOSITORY" ]]; then
            validation_output="${validation_output}\n\nPR identity changed while G3 evidence was being evaluated; publishing failure on the originally evaluated head."
            validation_exit=1
          fi
          if [[ "$final_eligibility" != "eligible" ]]; then
            echo "::notice::PR #${PR_NUMBER} left the eligible set during evaluation: ${initial_eligibility} -> ${final_eligibility}; no shadow Check is published for this race"
            exit 0
          fi
          if [[ "$initial_eligibility" != "$final_eligibility" ]]; then
            validation_output="${validation_output}\n\nPR eligibility changed during evaluation: ${initial_eligibility} -> ${final_eligibility}"
            validation_exit=1
          fi

          if [[ "$validation_exit" -eq 0 && "$ALLOW_SUCCESS" == "true" && "$final_eligibility" == "eligible" ]]; then
            first_validation_output="$validation_output"
            evaluate_evidence
            validation_output="${first_validation_output}\n\nFinal trusted revalidation:\n${validation_output}"

            publish_pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
            publish_head="$(jq -er '.head.sha' <<<"$publish_pr")"
            publish_base="$(jq -er '.base.sha' <<<"$publish_pr")"
            publish_head_repo="$(jq -er '.head.repo.full_name' <<<"$publish_pr")"
            publish_eligibility="$(
              jq -r --arg repo "$REPOSITORY" '
                if .state != "open" then "not-open"
                elif .draft then "draft"
                elif .base.ref != "main" then "non-main"
                elif .head.repo.full_name != $repo then "cross-repository"
                else "eligible"
                end
              ' <<<"$publish_pr"
            )"
            if [[ "$final_head" != "$publish_head" || "$final_base" != "$publish_base" || "$final_head_repo" != "$publish_head_repo" ]]; then
              validation_output="${validation_output}\n\nPR identity changed during final trusted revalidation."
              validation_exit=1
            fi
            if [[ "$publish_eligibility" != "eligible" ]]; then
              echo "::notice::PR #${PR_NUMBER} left the eligible set during final trusted revalidation: ${final_eligibility} -> ${publish_eligibility}; no shadow Check is published for this race"
              exit 0
            fi
            if [[ "$final_eligibility" != "$publish_eligibility" ]]; then
              validation_output="${validation_output}\n\nPR eligibility changed during final trusted revalidation: ${final_eligibility} -> ${publish_eligibility}"
              validation_exit=1
            fi
          fi

          validation_output="${validation_output:0:14000}"
          if [[ "$validation_exit" -eq 0 && "$ALLOW_SUCCESS" == "true" && "$final_eligibility" == "eligible" ]]; then
            conclusion="success"
            title="G3 evidence accepted"
          elif [[ "$validation_exit" -eq 0 ]]; then
            conclusion="failure"
            title="Fresh G3 evidence marker required"
            validation_output="${validation_output}\n\nValidation passed, but only a newly created exact g3-evidence: changed marker may publish success."
          else
            conclusion="failure"
            title="G3 evidence rejected"
          fi
          summary="$(printf 'Trusted validator: refs/heads/main@%s\n\n%s' "$(git rev-parse HEAD)" "$validation_output")"
          external_id="g3-evidence-shadow:${REPOSITORY}:pr-${PR_NUMBER}:${initial_head}:${conclusion}:${RUN_ID}:${RUN_ATTEMPT}"
          payload="$(
            jq -n \
              --arg name "G3 Evidence Gate Shadow" \
              --arg head_sha "$initial_head" \
              --arg conclusion "$conclusion" \
              --arg details_url "$RUN_URL" \
              --arg external_id "$external_id" \
              --arg title "$title" \
              --arg summary "$summary" \
              '{
                name: $name,
                head_sha: $head_sha,
                status: "completed",
                conclusion: $conclusion,
                details_url: $details_url,
                external_id: $external_id,
                output: {title: $title, summary: $summary}
              }'
          )"
          receipt="$(
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "repos/${REPOSITORY}/check-runs" \
              --input - <<<"$payload"
          )"
          jq -e \
            --arg head_sha "$initial_head" \
            --arg conclusion "$conclusion" '
              .name == "G3 Evidence Gate Shadow" and
              .head_sha == $head_sha and
              .status == "completed" and
              .conclusion == $conclusion and
              .app.slug == "github-actions"
            ' <<<"$receipt" >/dev/null
          jq '{id, name, head_sha, status, conclusion, details_url, external_id, app: .app.slug}' \
            <<<"$receipt"
