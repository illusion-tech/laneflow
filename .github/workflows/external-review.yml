name: External Review

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
  merge_group:
    types:
      - checks_requested
  workflow_run:
    workflows:
      - External Review Signal
    types:
      - completed
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to evaluate
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  publish:
    name: Publish External Review Check
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    concurrency:
      group: >-
        external-review-${{
          github.event.pull_request.number ||
          github.event.workflow_run.pull_requests[0].number ||
          github.event.merge_group.head_sha ||
          inputs.pr_number ||
          github.run_id
        }}
      cancel-in-progress: true
    steps:
      - name: Checkout trusted validator from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          git diff --exit-code
          test -f .github/trusted-reviewers.json

      - name: Install Rust MSRV toolchain for trusted validator
        shell: bash
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Publish External Review Check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          MANUAL_PR: ${{ inputs.pr_number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          set -euo pipefail

          trusted_ref_oid="$(git rev-parse HEAD)"
          extra_args=()
          pr_number=""

          case "$EVENT_NAME" in
            pull_request_target)
              pr_number="$(jq -er '.pull_request.number' "$GITHUB_EVENT_PATH")"
              ;;
            workflow_dispatch)
              if [[ ! "$MANUAL_PR" =~ ^[1-9][0-9]*$ ]]; then
                echo "pr_number must be a positive integer" >&2
                exit 1
              fi
              pr_number="$MANUAL_PR"
              ;;
            workflow_run)
              pr_number="$(jq -er '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
              if [[ -z "$pr_number" ]]; then
                head_sha="$(jq -er '.workflow_run.head_sha' "$GITHUB_EVENT_PATH")"
                if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
                  echo "workflow_run head_sha must be a full lowercase Git OID" >&2
                  exit 1
                fi
                pr_number="$(
                  gh api --paginate --slurp \
                    "repos/${REPOSITORY}/commits/${head_sha}/pulls?per_page=100" \
                    --jq '[.[][] | select(.state == "open" and .base.ref == "main") | .number] | unique | .[0] // empty'
                )"
              fi
              if [[ -z "$pr_number" ]]; then
                echo "No open main-targeting PR associated with the review signal" >&2
                exit 0
              fi
              ;;
            merge_group)
              head_ref="$(jq -er '.merge_group.head_ref' "$GITHUB_EVENT_PATH")"
              head_sha="$(jq -er '.merge_group.head_sha' "$GITHUB_EVENT_PATH")"
              extra_args+=(--merge-group-head-ref "$head_ref" --head-sha "$head_sha" --require-publish)
              pr_number=""
              ;;
            *)
              echo "Unsupported trusted event: ${EVENT_NAME}" >&2
              exit 1
              ;;
          esac

          cmd=(
            cargo +1.96.0 run --locked -p xtask --
            publish-external-review-check
            --repo "$REPOSITORY"
            --details-url "$RUN_URL"
            --run-id "$RUN_ID"
            --run-attempt "$RUN_ATTEMPT"
            --trusted-ref-oid "$trusted_ref_oid"
          )
          if [[ -n "${pr_number}" ]]; then
            cmd+=(--pr "$pr_number")
          fi
          if [[ ${#extra_args[@]} -gt 0 ]]; then
            cmd+=("${extra_args[@]}")
          fi
          "${cmd[@]}"
