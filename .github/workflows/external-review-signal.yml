name: External Review Signal

on:
  pull_request_review:
    types:
      - submitted
      - dismissed

permissions: {}

jobs:
  signal:
    name: Emit review-change signal
    runs-on: ubuntu-latest
    steps:
      - name: Signal trusted publisher
        shell: bash
        run: echo "A native PullRequestReview was submitted or dismissed; the trusted publisher will re-read current PR state."
