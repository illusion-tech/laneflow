name: Road Editing Codegen

on:
  pull_request:
    paths:
      - "schemas/road-editing/**"
      - "crates/laneflow-compiler/**"
      - "crates/laneflow-road-editing-wire/**"
      - "**/Cargo.toml"
      - "research/issue-296-road-editing-source-calibration/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/road-editing-codegen.yml"
  push:
    branches:
      - main
    paths:
      - "schemas/road-editing/**"
      - "crates/laneflow-compiler/**"
      - "crates/laneflow-road-editing-wire/**"
      - "**/Cargo.toml"
      - "research/issue-296-road-editing-source-calibration/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/road-editing-codegen.yml"

permissions:
  contents: read

jobs:
  codegen:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Ubuntu pinned flatc
            os: ubuntu-latest
            asset: Linux.flatc.binary.clang++-18.zip
            bytes: 2750934
            sha256: 50c1915deeeb714f2a05c8ec795bd1af898d251a62e2774067703b29188efc90
          - label: Windows pinned flatc
            os: windows-latest
            asset: Windows.flatc.binary.zip
            bytes: 1412094
            sha256: fff9445c9db907227bc64b54cc98743084c4949282aa4e576cff6a955724ddc8
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust MSRV toolchain
        shell: bash
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: laneflow-msrv-1.96.0-road-editing-codegen-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: true

      - name: Download and verify pinned flatc on Ubuntu
        if: runner.os == 'Linux'
        id: flatc-linux
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          EXPECTED_BYTES: ${{ matrix.bytes }}
          EXPECTED_SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/flatc.zip"
          destination="$RUNNER_TEMP/flatc"
          curl --fail --location --show-error \
            "https://github.com/google/flatbuffers/releases/download/v25.12.19/$ASSET" \
            --output "$archive"
          test "$(stat --format=%s "$archive")" = "$EXPECTED_BYTES"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$destination"
          unzip -q "$archive" -d "$destination"
          flatc_path="$(find "$destination" -type f -name flatc -print -quit)"
          test -n "$flatc_path"
          chmod +x "$flatc_path"
          printf 'flatc_path=%s\n' "$flatc_path" >> "$GITHUB_OUTPUT"

      - name: Download and verify pinned flatc on Windows
        if: runner.os == 'Windows'
        id: flatc-windows
        shell: pwsh
        env:
          ASSET: ${{ matrix.asset }}
          EXPECTED_BYTES: ${{ matrix.bytes }}
          EXPECTED_SHA256: ${{ matrix.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'flatc.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'flatc'
          $uri = "https://github.com/google/flatbuffers/releases/download/v25.12.19/$env:ASSET"
          Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $archive
          $actualBytes = (Get-Item -LiteralPath $archive).Length
          if ($actualBytes -ne [int64]$env:EXPECTED_BYTES) {
            throw "flatc asset byte length mismatch: expected=$env:EXPECTED_BYTES actual=$actualBytes"
          }
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $env:EXPECTED_SHA256) {
            throw "flatc asset SHA-256 mismatch: expected=$env:EXPECTED_SHA256 actual=$actualSha256"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $flatc = Get-ChildItem -LiteralPath $destination -Recurse -File -Filter 'flatc.exe' |
            Select-Object -First 1
          if ($null -eq $flatc) {
            throw 'flatc.exe was not present in the verified archive'
          }
          "flatc_path=$($flatc.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check exact code generation and unsafe boundary
        shell: bash
        env:
          LINUX_FLATC: ${{ steps.flatc-linux.outputs.flatc_path }}
          WINDOWS_FLATC: ${{ steps.flatc-windows.outputs.flatc_path }}
        run: |
          set -euo pipefail
          flatc_path="${LINUX_FLATC:-${WINDOWS_FLATC:-}}"
          test -n "$flatc_path"
          cargo +1.96.0 run --locked -p xtask -- \
            check-road-editing-codegen --flatc "$flatc_path"

      - name: Compile generated Rust binding
        shell: bash
        run: cargo +1.96.0 test --locked -p laneflow-road-editing-wire

      - name: Checkout exact FlatBuffers source for cross-language fixtures
        if: runner.os == 'Linux'
        id: flatbuffers-source
        shell: bash
        env:
          FLATBUFFERS_COMMIT: 7e163021e59cca4f8e1e35a7c828b5c6b7915953
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/flatbuffers-source"
          git init --quiet "$source_root"
          git -C "$source_root" remote add origin https://github.com/google/flatbuffers.git
          git -C "$source_root" fetch --quiet --depth 1 origin "$FLATBUFFERS_COMMIT"
          git -C "$source_root" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$source_root" rev-parse HEAD)" = "$FLATBUFFERS_COMMIT"
          test -z "$(git -C "$source_root" status --porcelain=v1 --untracked-files=no)"
          printf 'source_root=%s\n' "$source_root" >> "$GITHUB_OUTPUT"

      - name: Verify C++ and C# writers through the production Rust reader
        if: runner.os == 'Linux'
        shell: bash
        env:
          FLATC_PATH: ${{ steps.flatc-linux.outputs.flatc_path }}
          FLATBUFFERS_SOURCE: ${{ steps.flatbuffers-source.outputs.source_root }}
        run: |
          set -euo pipefail
          cargo +1.96.0 run --locked -p xtask -- \
            check-road-editing-cross-language \
            --flatc "$FLATC_PATH" \
            --flatbuffers-source "$FLATBUFFERS_SOURCE" \
            --cxx "$(command -v c++)" \
            --dotnet "$(command -v dotnet)"
          cargo +1.96.0 run --locked \
            -p issue-296-road-editing-source-calibration \
            --bin calibrate -- \
            road-editing-cross-language \
            target/road-editing-codegen/cross-language/cpp.lfre \
            target/road-editing-codegen/cross-language/csharp.lfre
