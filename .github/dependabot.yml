version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    # bevy 伞形 crate 与子 crate 严格版本绑定，必须在同一 PR 内整体升级（#883、#912）。
    groups:
      bevy:
        patterns:
          - "bevy*"
        update-types:
          - "major"
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    # codeql-action 的 init/analyze/upload-sarif 必须同版本（拆分升级会以
    # configuration error 双杀 Analyze，#1316/#1317），用分组让 Dependabot
    # 在同一 PR 内整体升级；其余 actions 保持单独 PR（#1326）。
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
