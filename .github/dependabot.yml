version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    # bevy 伞形 crate 与子 crate 严格版本绑定，必须在同一 PR 内整体升级（#883、#912）。
    groups:
      bevy:
        patterns:
          - "bevy*"
        update-types:
          - "major"
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
