name: 任务
description: 创建不属于功能、缺陷或专用模板的具体工作
type: Task
body:
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: 为什么需要完成这项工作？
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 目标
      description: 完成后应得到什么可验证结果？
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: 非目标
      description: 明确不在本次范围内的内容。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      description: 可多选；提交后由维护者把所选项同步为对应的 area:* 标签。
      multiple: true
      options:
        - area:runtime
        - area:compiler
        - area:static-network
        - area:spatial
        - area:scenario
        - area:data-spec
        - area:adapter
        - area:authoring
        - area:example
        - area:docs
        - area:governance
        - area:ci
        - area:release
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: 相关文档 / ADR
      description: 链接相关文档，或说明为什么不需要。
    validations:
      required: false
