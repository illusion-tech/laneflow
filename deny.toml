[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "wasm32-unknown-unknown",
]

[advisories]
unmaintained = "workspace"
unsound = "all"
ignore = [
    # #935 ruzstd 0.8.3 解压炸弹（仅 DoS）。来源：laneflow-bevy `native-example` → bevy 0.20
    # `3d_api` 固定启用的 `zstd_rust` → bevy_image 0.20.0（仍要求 ruzstd ^0.8，#912 升级时复核）。只用于解码
    # Bevy 编译进二进制的 KTX2 LUT；LaneFlow 不经 AssetServer 加载外部资源，默认特性不含该依赖。
    # 替代方案（改用 zstd_c、放弃 3d_api、patch 上游）代价高于收益。
    # 机器约束：[bans] 只允许 bevy_image 直接依赖 ruzstd，新增依赖路径即失败。依赖图中不再有
    # 受影响 ruzstd 时会出现 advisory-not-detected 警告（fuzz manifest 共用本配置且不含 Bevy，
    # 不能设为 deny），见到即删除本条。cargo-deny 0.20.2 不支持 ignore 的 `expiry`/`allow`，
    # 人工到期：每次 Bevy 升级 PR 复核，最迟 2027-01-13。owner @wangzishi。
    { id = "RUSTSEC-2026-0344", reason = "#935: ruzstd 只解码 Bevy 内嵌的可信 KTX2 资产；等待 bevy_image 支持 ruzstd >= 0.9.1" },
]

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
# 例外只接受下列精确 crate/version，不扩展全局 allow-list；版本漂移时必须重新审查。
exceptions = [
    # #912 Bevy 0.20 `native-example` 的显式 render/window 路径需要以下传递依赖；
    # 在不替换 Bevy 渲染实现路径的前提下，没有只使用全局 allow-list 的等价依赖图。
    # 这些许可证均为宽松许可证，不引入 copyleft；第三方归属义务仍按上游许可证保留。
    { allow = ["MIT-0"], crate = "encase@0.12.0" },
    { allow = ["MIT-0"], crate = "encase_derive@0.12.0" },
    { allow = ["MIT-0"], crate = "encase_derive_impl@0.12.0" },
    { allow = ["ISC"], crate = "libloading@0.8.9" },
    # #376 LFRE fuzz harness：libfuzzer-sys 以 (MIT OR Apache-2.0) AND NCSA 发布；
    # NCSA 是宽松许可证（OSI 认证），仅对该精确版本放行，版本漂移时重新审查。
    { allow = ["NCSA"], crate = "libfuzzer-sys@0.4.13" },
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow = []
deny = [
    # #935 RUSTSEC-2026-0344 例外只覆盖 bevy_image 的 KTX2 解码路径；其他 crate 直接依赖 ruzstd 须重新审查。
    { crate = "ruzstd", wrappers = ["bevy_image"], reason = "#935: ruzstd 仅允许经 bevy_image 解码 Bevy 内嵌的可信 KTX2 资产" },
    # #1022 ADR 0033：摘要算法直接依赖方的唯一登记名单。新增直接依赖方须在同一变更中更新此处，
    # 并在 Issue 或设计文档中写明新增摘要的角色与验证方。bevy_animation、bevy_asset 是 Bevy
    # 上游的传递依赖，不受 ADR 0033 约束，登记只为保留现有依赖图。
    { crate = "sha2", wrappers = [
        "laneflow-bevy",
        "laneflow-compiler",
        "laneflow-corridor-generator",
        "laneflow-format",
        "laneflow-junction-generator",
        "laneflow-lust-converter",
        "laneflow-post-p3-research",
        "laneflow-runtime",
        "laneflow-static-network",
        "laneflow-synth-generator",
        "laneflow-urban-generator",
        "laneflow-urban-harness",
        "xtask",
    ], reason = "#1022: 摘要须按 ADR 0033 写明角色；新增直接依赖方须登记" },
    { crate = "blake3", wrappers = [
        "bevy_animation",
        "bevy_asset",
        "laneflow-compiler",
        "laneflow-lust-converter", # #1029：仅测试构建中的摘要对比实验
        "laneflow-runtime",
        "laneflow-synth-harness",
        "laneflow-urban-harness",
    ], reason = "#1022: 摘要须按 ADR 0033 写明角色；新增直接依赖方须登记" },
    # ADR 0033：urban harness 使用瞬态指纹，LuST 转换器按 #1051/§4.1 使用
    # 确定性派生摘要；ruzstd 是 bevy_image 的既有传递依赖。
    { crate = "twox-hash", wrappers = [
        "laneflow-lust-converter",
        "laneflow-urban-harness",
        "ruzstd",
    ], reason = "#1042 / #1053: 瞬态指纹与确定性派生须写明角色；新增直接依赖方须登记" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
