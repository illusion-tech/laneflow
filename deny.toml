[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "wasm32-unknown-unknown",
]

[advisories]
unmaintained = "workspace"
unsound = "all"
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
# 例外只接受下列精确 crate/version，不扩展全局 allow-list；版本漂移时必须重新审查。
exceptions = [
    # #172 Bevy 0.19 debug Gizmos smoke 的显式 render/window 路径需要以下传递依赖；
    # 在不替换 Bevy/Gizmos 实现路径的前提下，没有只使用全局 allow-list 的等价依赖图。
    # 这些许可证均为宽松许可证，不引入 copyleft；第三方归属义务仍按上游许可证保留。
    { allow = ["BSD-2-Clause"], crate = "arrayref@0.3.9" },
    { allow = ["MIT-0"], crate = "encase@0.12.0" },
    { allow = ["MIT-0"], crate = "encase_derive@0.12.0" },
    { allow = ["MIT-0"], crate = "encase_derive_impl@0.12.0" },
    { allow = ["CC0-1.0"], crate = "hexf-parse@0.2.1" },
    { allow = ["ISC"], crate = "libloading@0.8.9" },
    { allow = ["BSD-3-Clause"], crate = "pp-rs@0.2.1" },
    # #376 LFRE fuzz harness：libfuzzer-sys 以 (MIT OR Apache-2.0) AND NCSA 发布；
    # NCSA 是宽松许可证（OSI 认证），仅对该精确版本放行，版本漂移时重新审查。
    { allow = ["NCSA"], crate = "libfuzzer-sys@0.4.13" },
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
