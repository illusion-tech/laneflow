[package]
name = "laneflow-synth-harness"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[features]
allocation = ["dep:stats_alloc", "laneflow-runtime/execution-evidence", "laneflow-bevy/pose-profiling"]

[dependencies]
bevy_app = { version = "0.20", default-features = false, features = ["std"] }
bevy_ecs = { version = "0.20", default-features = false, features = ["std"] }
bevy_math = { version = "0.20", default-features = false }
bevy_time = { version = "0.20", default-features = false, features = ["std"] }
bevy_transform = { version = "0.20", default-features = false, features = ["bevy-support", "std"] }
blake3 = "1.8"
laneflow-bevy = { version = "0.0.0", path = "../../crates/laneflow-bevy" }
laneflow-format = { version = "0.0.0", path = "../../crates/laneflow-format" }
laneflow-runtime = { version = "0.0.0", path = "../../crates/laneflow-runtime" }
laneflow-spatial = { version = "0.0.0", path = "../../crates/laneflow-spatial" }
laneflow-static-contract = { version = "0.0.0", path = "../../crates/laneflow-static-contract" }
laneflow-static-network = { version = "0.0.0", path = "../../crates/laneflow-static-network" }
laneflow-synth-generator = { version = "0.0.0", path = "../laneflow-synth-generator" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = { version = "0.11", default-features = false }
stats_alloc = { version = "=0.1.10", optional = true }
thiserror = "2.0"

[target.'cfg(windows)'.dependencies]
win32job = "=2.0.3"

[dev-dependencies]
tempfile = "3.27"

[lints]
workspace = true
