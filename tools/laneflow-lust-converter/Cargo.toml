[package]
name = "laneflow-lust-converter"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
laneflow-compiler = { version = "0.0.0", path = "../../crates/laneflow-compiler" }
