[package]
name = "laneflow-urban-harness"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false
# 显式关闭构建脚本自动发现：正式测量二进制的构建面不含游离 build.rs。
build = false

[features]
motion-kernel-evidence = ["laneflow-runtime/motion-kernel-evidence"]
# 诊断输出附带观察窗口的调度统计与资源账（#972）；计时含插桩，不作为认证。
execution-evidence = ["laneflow-runtime/execution-evidence"]
adapter = ["dep:bevy_app", "dep:bevy_ecs", "dep:bevy_math", "dep:bevy_time", "dep:bevy_transform", "dep:laneflow-bevy", "dep:laneflow-spatial"]
allocation = ["adapter", "dep:stats_alloc"]
pose-profiling = ["adapter", "laneflow-bevy/pose-profiling"]

[dependencies]
bevy_app = { version = "0.20", default-features = false, features = ["std"], optional = true }
bevy_ecs = { version = "0.20", default-features = false, features = ["std"], optional = true }
bevy_math = { version = "0.20", default-features = false, optional = true }
bevy_time = { version = "0.20", default-features = false, features = ["std"], optional = true }
bevy_transform = { version = "0.20", default-features = false, features = ["bevy-support", "std"], optional = true }
blake3 = "1.8"
laneflow-bevy = { version = "0.0.0", path = "../../crates/laneflow-bevy", optional = true }
laneflow-spatial = { version = "0.0.0", path = "../../crates/laneflow-spatial", optional = true }
laneflow-compiler = { version = "0.0.0", path = "../../crates/laneflow-compiler" }
laneflow-format = { version = "0.0.0", path = "../../crates/laneflow-format", features = ["std"] }
laneflow-runtime = { version = "0.0.0", path = "../../crates/laneflow-runtime" }
laneflow-static-contract = { version = "0.0.0", path = "../../crates/laneflow-static-contract" }
laneflow-static-network = { version = "0.0.0", path = "../../crates/laneflow-static-network" }
laneflow-urban-generator = { version = "0.0.0", path = "../laneflow-urban-generator" }
rayon-core = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.11", default-features = false }
thiserror = "2.0"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt"] }
twox-hash = { version = "2.1", default-features = false, features = ["xxhash3_64"] }
stats_alloc = { version = "=0.1.10", optional = true }
toml = "1.1.3"

[dev-dependencies]
laneflow-audit-test-support = { version = "0.0.0", path = "../laneflow-audit-test-support" }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tempfile = "3.27"

[lints]
workspace = true
