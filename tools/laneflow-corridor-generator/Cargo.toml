[package]
name = "laneflow-corridor-generator"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
laneflow-compiler = { version = "0.0.0", path = "../../crates/laneflow-compiler" }
laneflow-format = { version = "0.0.0", path = "../../crates/laneflow-format" }
laneflow-scenario = { version = "0.0.0", path = "../../crates/laneflow-scenario" }
laneflow-spatial = { version = "0.0.0", path = "../../crates/laneflow-spatial" }
serde = { version = "1.0", features = ["derive"] }
sha2 = { version = "0.11", default-features = false }
thiserror = "2.0"
toml = "1.1.3"

[dev-dependencies]
laneflow-runtime = { version = "0.0.0", path = "../../crates/laneflow-runtime" }
laneflow-static-contract = { version = "0.0.0", path = "../../crates/laneflow-static-contract" }
laneflow-static-network = { version = "0.0.0", path = "../../crates/laneflow-static-network" }

[lints]
workspace = true
