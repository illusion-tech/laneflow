[package]
name = "laneflow-gate-summary"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
laneflow-format = { version = "0.0.0", path = "../../crates/laneflow-format", features = ["std"] }
laneflow-static-contract = { version = "0.0.0", path = "../../crates/laneflow-static-contract" }
laneflow-static-network = { version = "0.0.0", path = "../../crates/laneflow-static-network" }
laneflow-synth-generator = { version = "0.0.0", path = "../laneflow-synth-generator" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2.0"
toml = "1.1.3"

[dev-dependencies]
tempfile = "3.27"

[lints]
workspace = true
