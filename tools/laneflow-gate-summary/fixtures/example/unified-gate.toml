# 统一五轴汇总的自包含示例输入（lf-unified-gate-manifest-2）。
#
# 证据全部取自本 crate 的 tests/fixtures：--repo-root 指向 tests/fixtures/repo，
# --evidence-root 指向 tests/fixtures/evidence-root。README 默认命令与
# tests/summary.rs 都消费本文件，失败关闭路径的测试在其基础上逐项改写。
# 数值与提交号均为测试用值，不是任何负载的真实结论。

format = "lf-unified-gate-manifest-2"
title = "统一汇总示例"
