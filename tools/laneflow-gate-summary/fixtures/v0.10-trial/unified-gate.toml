# 本副本引用现有正式记录做试跑：routing 两格、城市性能格的验收提交核对、
# 以及 #1279 计时记录按 #1268 验收标准标为未完成；试跑结果不作为 v0.10 结论。
# #305 正式汇总：复制本文件，补齐 #1279 记录（routing-kv）、验收提交核对结论与
# 各矩阵 summary.json / gate.json 挂接，改 --mode formal --require-complete 运行；
# 制作步骤见 tools/laneflow-gate-summary/README.md。
