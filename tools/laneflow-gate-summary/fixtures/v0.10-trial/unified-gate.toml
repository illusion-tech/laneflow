[global]
single_world_statement = "本汇总不以多世界（Multi-world）吞吐或引擎适配器细节层次替代单世界扩展语义与正确性（#539 验收标准、ADR 0021）。"

[global.performance]
verdict = "未认证"
product_status = "Product TBD / Uncertified"
