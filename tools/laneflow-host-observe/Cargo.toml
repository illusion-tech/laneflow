[package]
name = "laneflow-host-observe"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "测量环境记录、进程快照与子进程观测（docs/design/host-observe.md）。"
publish = false

[dependencies]
laneflow-os-probe = { version = "0.0.0", path = "../laneflow-os-probe" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.11", default-features = false }
sysinfo = { version = "0.40.0", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3.27"

[lints]
workspace = true
