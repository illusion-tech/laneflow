definition = "绑定同一拍初世界及必要派生查询的内部借用视图；不克隆整个世界，不允许领域函数借此修改已提交状态。"
symbols = [{ value = "StepReadView", kind = "type" }]
references = [{ document = "design-traffic-runtime-phase-protocol" }]

[[terms]]
id = "stream-right-of-way-rule"
name = "通行流路权规则"
english_aliases = ["stream right of way rule"]
domains = ["runtime"]
definition = "针对参与者流及类别，选择法规优先级、让行目标和间隙参数的规则；不覆盖本地物理先后顺序。"
symbols = [{ value = "StreamRightOfWayRule", kind = "type" }]
references = [{ document = "design-traffic-runtime-right-of-way-policy" }]

[[terms]]
id = "strongly-connected-component"
name = "强连通分量"
english_aliases = ["strongly connected component"]
domains = ["runtime"]
definition = "资源依赖图中任意两节点互相可达、需要作为循环依赖分析单元的最大子图。"
symbols = [{ value = "SCC", kind = "acronym" }]
references = [{ document = "design-traffic-runtime-parallel-execution" }]

[[terms]]
id = "tick-workspace"
name = "步进工作区"
english_aliases = ["tick workspace"]
domains = ["runtime"]
definition = "单次步进的意图、资源暂存、下一状态和待发布结果及其复用存储；失败丢弃本次结果，不清空上次成功发布的批次。"
symbols = [{ value = "TickWorkspace", kind = "type" }]
references = [{ document = "design-traffic-runtime-phase-protocol" }]

[[terms]]
id = "traffic-configuration"
name = "交通配置"
english_aliases = ["Traffic Configuration"]
domains = ["runtime"]
definition = "影响交通准入与行为的四类容量及固定步长；不含执行参数。"
symbols = [{ value = "WorldConfig", kind = "type" }]
references = [{ document = "design-traffic-runtime-execution-config" }]

[[terms]]
id = "traffic-execution-domain"
name = "交通执行域"
english_aliases = ["traffic execution domain"]
domains = ["runtime"]
definition = "共享网络、运动/安全求解和生命周期契约的一类交通参与单元；与准入用 `ParticipantClass` 正交。"
references = [{ document = "adr-0021" }]
scope_notes = ["当前交付为道路机动车特化；长期通用概念不表示其他执行域已经实现，也不改写历史车辆证据。"]

[[terms]]
id = "traffic-fidelity"
name = "交通保真度"
english_aliases = ["traffic fidelity"]
domains = ["runtime"]
definition = "交通个体、时间、空间、规则与事件语义相对精确路径的保留程度。"
references = [{ document = "design-traffic-runtime-parallel-execution" }]

[[terms]]
id = "traffic-participant"
name = "交通参与者"
english_aliases = ["traffic participant"]
domains = ["runtime"]
definition = "直接使用交通网络或占用交通空间的动态参与者；不等同于城市居民、乘客、出行需求或 AI Agent。"
references = [{ document = "adr-0021" }]

[[terms]]
id = "traffic-participant-unit"
name = "交通参与单元"
english_aliases = ["traffic participant unit"]
domains = ["runtime"]
definition = "交通运行时中可独立保留身份的计数原子；机动车、骑行者组合、行人或轨道运营编组的具体原子由对应执行域 G1 冻结。"
references = [{ document = "adr-0021" }]
scope_notes = ["当前交付为道路机动车特化；长期通用概念不表示其他执行域已经实现，也不改写历史车辆证据。"]
related = ["traffic-execution-domain", "vehicle-runtime-unit"]

[[terms]]
id = "traffic-transition-event"
name = "交通转移事件"
english_aliases = ["traffic transition event"]
definition = "一次成功固定步进已经提交的机动门、等待区、冲突区或机动完成变化。"
domains = ["runtime"]
references = [{ document = "design-waiting-zone-conflict-right-of-way" }]
symbols = [{ value = "TrafficTransitionEvent", kind = "type" }]

[[terms]]
id = "traffic-world"
name = "交通世界"
english_aliases = ["traffic world"]
domains = ["runtime"]
definition = "安装共享静态路网并持有每世界可变状态的运行时实例。"
symbols = [{ value = "TrafficWorld", kind = "type" }]
references = [{ document = "design-traffic-runtime-shared-consumption" }]

[[terms]]
id = "transition-anchor"
name = "转移锚点"
english_aliases = ["transition anchor"]
definition = "同时标识交通转移事件的路线出现记录和实际触发位置的值；车尾事件按净空时所需的前保险杠位置排序。"
domains = ["runtime"]
references = [{ document = "design-waiting-zone-conflict-right-of-way" }]
symbols = [{ value = "TrafficTransitionAnchor", kind = "type" }]

[[terms]]
id = "trusted-baseline"
name = "可信基准"
english_aliases = ["trusted baseline"]
domains = ["runtime"]
definition = "经独立核验成立的期望值集合及其绑定闭合；期望值不得取自被校验对象自身；无法建立时不得宣称检测或恢复成功。"
references = [{ document = "design-traffic-runtime-state-integrity" }]

[[terms]]
id = "vehicle-directory"
name = "车辆目录"
english_aliases = ["Vehicle Directory"]
domains = ["runtime"]
definition = "按完整句柄的索引与代次定位存储类别和物理行的登记表；不拥有第二份运动状态。"
references = [{ document = "design-traffic-runtime-columnar-execution" }]

[[terms]]
id = "vehicle-following"
name = "跟车"
english_aliases = ["vehicle following"]
domains = ["runtime"]
definition = "根据同一路径上的前车状态施加安全间距和速度约束的运行时行为。"
references = [{ document = "design-vehicle-following" }]

[[terms]]
id = "vehicle-following-front-lookahead"
name = "跟车前视"
english_aliases = ["vehicle-following front lookahead"]
domains = ["runtime"]
definition = "根据当前速度与车辆配置推导的每车每拍占用查询行走范围；不是目视距离，也不改变占用索引的全体活动车辆重建范围。"
symbols = [{ value = "front_query_horizon", kind = "field" }]
references = [{ document = "design-vehicle-following" }]

[[terms]]
id = "vehicle-runtime-unit"
name = "车辆运行单元"
english_aliases = ["vehicle runtime unit"]
domains = ["runtime"]
definition = "当前道路机动车执行域的车辆特化交通参与单元；不表示交通运行时只允许车辆。"
symbols = [{ value = "VehicleState", kind = "type" }]
references = [{ document = "adr-0021" }]

[[terms]]
id = "vehicle-state"
name = "车辆状态"
english_aliases = ["vehicle state"]
domains = ["runtime"]
definition = "当前车辆运行单元在某一固定步进边界上的运动、路线与行为状态。"
references = [{ document = "adr-0021" }]

[[terms]]
id = "virtual-parked-state"
name = "虚拟停驻"
english_aliases = ["virtual parked state"]
domains = ["runtime"]
definition = "车辆仍保留 live identity、route 和设施 binding，但不进入道路运动/占用，也不产生 committed pose 的 Parked 状态；不等于 despawn、聚合车辆或隐藏路网。"
references = [{ document = "design-parking-system" }]

[[terms]]
id = "virtual-parking-capacity"
name = "虚拟停车容量"
english_aliases = ["virtual parking capacity"]
domains = ["runtime"]
definition = "停车设施中不展开为具体泊位、内部路网或 parked pose 的计数容量。Runtime 虚拟池只保留 reserved/occupied 计数，不按该容量建立 binding 槽位。"
symbols = [{ value = "virtual_capacity", kind = "field" }]
references = [{ document = "design-parking-system" }]

[[terms]]
id = "waiting-dependency-view"
name = "等待依赖视图"
english_aliases = ["waiting dependency view"]
definition = "表达资源持有及容量不足导致的等待关系的可重建执行数据；不是持久化正本。"
domains = ["runtime"]
references = [{ document = "design-waiting-zone-conflict-right-of-way" }]

[[terms]]
id = "worker"
name = "工作线程"
english_aliases = ["worker"]
domains = ["runtime"]
definition = "执行一个或多个运行时任务的计算资源；数量和完成顺序不得改变精确结果。"
references = [{ document = "design-traffic-runtime-parallel-execution" }]

[[terms]]
id = "world-binding-state"
name = "世界绑定状态"
english_aliases = ["world binding state"]
domains = ["runtime"]
definition = "活动共享路网修订、已提交来源、世界身份与世代、配置及策略选择的统一绑定；固定步进只读，安装、恢复或切换按各自事务更新。"
symbols = [{ value = "WorldBindingState", kind = "type" }]
references = [{ document = "design-traffic-runtime-phase-protocol" }]

[[terms]]
id = "world-policy-selection"
name = "世界策略选择"
english_aliases = ["world policy selection"]
domains = ["runtime"]
definition = "显式选择策略绑定，或在整个共享静态路网没有门与冲突输入时声明不需要策略；不存在隐式默认策略。"
symbols = [{ value = "WorldPolicySelection", kind = "type" }]
references = [{ document = "design-traffic-runtime-right-of-way-policy" }]
