schema_version = 1

[[terms]]
id = "active-compact-position"
name = "活动紧凑位置"
english_aliases = ["Active Compact Position"]
domains = ["runtime"]
definition = "Active 工作集中的连续定位下标，必须映射到完整车辆句柄和逻辑更新位置。"
references = [{ document = "design-traffic-runtime-parallel-execution" }]

[[terms]]
id = "active-motion-pool"
name = "活动运动池"
english_aliases = ["Active Motion Pool"]
domains = ["runtime"]
definition = "只保存 Active 车辆正本热运动列的存储池；非活动记录不参与常规热扫描。"
references = [{ document = "design-traffic-runtime-columnar-execution" }]

[[terms]]
id = "administrative-state"
name = "管理状态"
english_aliases = ["administrative state"]
domains = ["runtime"]
definition = "迁移日志、事务配对世代等每世界管理数据；可参与提交，不能仅因位于管理分区而视为可丢弃缓存。"
symbols = [{ value = "AdministrativeState", kind = "type" }]
references = [{ document = "design-traffic-runtime-phase-protocol" }]

[[terms]]
id = "amdahl-bottleneck"
name = "阿姆达尔瓶颈"
english_aliases = ["Amdahl bottleneck"]
domains = ["runtime"]
definition = "不可并行的临界路径限制整体加速比、使增加工作线程不再获得相称收益的扩展性瓶颈。"
references = [{ document = "design-traffic-runtime-parallel-execution" }]

[[terms]]
id = "attempt-epoch"
name = "尝试世代"
english_aliases = ["Attempt Epoch"]
domains = ["runtime"]
definition = "区分同一已提交 tick 的不同执行尝试，防止旧回报或 capability 污染重试；不持久化。"
references = [{ document = "design-traffic-runtime-parallel-execution" }]

[[terms]]
id = "authentication-operational-failure"
name = "认证操作失败"
english_aliases = ["authentication operational failure"]
domains = ["runtime"]
definition = "共享路网修订认证因资源、限额、取消或来源不可得等操作条件而未产生比较结论的结果；不判因、不停用，也不宣称认证通过。"
references = [{ document = "design-traffic-runtime-state-integrity" }]

[[terms]]
id = "authoring-admission-quantization"
name = "编制准入量化"
english_aliases = ["authoring admission quantization"]
domains = ["runtime"]
definition = "编制 `f64` SI 在官方前端 / 共同接入边界 round-ties-to-even 一次进入整数毫米或受检 `f32` SI；之后 IR 不得再把交通一维存成编制米列。"
references = [{ document = "design-traffic-runtime-integer-geometry" }]

[[terms]]
id = "barrier"
name = "屏障"
english_aliases = ["barrier"]
domains = ["runtime"]
definition = "一个逻辑阶段等待全部必需分区输入就绪后才允许进入规范归约或提交的同步边界。"
references = [{ document = "design-traffic-runtime-parallel-execution" }]

[[terms]]
id = "block-soa"
name = "分块列式布局"
english_aliases = ["Block SoA"]
domains = ["runtime"]
definition = "固定行数块内同字段连续存储；块大小属于执行布局，不属于交通身份或持久格式。"
references = [{ document = "design-traffic-runtime-columnar-execution" }]

[[terms]]
id = "body-spill-occupancy"
name = "车身溢出占用"
english_aliases = ["body spill occupancy"]
domains = ["runtime"]
definition = "车身仍覆盖、但前保险杠已离开的更早物理边上的占用记录；不是变道双占用。"
references = [{ document = "design-vehicle-following" }]

[[terms]]
id = "boundary-exchange"
name = "边界交换"
english_aliases = ["boundary exchange"]
domains = ["runtime"]
definition = "同一 tick 内分区间传递规范输入、提案或资源声明的私有运行时过程。"
references = [{ document = "design-traffic-runtime-parallel-execution" }]

[[terms]]
id = "candidate"
name = "候选"
english_aliases = ["candidate"]
domains = ["runtime"]
definition = "尚未通过全部约束、验证或裁决的可能结果。"

[[terms]]
id = "candidate-execution-dependency-graph"
name = "候选执行依赖图"
english_aliases = ["Candidate Execution Dependency Graph"]
domains = ["runtime"]
definition = "以不可交换候选操作为节点并按规范先后定向的执行约束图。"
references = [{ document = "design-traffic-runtime-parallel-execution" }]

[[terms]]
id = "canonical-logical-position"
name = "规范逻辑位置"
english_aliases = ["Canonical Logical Position"]
domains = ["runtime"]
definition = "独立计算的规范消费位置；车辆级顺序来自逻辑更新位置，车内顺序来自逻辑检查地址。"
references = [{ document = "design-traffic-runtime-parallel-execution" }]

[[terms]]
id = "canonical-reduction-authority"
name = "规范归约裁决方"
english_aliases = ["canonical reduction authority"]
domains = ["runtime"]
definition = "对一个连接资源组件按稳定键形成唯一提交结果的逻辑裁决方；不要求由单一物理线程串行执行。"
references = [{ document = "design-traffic-runtime-parallel-execution" }]

[[terms]]
id = "committed-world-state"
name = "已提交世界状态"
english_aliases = ["committed world state"]
domains = ["runtime"]
definition = "当前世界的车辆、路线、资源裁决权、时钟和游标，以及成功提交后可查询的发布批次；内部归属不等同于快照保存范围。"
symbols = [{ value = "CommittedWorldState", kind = "type" }]
references = [{ document = "design-traffic-runtime-phase-protocol" }]

[[terms]]
id = "completion-frontier"
name = "完成前沿"
english_aliases = ["Completion Frontier"]
domains = ["runtime"]
definition = "证明某错误之前的必要逻辑检查已解析的记录；缺失回报不能当作成功或跳过。"
references = [{ document = "design-traffic-runtime-parallel-execution" }]

[[terms]]
id = "condensation-directed-acyclic-graph"
name = "凝聚有向无环图"
english_aliases = ["condensation directed acyclic graph"]
domains = ["runtime"]
definition = "把强连通分量收缩为节点后得到、可用于确定性波次调度的有向无环图。"
symbols = [{ value = "condensation DAG", kind = "notation" }]
references = [{ document = "design-traffic-runtime-parallel-execution" }]

[[terms]]
id = "conflict-lag-reference"
name = "冲突滞后基准"
english_aliases = ["conflict lag reference"]
domains = ["runtime"]
definition = "单元的无历史、实际清空时间或保守切换起点三种状态；后两者参与相同的滞后间隙检查，切换起点不表示真实清空事件。"
symbols = [{ value = "ConflictLagReference", kind = "type" }]
references = [{ document = "design-traffic-runtime-right-of-way-policy" }]

[[terms]]
id = "conflict-passage-locator"
name = "冲突通行段持久定位值"
english_aliases = ["conflict passage locator"]
domains = ["runtime"]
definition = "stream 与 zone 的稳定引用对，用于存档和迁移时定位已有唯一局部关系；不是独立实体或新的运行时地址。"
symbols = [{ value = "ConflictPassageLocator", kind = "type" }]
references = [{ document = "design-traffic-runtime-right-of-way-policy" }]

[[terms]]
id = "constraint"
name = "约束"
english_aliases = ["constraint"]
domains = ["runtime"]
definition = "对有效值、行为候选或运行时结果施加的不可绕过条件。"

[[terms]]
id = "core-world"
name = "核心世界"
english_aliases = ["core world"]
domains = ["runtime"]
definition = "旧核心运行时中的世界类型。"
symbols = [{ value = "CoreWorld", kind = "type" }]
references = [{ document = "design-traffic-runtime-shared-consumption" }]
retirement = { reason = "旧组件及其世界类型已拆除。", replacements = [{ target = "traffic-world", condition = "现行职责对应；不表示 API 或字节兼容。" }] }

[[terms]]
id = "derived-indexes"
name = "派生索引"
english_aliases = ["derived indexes"]
domains = ["runtime"]
definition = "从当前绑定与已提交状态重建的查询、执行顺序和定位结构；不独立授予交通权利，重建不得改变语义顺序。"
symbols = [{ value = "DerivedIndexes", kind = "type" }]
references = [{ document = "design-traffic-runtime-phase-protocol" }]

[[terms]]
id = "deterministic-commit-plan"
name = "确定性提交计划"
english_aliases = ["Deterministic Commit Plan"]
domains = ["runtime"]
definition = "对同一基线完整验证的车辆、资源、时钟、游标、日志效果及发布结果；一次消费后无可恢复错误地提交，不是世界副本或新的存档对象。"
symbols = [{ value = "CommitPlan", kind = "type" }]
references = [{ document = "design-traffic-runtime-phase-protocol" }]

[[terms]]
id = "deterministic-radix-bucket-sorting"
name = "确定性基数/桶排序"
english_aliases = ["deterministic radix/bucket sorting"]
domains = ["runtime"]
definition = "对固定宽度规范键采用与输入规模线性相关、且不依赖线程完成顺序的排序策略族。"
references = [{ document = "design-traffic-runtime-parallel-execution" }]

[[terms]]
id = "distortion"
name = "失真"
english_aliases = ["distortion"]
domains = ["runtime"]
definition = "运行时状态完整性语境中，数据内容偏离应有内容的现象；该用词本身不确定原因、判因结论或检测覆盖。具体对象与检测、处置边界以完整性设计为准。"
references = [{ document = "design-traffic-runtime-state-integrity" }]

[[terms]]
id = "distortion-attribution"
name = "判因"
english_aliases = ["distortion attribution"]
domains = ["runtime"]
definition = "对完整性失配原因作出的归属判断；允许无法判因，不承诺唯一根因。"
references = [{ document = "design-traffic-runtime-state-integrity" }]

[[terms]]
id = "distortion-fingerprint"
name = "失真指纹"
english_aliases = ["distortion fingerprint"]
domains = ["runtime"]
definition = "失配现场的页级形态分类（页边界偏移、整页替换、页整数倍位移、零页、非页对齐），用于环境对照与判因；非页对齐提示转代码嫌疑。共享路网修订认证只报告逻辑位置，不输出页级指纹。"
references = [{ document = "design-traffic-runtime-state-integrity" }]

[[terms]]
id = "durable-revision-content-baseline"
name = "耐久修订内容基线"
english_aliases = ["durable revision content baseline"]
domains = ["runtime"]
definition = "由构建方建立、宿主随来源持久保存或重建的修订内容依据，是共享路网修订认证的期望值来源之一；发布来源与编辑来源的保存方式不同。"
references = [{ document = "design-traffic-runtime-state-integrity" }]

[[terms]]
id = "durable-revision-content-preimage"
name = "耐久修订内容原像"
english_aliases = ["durable revision content preimage"]
domains = ["runtime"]
definition = "与路网修订标识共用的规范路网语义载荷原像；不包含布局与派生表，也不另设第二套编码。"
references = [{ document = "design-traffic-runtime-state-integrity" }]

[[terms]]
id = "dynamic-traversal-definition"
name = "动态通行定义"
english_aliases = ["dynamic traversal definition"]
domains = ["runtime"]
definition = "目标交通运行时中描述参与单元运行时通行路径及进度语义的通用概念；当前道路机动车执行域的具体投影是 `Route`。"
references = [{ document = "adr-0021" }]
scope_notes = ["当前交付为道路机动车特化；长期通用概念不表示其他执行域已经实现，也不改写历史车辆证据。"]

[[terms]]
id = "entry-frontier"
name = "入口 frontier"
english_aliases = ["entry frontier"]
domains = ["runtime"]
definition = "为让行查询维护的冲突接近记录。只为近门车辆打开路线，失效车辆整段重走，其余按反向索引复用冲突距离。"
references = [{ document = "design-traffic-runtime-right-of-way-policy" }]

[[terms]]
id = "exact-execution-path"
name = "精确执行路径"
english_aliases = ["exact execution path"]
domains = ["runtime"]
definition = "不降低交通保真度、且结果不依赖工作线程数或分区计划的执行路径。"
references = [{ document = "design-traffic-runtime-parallel-execution" }]

[[terms]]
id = "exact-reference-oracle"
name = "精确参考预言机"
english_aliases = ["exact reference oracle"]
domains = ["runtime"]
definition = "以直观集中式算法产生规范结果、用于证明优化执行路径语义等价而不要求成为生产热路径的实现。"
references = [{ document = "design-traffic-runtime-parallel-execution" }]

[[terms]]
id = "execution-block"
name = "执行块"
english_aliases = ["Execution Block"]
domains = ["runtime"]
definition = "独占任务输出范围的物理调度分块；不创建新的交通身份或公开子世界。"
references = [{ document = "design-traffic-runtime-parallel-execution" }]

[[terms]]
id = "execution-configuration"
name = "执行配置"
english_aliases = ["Execution Configuration"]
domains = ["runtime"]
definition = "安装和恢复时由宿主显式提供的执行能力要求；不进入交通快照、摘要或身份。"
symbols = [{ value = "ExecutionConfig", kind = "type" }]
references = [{ document = "design-traffic-runtime-execution-config" }]

[[terms]]
id = "execution-resources"
name = "执行资源"
english_aliases = ["Execution Resources"]
domains = ["runtime"]
definition = "活动世界拥有的线程与调度资源，和可重建的目标执行计划分开管理。"
references = [{ document = "design-traffic-runtime-execution-config" }]

[[terms]]
id = "fidelity-contract"
name = "保真度契约"
english_aliases = ["fidelity contract"]
domains = ["runtime"]
definition = "明确允许的个体、时间、空间与行为语义损失及其验证边界的版本化契约。"
references = [{ document = "design-traffic-runtime-parallel-execution" }]

[[terms]]
id = "fidelity-degradation"
name = "保真度降级"
english_aliases = ["fidelity degradation"]
domains = ["runtime"]
definition = "显式减少个体、时间、空间或行为语义的目标能力变化；必须由独立保真度契约和 G1/ADR 授权，不能伪装成调度或表现优化。"
references = [{ document = "design-traffic-runtime-parallel-execution" }]

[[terms]]
id = "fixed-tick"
name = "固定步进"
english_aliases = ["fixed tick"]
domains = ["runtime"]
definition = "以确定输入和顺序推进交通状态的一次运行时更新。合法步长 `4..=1000` ms，4 ms 为最细量子，不是默认。"
symbols = [{ value = "tick", kind = "function" }]
references = [{ document = "design-traffic-runtime-integer-geometry" }]

[[terms]]
id = "fresh-placement"
name = "新生成"
english_aliases = ["fresh placement"]
domains = ["runtime"]
definition = "在当前提交时点把一辆尚未处于该运动状态的车放入世界的操作；不意味着从路线起点以零速出发。"
symbols = [{ value = "spawn_vehicle", kind = "function" }]
references = [{ document = "design-traffic-runtime-vehicle-placement" }]
scope_notes = ["运动安全、开放入口与显式历史起点的可达性检查各有适用条件，以车辆放置设计为准。"]

[[terms]]
id = "fused-single-worker-executor"
name = "融合单工作线程执行器"
english_aliases = ["fused single-worker executor"]
domains = ["runtime"]
definition = "保留精确路径可观察语义、但不物化无并发价值的队列、任务图或真实屏障的单工作线程实现。"
references = [{ document = "design-traffic-runtime-parallel-execution" }]

[[terms]]
id = "gap-acceptance-profile"
name = "间隙接受参数"
english_aliases = ["gap acceptance profile"]
domains = ["runtime"]
definition = "具名且版本化的最小领先间隙、最小滞后间隙和清空缓冲；属于策略集局部成员。"
symbols = [{ value = "GapAcceptanceProfile", kind = "type" }]
references = [{ document = "design-traffic-runtime-right-of-way-policy" }]

[[terms]]
id = "gate-compliance-rule"
name = "门合规规则"
english_aliases = ["gate compliance rule"]
domains = ["runtime"]
definition = "针对机动门及参与者类别，把适用灯态与禁令解释为停止或候选的封闭规则，不直接授予通行权。"
symbols = [{ value = "GateComplianceRule", kind = "type" }]
references = [{ document = "design-traffic-runtime-right-of-way-policy" }]

[[terms]]
id = "graceful-overload-degradation"
name = "过载优雅降级"
english_aliases = ["graceful overload degradation"]
domains = ["runtime"]
definition = "宿主在过载时通过暂停、慢放或统一调整时间推进保持全部逻辑步进、事件和交通语义的显式处置；不等同于保真度降级。"
references = [{ document = "design-traffic-runtime-parallel-execution" }]

[[terms]]
id = "grant"
name = "授权"
english_aliases = ["grant"]
domains = ["runtime"]
definition = "运行时对特定车辆在当前条件下通过冲突资源的许可。"

[[terms]]
id = "halo"
name = "边界邻域"
english_aliases = ["halo"]
domains = ["runtime"]
definition = "分区为同一 tick 依赖读取的相邻状态范围；不能通过过期一 tick 数据改变精确语义。"
references = [{ document = "design-traffic-runtime-parallel-execution" }]

[[terms]]
id = "host-audit-replay"
name = "宿主审计重放"
english_aliases = ["host audit replay"]
domains = ["runtime"]
definition = "宿主使用独立世界重放较早检查点后的输入并比较检查点状态的审计方法；未完成区间不计入覆盖。"
references = [{ document = "design-traffic-runtime-state-integrity" }]
scope_notes = ["被审计世界仍运行时，独立世界须位于独立进程或另一台机器；结果区分完整匹配、分歧与未完成，管理边界限制见完整性设计。"]

[[terms]]
id = "integer-millimetre"
name = "整数毫米"
english_aliases = ["integer millimetre"]
domains = ["runtime"]
definition = "已提交交通一维几何的正本长度量子；边长、边内进度、车长、间距与停车锚点使用整数毫米。准入后编译器 Typed AST / HIR / MIR / LIR 的交通一维存储正本同为整数毫米。"
symbols = [{ value = "mm", kind = "unit" }]
references = [{ document = "design-traffic-runtime-integer-geometry" }]

[[terms]]
id = "integrity-disablement"
name = "停用"
english_aliases = ["integrity disablement"]
domains = ["runtime"]
definition = "检测判定失真对象失配后停止使用的语义；不自动纠偏、回滚、重演或重启，已发布结果不撤销，由宿主执行。"
references = [{ document = "design-traffic-runtime-state-integrity" }]
scope_notes = ["交通运行时不持有失效状态；停止使用的触发条件和边界由完整性设计规定。"]

[[terms]]
id = "intersection-rules"
name = "路口规则"
english_aliases = ["intersection rules"]
domains = ["runtime"]
definition = "对冲突流、准入、授权、预约和通行顺序进行运行时裁决的规则集合。"
references = [{ document = "design-waiting-zone-conflict-right-of-way" }]

[[terms]]
id = "lane-flow-junction-observation"
name = "路口观测视图"
english_aliases = ["lane flow junction observation"]
domains = ["runtime"]
definition = "从活动 Bevy Session 借出的只读领域视图，组合当前状态与分别标明语义的最近成功步进记录，不拥有动态交通正本。"
symbols = [{ value = "LaneFlowJunctionObservation", kind = "type" }]
references = [{ document = "design-junction-observation-and-validation" }]

[[terms]]
id = "lane-graph"
name = "车道图"
english_aliases = ["lane graph"]
domains = ["runtime"]
definition = "供运行时遍历和路线跟随使用的有向车道拓扑。"
references = [{ document = "design-traffic-runtime-shared-consumption" }]

[[terms]]
id = "laneflow-core"
name = "LaneFlow 核心"
english_aliases = ["LaneFlow Core"]
domains = ["runtime"]
definition = "已拆除的前动态执行层组件。"
symbols = [{ value = "laneflow-core", kind = "crate" }]
references = [{ document = "design-traffic-runtime-shared-consumption" }]
retirement = { reason = "由 LaneFlow 交通运行时一次性替代，不保留可运行旧入口。", replacements = [{ target = "laneflow-traffic-runtime", condition = "现行职责对应；不表示 API 或字节兼容。" }] }

[[terms]]
id = "laneflow-traffic-runtime"
name = "LaneFlow 交通运行时"
english_aliases = ["LaneFlow Traffic Runtime"]
domains = ["runtime"]
definition = "当前可运行动态执行层。拥有固定步进、已实现执行域的交通参与单元、动态通行定义和每世界可变交通状态。"
