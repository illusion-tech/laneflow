schema_version = 1

[[wording_rules]]
id = "authority-label"
expressions = ["权威"]
scope = "authority 的职责、正本、唯一来源或依据语义。"
guidance = "组件职责使用裁决、裁决方或裁决权；数据持有使用正本；唯一来源使用唯一事实来源；陈述句按需要写“以……为准”。"
alternatives = [{ target = "authority", condition = "组件最终裁决责任。" }, { target = "single-source-of-truth", condition = "规范来源唯一性。" }]
exceptions = ["英文别名 authority 与精确标识符保留。"]
issues = [1229]

[[wording_rules]]
id = "completion-language"
expressions = ["收口", "闭合", "口径"]
scope = "任务完成、治理检查、几何、集合或统计表述。"
guidance = "完成状态写明任务完成、最终审阅、验收通过、表示统一或入口限制；闭合须有明确对象与判据；口径须说明计数对象、统计范围、测量方法或比较基准。"
exceptions = ["几何首尾相接、集合封闭、所有权完整性及最小发布闭合等明确含义可以保留。", "保持历史完成时间、未完成范围与验收条件；不得据此宣称没有漏检。"]
issues = [1017]

[[wording_rules]]
id = "core-runtime-name"
expressions = ["Core", "Core Runtime", "LaneFlow Core", "current Core"]
scope = "指现行交通运行时的散文、注释或错误文案。"
guidance = "改用 LaneFlow 交通运行时；与空间层、适配器并列或修饰步进指标时可在上下文明确后写运行时；边长写交通边长。"
alternatives = [{ target = "laneflow-traffic-runtime", condition = "现行动态执行层。" }]
exceptions = ["已拆除对象的精确标识符、ADR 历史决策与已退役文档、已登记 Skill ID laneflow-core-design、任务类别 core-runtime、现有文件名和第三方同形词保留。", "机器度量键与公开 API 标识符的改名由对应合同处理，不从文字规则推导。"]
issues = [1339]

[[wording_rules]]
id = "digest-envelope"
expressions = ["摘要封套", "完整性封套", "证据封套"]
scope = "harness 自校验。"
guidance = "区分摘要映射与被摘要记录，保留先核对摘要、后读取运行字段的顺序。"
alternatives = [{ target = "file-digest-manifest", condition = "文件名到摘要的映射。" }, { target = "diagnostic-record", condition = "被核对的诊断载荷。" }]
exceptions = ["同目录摘要不提供执行或来源真实性认证。"]
issues = [1012]

[[wording_rules]]
id = "distortion-colloquial"
expressions = ["打中", "被打中"]
scope = "完整性与内存失真语境。"
guidance = "按句法写发生失真、受失真影响或导致失真，保留对象、时间、可能性与共因条件。"
alternatives = [{ target = "distortion", condition = "仅描述内容偏离应有内容。" }]
exceptions = ["不据此断言已经确认页级故障或特定失真机制。"]
issues = [1009]

[[wording_rules]]
id = "experiment-arm"
expressions = ["臂", "双臂", "跨臂", "参考臂", "分发臂"]
scope = "实验、测试与测量语境。"
guidance = "按实际对象区分参数组合、测试用例、执行实例、代码路径与候选方法。"
alternatives = [{ target = "run-configuration", condition = "参数组合。" }, { target = "test-case-group", condition = "一组测试用例。" }, { target = "individual-run", condition = "一次实际执行。" }, { target = "execution-path", condition = "条件选择的代码路径。" }, { target = "experimental-variant", condition = "候选实现或方法。" }]
issues = [1012]

[[wording_rules]]
id = "fallback-check"
expressions = ["兜底"]
scope = "校验、测试、异常、检测及处置。"
guidance = "写明检查对象、执行阶段、错误或捕获动作、未覆盖面与宿主处置责任。"
alternatives = [{ target = "additional-check", condition = "额外核对另一条件或粒度。" }]
exceptions = ["不暗示恢复成功或必然检出。"]
issues = [1014]

[[wording_rules]]
id = "fallback-order"
expressions = ["兜底"]
scope = "排序、残留歧义或路径竞争。"
guidance = "写明最终排序字段、消解歧义的机制或拒绝同名路径。"
alternatives = [{ target = "final-sort-key", condition = "前序字段相同时才比较的键。" }]
exceptions = ["deny-overrides 消解残留歧义是被否决的方案；路径竞争检查不等于消除全部 TOCTOU。"]
issues = [1014]

[[wording_rules]]
id = "fallback-output"
expressions = ["兜底"]
scope = "诊断内容、缺失来源和名称截断。"
guidance = "写明占位、补入来源位置或用摘要后缀区分名称。"
alternatives = [{ target = "placeholder-output", condition = "为继续诊断保留的替代内容。" }]
exceptions = ["占位不提升为验收通过，摘要不提升为无碰撞保证。"]
issues = [1014]

[[wording_rules]]
id = "fallback-path-language"
expressions = ["兜底"]
scope = "路径选择、测试执行方式与默认规则。"
guidance = "按实际触发条件与优先级表述。"
alternatives = [{ target = "fallback-path", condition = "当前路径条件不成立时转入既有路径。" }, { target = "alternative-test-execution", condition = "另一种测试执行方式。" }, { target = "default-rule", condition = "未指定可选条件时采用的规则。" }]
exceptions = ["调试配置直接说明变量用途；不同测试线程模型和计时结果不能混同。"]
issues = [1014]

[[wording_rules]]
id = "gate-label"
expressions = ["开发闸口", "设计闸口字段", "门禁", "闸口", "关卡"]
scope = "流程、质量检查或验收语境。"
guidance = "按对象区分人流程的阶段评审、机器阻断的检查以及产品或性能验收。"
alternatives = [{ target = "development-gate", condition = "G0–G2 人流程。" }, { target = "design-gate-field", condition = "GitHub 的 Design gate 字段。" }]
exceptions = ["ManeuverGate 的机动门领域义、Gate 精确标识符、字段名与文件名不变。"]
issues = [1229]

[[wording_rules]]
id = "preimage-label"
expressions = ["前像"]
scope = "摘要、标识与编码中的 preimage。"
guidance = "使用“原像”，并说明是哪一种摘要或标识的原像。"
exceptions = ["精确标识符保留原文。"]
issues = [1229]

[[wording_rules]]
id = "reader-label"
expressions = ["读器"]
scope = "reader 组件语境。"
guidance = "使用自然中文“读取器”。"
issues = [1229]

[[wording_rules]]
id = "road-arm"
expressions = ["臂", "臂道", "道路臂", "入口臂", "出口臂", "接近臂"]
scope = "场景生成或路口有向接近关系。"
guidance = "区分路口外部实体道路与指向入口、出口的有向关系；计数明示有向、双向或车道。"
alternatives = [{ target = "external-road-segment", condition = "描述实体道路。" }, { target = "approach", condition = "指向入口的有向关系。" }, { target = "exit-approach", condition = "指向出口的有向关系。" }]
exceptions = ["Arm、approach 等标识符，以及悬臂灯架、横臂等实体构件名保留。"]
issues = [1012, 1229]

[[wording_rules]]
id = "root-shorthand"
expressions = ["根", "根审计", "根比较", "候选根", "该根", "根重建"]
scope = "运行时状态完整性与处置中把共享路网修订简称为根。"
guidance = "按实际对象写修订审计、修订比较、候选修订、该修订或修订重建。"
alternatives = [{ target = "shared-network-revision", condition = "上下文明确时可使用已经登记的简称“修订”。" }]
exceptions = ["明确描述 ADR 0025 所有权结构的根对象、根 Arc、从根借用、根共享、根配对、换根或同修订换根不在此范围。"]
issues = [985]

[[wording_rules]]
id = "shared-root-identifiers"
expressions = ["shared_root"]
scope = "历史内部与测试标识符、机器可读度量键或 CSV 表头。"
guidance = "内部与测试标识符按实例或内容区分命名；度量字段按其计数对象命名，并与读取端同步。"
alternatives = [{ target = "shared-network-revision", condition = "实例命名使用 shared_network_revision。" }, { target = "shared-static-network", condition = "层或内存度量使用 shared_static_network。" }]
exceptions = ["公开 API 与协议字面量不因散文旧称规则自动改名；历史记录保留原键，读取兼容范围由对应工具合同规定。"]
issues = [985]

[[wording_rules]]
id = "task-slice"
expressions = ["切片"]
scope = "任务类别或工作分块语境。"
guidance = "类别使用任务类别；工作分解按语境写子任务、某部分或任务与批次。"
alternatives = [{ target = "task-category", condition = "PR 的验证维度。" }]
exceptions = ["Rust slice、字节切片等数据义不适用。"]
issues = [1229]

[[wording_rules]]
id = "timing-envelope"
expressions = ["计时封套", "执行封套"]
scope = "harness 的运行输出。"
guidance = "按实际文件说明记录对象；语义比较排除集合应列出具体文件。"
alternatives = [{ target = "per-tick-timing-log", condition = "逐拍耗时。" }, { target = "measurement-record", condition = "协议、配置与样本。" }, { target = "diagnostic-record", condition = "运行诊断。" }, { target = "run-records", condition = "整次执行输出的统称。" }]
exceptions = ["不能以泛称扩大既有校验或语义比较排除范围。"]
issues = [1012]

[[wording_rules]]
id = "truth-source-label"
expressions = ["单一事实源", "事实源"]
scope = "唯一规范来源或一般事实来源的表述。"
guidance = "SSOT 写唯一事实来源；一般来源写事实来源。"
alternatives = [{ target = "single-source-of-truth", condition = "强调同一事实的规范所有权。" }]
issues = [1229]

[[wording_rules]]
id = "wrapper-envelope"
expressions = ["封套"]
scope = "按值 Vec 包装或 RowV1 外层结构的泛称。"
guidance = "分别说明类型层与编码层的包装。"
alternatives = [{ target = "wrapper-type", condition = "类型层。" }, { target = "outer-encoding-structure", condition = "编码层。" }]
exceptions = ["源映射封套、语义差异封套及明确指代它们的简称保留；验证收据封套仅在历史方案语境保留。"]
issues = [1012]
