schema_version = 1

[[terms]]
id = "alignment"
name = "对齐"
english_aliases = ["alignment"]
domains = ["artifacts"]
definition = "数据地址或偏移量必须满足的倍数约束。"
references = [{ document = "design-portable-canonical-artifact" }]

[[terms]]
id = "application-binary-interface"
name = "应用二进制接口"
english_aliases = ["application binary interface"]
domains = ["artifacts"]
definition = "规定二进制组件之间数据布局、对齐、字节序与调用约定的接口契约。"
symbols = [{ value = "ABI", kind = "acronym" }]
references = [{ document = "adr-0025" }]
scope_notes = ["共享静态路网只提供进程内对象，不交付稳定镜像 ABI。"]

[[terms]]
id = "background-verification"
name = "后台验证"
english_aliases = ["background verification"]
domains = ["artifacts"]
definition = "旧目标专用静态镜像方案中，由后台任务提前完成尚未请求节检查的策略。"
references = [{ document = "adr-0025", anchor = "1-不交付独立静态镜像制品或-abi" }]
context = "historical-static-image"
retirement = { reason = "独立静态镜像及其描述符、分块验证和发布审计方案已取消；本条不表示现行可移植制品或共享静态路网提供同名能力。" }

[[terms]]
id = "bounded-structural-verifier"
name = "有界结构校验器"
english_aliases = ["bounded structural verifier"]
domains = ["artifacts"]
definition = "对不可信制品字节执行偏移量、区间、数值、基数和资源上限检查的校验器。"
references = [{ document = "design-portable-canonical-artifact" }]

[[terms]]
id = "build-and-target-selector"
name = "构建与目标选择器"
english_aliases = ["build and target selector"]
domains = ["artifacts"]
definition = "选择构建工具、目标平台或封闭配置档的字段；不是协议版本。"
references = [{ document = "design-portable-canonical-artifact" }]

[[terms]]
id = "byte-for-byte-equality"
name = "字节完全一致"
english_aliases = ["byte-for-byte equality"]
domains = ["artifacts"]
definition = "两个目标对象的完整字节序列逐字节相同。"
symbols = [{ value = "exact bytes", kind = "notation" }]
references = [{ document = "design-portable-canonical-artifact" }]

[[terms]]
id = "byte-order"
name = "字节序"
english_aliases = ["byte order", "endianness"]
domains = ["artifacts"]
definition = "多字节整数在制品中的排列规则。"
references = [{ document = "design-portable-canonical-artifact" }]

[[terms]]
id = "caller-runtime-limit"
name = "调用方运行上限"
english_aliases = ["caller runtime limit"]
domains = ["artifacts"]
definition = "调用方针对一次读取或发射显式提供、可以低于但不得高于格式硬上限的资源预算；改变它不改变 wire version，也不授权扩大格式安全边界。"
references = [{ document = "design-portable-canonical-artifact" }]

[[terms]]
id = "canonical-publication-candidate"
name = "规范发布候选"
english_aliases = ["canonical publication candidate"]
domains = ["artifacts"]
definition = "同次成功编译原子产生并拥有制品、源映射、差异与显式 base binding 的未发布候选；发布入口仍必须执行后发射 bundle 检查。"
symbols = [{ value = "PortablePublicationCandidate", kind = "type" }]
references = [{ document = "design-compiler-post-emission-check-and-minimal-publication-closure" }]

[[terms]]
id = "canonical-publication-descriptor"
name = "规范发布描述符"
english_aliases = ["canonical publication descriptor"]
domains = ["artifacts"]
definition = "绑定规范制品、源映射、来源链与对象键的发布描述；不自行证明对象已发布或来源可信。"
symbols = [{ value = "CanonicalPublicationDescriptor", kind = "type" }, { value = "LFCP", kind = "acronym" }]
references = [{ document = "design-portable-canonical-artifact" }]

[[terms]]
id = "cardinality"
name = "基数"
english_aliases = ["cardinality"]
domains = ["artifacts"]
definition = "表、节、实体、点或关系集合的记录数量。"
references = [{ document = "design-portable-canonical-artifact" }]

[[terms]]
id = "checked-canonical-network-input"
name = "受检规范路网输入"
english_aliases = ["checked canonical network input"]
domains = ["artifacts"]
definition = "由格式检查器构造、绑定不可变受检制品来源、精确摘要与长度、重算路网修订标识的进程内能力，是共享静态路网构建器的唯一输入。"
symbols = [{ value = "CheckedCanonicalNetworkInput", kind = "type" }]
references = [{ document = "design-compiler-post-emission-check-and-minimal-publication-closure" }]

[[terms]]
id = "closed-kind-selector"
name = "封闭种类选择器"
english_aliases = ["closed kind selector"]
domains = ["artifacts"]
definition = "选择版本化封套的封闭种类及必需字段集合；不是协议版本。"
references = [{ document = "design-portable-canonical-artifact" }]

[[terms]]
id = "closed-staged-object-source"
name = "已关闭暂存对象来源"
english_aliases = ["closed staged object source"]
domains = ["artifacts"]
definition = "字段私有 staged writer 完成 flush、固定 file identity/exact length 并关闭 LaneFlow 全部写 handle/mapping 后得到的可重读来源；checker 与共享静态构建直接复用，不要求安装到内容仓库。"
symbols = [{ value = "ClosedStagedObjectSource", kind = "type" }]
references = [{ document = "design-compiler-post-emission-check-and-minimal-publication-closure" }]

[[terms]]
id = "compiler-semantic-validation"
name = "编译器语义验证"
english_aliases = ["compiler semantic validation"]
domains = ["artifacts"]
definition = "编译器对来源和 IR 执行的主语义检查。"
references = [{ document = "design-compiler-foundation" }]

[[terms]]
id = "content-identity-and-length-binding"
name = "内容身份与长度绑定"
english_aliases = ["content identity and length binding"]
domains = ["artifacts"]
definition = "以摘要和精确字节长度共同认证目标对象、或以语义修订标识认证规范内容的外部绑定字段。"
references = [{ document = "design-portable-canonical-artifact" }]

[[terms]]
id = "eager-verification"
name = "预先验证"
english_aliases = ["eager verification"]
domains = ["artifacts"]
definition = "旧目标专用静态镜像方案中，在暴露视图前主动完成全部所需分块与结构检查的策略。"
references = [{ document = "adr-0025", anchor = "1-不交付独立静态镜像制品或-abi" }]
context = "historical-static-image"
retirement = { reason = "独立静态镜像及其描述符、分块验证和发布审计方案已取消；本条不表示现行可移植制品或共享静态路网提供同名能力。" }

[[terms]]
id = "exact-bytes-digest"
name = "精确字节摘要"
english_aliases = ["exact-bytes digest"]
domains = ["artifacts"]
definition = "对目标对象完整字节序列计算的 SHA-256；目标对象不得嵌入自身摘要。"
references = [{ document = "design-portable-canonical-artifact" }]

[[terms]]
id = "exact-current"
name = "精确当前版本"
english_aliases = ["exact-current"]
domains = ["artifacts"]
definition = "只接受当前冻结版本，不在生产路径隐式兼容历史或未来版本。"
references = [{ document = "design-portable-canonical-artifact" }]

[[terms]]
id = "fail-closed"
name = "失败关闭"
english_aliases = ["fail closed"]
domains = ["artifacts"]
definition = "发生歧义、缺失、越界、验证失败或外部状态不可确认时拒绝继续。"
references = [{ document = "design-portable-canonical-artifact" }]

[[terms]]
id = "format-hard-limit"
name = "格式硬上限"
english_aliases = ["format hard limit"]
domains = ["artifacts"]
definition = "由格式版本冻结、任何读取器都不得提高或禁用的安全天花板；用于在 hash、分配和建立受检视图前限制对象、计数、字符串、向量和累计暂存规模，不是性能目标。"
references = [{ document = "design-portable-canonical-artifact" }]

[[terms]]
id = "full-audit"
name = "完整审计"
english_aliases = ["full audit"]
domains = ["artifacts"]
definition = "旧目标专用静态镜像方案中读取并核对完整镜像摘要的独立审计路径。"
references = [{ document = "adr-0025", anchor = "1-不交付独立静态镜像制品或-abi" }]
context = "historical-static-image"
retirement = { reason = "独立静态镜像及其描述符、分块验证和发布审计方案已取消；本条不表示现行可移植制品或共享静态路网提供同名能力。" }

[[terms]]
id = "image-header"
name = "镜像头"
english_aliases = ["image header"]
domains = ["artifacts"]
definition = "旧目标专用静态镜像方案中声明布局、目标、配置档与来源链的起始结构。"
references = [{ document = "adr-0025", anchor = "1-不交付独立静态镜像制品或-abi" }]
context = "historical-static-image"
retirement = { reason = "独立静态镜像及其描述符、分块验证和发布审计方案已取消；本条不表示现行可移植制品或共享静态路网提供同名能力。" }

[[terms]]
id = "immutable"
name = "不可变"
english_aliases = ["immutable"]
domains = ["artifacts"]
definition = "构造后不再改变，可由多个世界/会话安全共享。"
references = [{ document = "design-portable-canonical-artifact" }]

[[terms]]
id = "immutable-byte-backing"
name = "不可变字节后备存储"
english_aliases = ["immutable byte backing"]
domains = ["artifacts"]
definition = "从分块验证完成到有类型视图释放期间保持同一精确字节、且不存在可写别名的资产或拥有存储。"
references = [{ document = "design-compiler-post-emission-check-and-minimal-publication-closure" }]

[[terms]]
id = "lazy-verification"
name = "延迟验证"
english_aliases = ["lazy verification"]
domains = ["artifacts"]
definition = "旧目标专用静态镜像方案中，在首次请求某节或能力时才完成对应检查的策略。"
references = [{ document = "adr-0025", anchor = "1-不交付独立静态镜像制品或-abi" }]
context = "historical-static-image"
retirement = { reason = "独立静态镜像及其描述符、分块验证和发布审计方案已取消；本条不表示现行可移植制品或共享静态路网提供同名能力。" }

[[terms]]
id = "magic"
name = "魔数"
english_aliases = ["magic"]
domains = ["artifacts"]
definition = "用固定字节区分协议或制品类型的标记。"
symbols = [{ value = "\"LFID\"", kind = "constant" }]
references = [{ document = "design-portable-canonical-artifact" }]

[[terms]]
id = "memory-mapping"
name = "内存映射"
english_aliases = ["memory mapping", "mmap"]
domains = ["artifacts"]
definition = "把文件字节映射到地址空间的访问方式；当前私有制品暂存用途不定义共享静态路网文件 ABI 或跨进程页共享。"
references = [{ document = "design-compiler-post-emission-check-and-minimal-publication-closure" }]

[[terms]]
id = "minimal-publication-closure"
name = "最小发布闭合"
english_aliases = ["minimal publication closure"]
domains = ["artifacts"]
definition = "从受检能力构造发布描述符绑定、由宿主负责持久化、真实性认证与文件事务的发布职责边界。"
references = [{ document = "design-compiler-post-emission-check-and-minimal-publication-closure" }]

[[terms]]
id = "mutable"
name = "可变"
english_aliases = ["mutable"]
domains = ["artifacts"]
definition = "随运行时命令、固定步进或生命周期改变，必须由明确最终裁决职责拥有。"
references = [{ document = "design-portable-canonical-artifact" }]

[[terms]]
id = "offset"
name = "偏移量"
english_aliases = ["offset"]
domains = ["artifacts"]
definition = "从容器或节起点到目标数据的字节距离。"
references = [{ document = "design-portable-canonical-artifact" }]

[[terms]]
id = "outer-encoding-structure"
name = "外层编码结构"
english_aliases = ["outer encoding structure"]
domains = ["artifacts"]
definition = "在被描述的内容之外添加层级或组帧信息的编码结构；例如限定 Bytes 只包含 RowV1 时，被排除的 TableV1 或其他外层结构。"

[[terms]]
id = "portable-canonical-artifact"
name = "可移植规范制品"
english_aliases = ["portable canonical artifact"]
domains = ["artifacts"]
definition = "平台无关、确定性、可发布、可长期审计并可由公共格式检查和后继工具读取的静态路网制品。"
symbols = [{ value = "LFCA", kind = "acronym" }]
references = [{ document = "design-portable-canonical-artifact" }]

[[terms]]
id = "post-emission-check"
name = "后发射检查"
english_aliases = ["post-emission check"]
domains = ["artifacts"]
definition = "依据最终规范制品、源映射、语义差异及显式差异基线，重算摘要、长度与修订并核对跨对象绑定的检查。"
symbols = [{ value = "check_post_emission_bundle", kind = "function" }]
references = [{ document = "design-compiler-post-emission-check-and-minimal-publication-closure" }]

[[terms]]
id = "post-emission-checked-bundle"
name = "后发射受检制品组"
english_aliases = ["post-emission checked bundle"]
domains = ["artifacts"]
definition = "后发射检查成功后持有三对象不可变受检来源句柄的进程内能力；字段私有且不可序列化，不要求三份完整对象同时驻留，也不表示已发布或可信。"
symbols = [{ value = "PostEmissionCheckedBundle", kind = "type" }]
references = [{ document = "design-compiler-post-emission-check-and-minimal-publication-closure" }]

[[terms]]
id = "publication-manifest"
name = "发布清单"
english_aliases = ["publication manifest"]
domains = ["artifacts"]
definition = "对制品集合、外部描述符、摘要和真实性进行发布级绑定的清单。"
references = [{ document = "design-portable-canonical-artifact" }]

[[terms]]
id = "revision-artifact-binding"
name = "修订—制品绑定"
english_aliases = ["revision–artifact binding"]
domains = ["artifacts"]
definition = "以路网修订派生版本、路网修订标识、目标制品精确字节摘要和精确字节长度四项共同标识一份制品；只比较 revision 不能证明 exact bytes 相同，只比较 digest/length 不能证明语义修订声明正确。"
symbols = [{ value = "RevisionArtifactBindingV1", kind = "type" }]
references = [{ document = "design-portable-canonical-artifact" }]

[[terms]]
id = "runtime-precondition"
name = "运行时前置条件"
english_aliases = ["runtime precondition"]
domains = ["artifacts"]
definition = "建立视图或世界前必须由结构校验器证明成立的不变量。"
references = [{ document = "design-portable-canonical-artifact" }]

[[terms]]
id = "section-directory"
name = "节目录"
english_aliases = ["section directory"]
domains = ["artifacts"]
definition = "记录制品各数据节种类、位置和长度等结构信息的目录；精确字段由所属格式规定。"
references = [{ document = "design-portable-canonical-artifact" }]

[[terms]]
id = "semantic-diff"
name = "语义差异"
english_aliases = ["semantic diff"]
domains = ["artifacts"]
definition = "以稳定标识和所有者局部键比较两个规范制品语义变化的结构化结果；它不能自行决定修订激活，跨修订状态迁移必须由对象外可信切换描述符绑定。"
references = [{ document = "design-portable-canonical-artifact" }]

[[terms]]
id = "semantic-diff-envelope"
name = "语义差异封套"
english_aliases = ["semantic diff envelope"]
domains = ["artifacts"]
definition = "版本化绑定旧/新路网修订与规范制品精确字节，并承载规范排序差异记录的派生制品封套。"
symbols = [{ value = "SemanticDiffEnvelope", kind = "type" }, { value = "LFSD", kind = "acronym" }]
references = [{ document = "design-portable-canonical-artifact" }]

[[terms]]
id = "source-map"
name = "源映射"
english_aliases = ["source map"]
domains = ["artifacts"]
definition = "把规范实体、关系或诊断反向关联到来源模块和来源位置的派生制品。"
references = [{ document = "design-portable-canonical-artifact" }]

[[terms]]
id = "source-map-envelope"
name = "源映射封套"
english_aliases = ["source map envelope"]
domains = ["artifacts"]
definition = "版本化绑定精确规范制品、路网修订与编译来源链，并承载源映射记录的派生制品封套。"
symbols = [{ value = "SourceMapEnvelope", kind = "type" }, { value = "LFSM", kind = "acronym" }]
references = [{ document = "design-portable-canonical-artifact" }]

[[terms]]
id = "structurally-verified-image"
name = "已结构验证镜像"
english_aliases = ["structurally verified image"]
domains = ["artifacts"]
definition = "旧静态镜像分层方案中的结构检查结果类型名。"
symbols = [{ value = "StructurallyVerifiedImage", kind = "type" }]
references = [{ document = "adr-0025" }]
retirement = { reason = "现行制品检查采用受检对象视图与规范路网输入，该镜像类型名不表示现行 API。", replacements = [{ target = "value-checked-canonical-artifact", condition = "现行职责对应；不表示 API 或字节兼容。" }] }

[[terms]]
id = "target-triple"
name = "目标三元组"
english_aliases = ["target triple"]
domains = ["artifacts"]
definition = "冻结 CPU 架构、供应商、操作系统和 ABI 环境的目标标识。"
symbols = [{ value = "targetTriple", kind = "field" }]
references = [{ document = "design-portable-canonical-artifact" }]

[[terms]]
id = "trust-anchor"
name = "信任锚"
english_aliases = ["trust anchor"]
domains = ["artifacts"]
definition = "位于待验证对象之外、由签名、认证资产链或固定摘要提供的可信依据。"
references = [{ document = "design-portable-canonical-artifact" }]

[[terms]]
id = "trusted-descriptor"
name = "可信描述符"
english_aliases = ["trusted descriptor"]
domains = ["artifacts"]
definition = "旧目标专用静态镜像方案中经对象外信任锚认证并绑定目标与配置档的描述符。"
references = [{ document = "adr-0025", anchor = "1-不交付独立静态镜像制品或-abi" }]
context = "historical-static-image"
retirement = { reason = "独立静态镜像及其描述符、分块验证和发布审计方案已取消；本条不表示现行可移植制品或共享静态路网提供同名能力。" }

[[terms]]
id = "unverified-image-bytes"
name = "未验证镜像字节"
english_aliases = ["unverified image bytes"]
domains = ["artifacts"]
definition = "旧静态镜像分层方案中的未受检字节类型名。"
symbols = [{ value = "UnverifiedImageBytes", kind = "type" }]
references = [{ document = "adr-0025" }]
retirement = { reason = "现行制品检查与共享构建采用受检规范路网输入，该镜像类型名不表示现行 API。", replacements = [] }

[[terms]]
id = "validation-receipt-envelope"
name = "验证收据封套"
english_aliases = ["validation receipt envelope", "validation receipt"]
domains = ["artifacts"]
definition = "原方案拟独立交付的验证收据制品。"
symbols = [{ value = "ValidationReceiptEnvelope", kind = "type" }]
references = [{ document = "adr-0024" }]
retirement = { reason = "后发射检查与最小发布合同已取消独立验证收据，不保留同义现行制品。", replacements = [] }
short_forms = [{ name = "验证收据", scope = "仅在讨论已经取消的历史收据方案时使用。" }]

[[terms]]
id = "value-checked-canonical-artifact"
name = "已值域检查规范制品"
english_aliases = ["value-checked canonical artifact"]
domains = ["artifacts"]
definition = "通过有界结构、registry 和直接值域检查的借用型可移植对象视图；不证明跨对象 binding、来源真实性或发布状态。"
symbols = [{ value = "ValueCheckedObjectView", kind = "type" }]
references = [{ document = "design-portable-canonical-artifact" }]

[[terms]]
id = "version-axis"
name = "版本轴"
english_aliases = ["version axis"]
domains = ["artifacts"]
definition = "只描述一个独立兼容维度、不能与其他维度混用的版本字段。"
references = [{ document = "design-portable-canonical-artifact" }]

[[terms]]
id = "wrapper-type"
name = "包装类型"
english_aliases = ["wrapper type"]
domains = ["artifacts"]
definition = "在类型层面包裹已有值的类型，如按值持有 `Vec` 的批次类型；不据此推定存在文件格式或版本化制品。"
