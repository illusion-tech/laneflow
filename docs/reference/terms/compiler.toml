schema_version = 1

[[terms]]
id = "artifact-shape"
name = "制品结构统计"
english_aliases = ["artifact shape"]
domains = ["compiler"]
definition = "一份物理制品实际包含的行、字段、UTF-8 字节、向量元素、来源位置、路径步、变化行与载荷大小；只作为资源计划的输入，不与任何限额维度比较。"
references = [{ document = "adr-0035" }]

[[terms]]
id = "authoring"
name = "数据编制"
english_aliases = ["authoring"]
domains = ["compiler"]
definition = "创建、导入、编辑或生成静态路网来源的活动。"
references = [{ document = "design-compiler-foundation" }]

[[terms]]
id = "authoring-namespace-id"
name = "编制命名空间标识"
english_aliases = ["authoring namespace ID"]
domains = ["compiler"]
definition = "隔离稳定标识域、且不依赖文件路径或遍历顺序的持久标识。"
symbols = [{ value = "authoringNamespaceId", kind = "field" }]
references = [{ document = "design-compiler-foundation" }]

[[terms]]
id = "authoritative-source-module-graph"
name = "正本来源模块图"
english_aliases = ["authoritative source module graph"]
domains = ["compiler"]
definition = "一个编译单元内唯一可重放的编制事实来源；节点是来源模块，边是显式导入关系。"
references = [{ document = "design-compiler-foundation" }]

[[terms]]
id = "backend"
name = "后端"
english_aliases = ["backend"]
domains = ["compiler"]
definition = "从已验证编译结果生成特定制品的编译器末端；静态语义只能来自 LIR，源映射可另读已验证来源伴随数据。"
references = [{ document = "design-compiler-foundation" }]

[[terms]]
id = "base-construction"
name = "基础构造"
english_aliases = ["base construction"]
domains = ["compiler"]
definition = "编译器构建 HIR 时统一建立模块轴、符号、身份与引用解析索引的私有阶段。"
symbols = [{ value = "HirBase", kind = "type" }]
references = [{ document = "design-compiler-foundation" }]

[[terms]]
id = "behavior-equivalence"
name = "行为等价"
english_aliases = ["behavior equivalence"]
domains = ["compiler"]
definition = "当前态与目标态在冻结场景中产生相同交通状态、事件和安全结果。"

[[terms]]
id = "build-plan"
name = "构建计划"
english_aliases = ["build plan"]
domains = ["compiler"]
definition = "编译器私有结构：统一记录编译单元各静态语义领域的计数与容量规划，供预算聚合和领域降阶使用。"
symbols = [{ value = "HirBuildPlan", kind = "type" }]
references = [{ document = "design-compiler-resource-ledger" }]

[[terms]]
id = "builder"
name = "构建器"
english_aliases = ["builder"]
domains = ["compiler"]
definition = "按已冻结输入构造目标对象的组件；不得隐式补充未文档化语义。"

[[terms]]
id = "cache"
name = "缓存"
english_aliases = ["cache"]
domains = ["compiler"]
definition = "只影响复用和性能、不改变规范结果的暂存数据。"

[[terms]]
id = "candidate-road-revision"
name = "候选道路修订"
english_aliases = ["candidate road revision"]
domains = ["compiler"]
definition = "尚未提交、必须先完成编译和验证，失败或取消时不得改变当前路网修订的道路编辑候选。"
references = [{ document = "design-road-editing-source-and-geometry-frontend" }]

[[terms]]
id = "canonical-network-capacity"
name = "规范路网容量"
english_aliases = ["canonical network capacity"]
domains = ["compiler"]
definition = "编译端与消费端共同约束的最终规范路网规模上限，维度为稳定实体、机动门、等待区、规范关系出现记录与规范几何点；编译端按最终 LIR、消费端按最终 LFCA 字节以同一计数定义各自统计，差异 base 与公开检查入口的 LFCA 在建立索引前准入。"
references = [{ document = "adr-0035" }]

[[terms]]
id = "canonical-network-usage"
name = "规范路网规模"
english_aliases = ["canonical network usage"]
domains = ["compiler"]
definition = "一份最终规范路网实际包含的规范路网容量各维度数量，只与规范路网容量比较。"
references = [{ document = "adr-0035" }]

[[terms]]
id = "canonical-orders"
name = "规范排列"
english_aliases = ["canonical orders"]
domains = ["compiler"]
definition = "按规范标识原像形成的实体 MIR 与 LIR 双向排列；所有者局部排列仍由各领域冻结产生。"
symbols = [{ value = "CanonicalOrders", kind = "type" }]
references = [{ document = "design-compiler-foundation" }]

[[terms]]
id = "canonical-relation-occurrence"
name = "规范关系出现记录"
english_aliases = ["canonical relation occurrence"]
domains = ["compiler"]
definition = "纳入容量计数的规范关联出现位置，由所有者、角色及该角色规定的局部序号确定；包含编译器派生关系，不按端点去重，同一关联的双向表示只计一次。"
symbols = [{ value = "CanonicalRelationCount", kind = "type" }]
references = [{ document = "adr-0035" }]
scope_notes = ["参与角色集合由规范路网容量合同统一登记；与来源侧关系出现记录分别定义、分别执行。"]

[[terms]]
id = "circular-arc"
name = "圆弧"
english_aliases = ["circular arc"]
domains = ["compiler"]
definition = "沿水平弧长具有恒定非零有符号曲率的平面线形。"
scope_notes = ["道路编辑原生段提案以有符号半径保存圆弧，纵坡另行绑定。"]
references = [{ document = "design-road-editing-source-and-geometry-frontend", anchor = "native-plan-curves" }]

[[terms]]
id = "clean-compile"
name = "干净编译"
english_aliases = ["clean compile"]
domains = ["compiler"]
definition = "不使用增量缓存、从完整来源重新执行的编译。"

[[terms]]
id = "clean-single-thread-compile"
name = "干净单工作线程编译"
english_aliases = ["clean single-thread compile"]
domains = ["compiler"]
definition = "不使用增量缓存、只由一个工作线程从完整来源执行全部生产编译遍的确定性参考路径；内存 LIR 保持规范语义一致，后继制品存在时保持精确字节一致。"
references = [{ document = "design-compiler-foundation" }]

[[terms]]
id = "closed-contract"
name = "封闭契约"
english_aliases = ["closed contract"]
domains = ["compiler"]
definition = "以登记的闭合集合冻结允许的类型、字段、配置和组合；未知或未登记输入必须失败关闭，调用方不得任意扩展。"
references = [{ document = "design-compiler-foundation" }]

[[terms]]
id = "clothoid"
name = "回旋线"
english_aliases = ["clothoid", "Euler spiral"]
domains = ["compiler"]
definition = "有符号曲率沿水平弧长线性变化的平面线形。"
scope_notes = ["道路编辑原生段提案用水平弧长和首末曲率编制缓和段及跨零反弯。"]
references = [{ document = "design-road-editing-source-and-geometry-frontend", anchor = "native-plan-curves" }]

[[terms]]
id = "cold-instance-compile"
name = "冷实例编译"
english_aliases = ["cold-instance compile"]
domains = ["compiler"]
definition = "以新建编译器实例和空暂存容量执行的干净编译；规模相关来源物化是否计时由具名基准协议冻结，进程启动与磁盘读取不计时。"
references = [{ document = "design-compiler-foundation" }]

[[terms]]
id = "compilation-metrics"
name = "编译观测值"
english_aliases = ["compilation metrics"]
domains = ["compiler"]
definition = "只读描述一次成功编译的记录规模、逻辑输出、编译器控制峰值和同版本语义指纹；不等同于进程内存或制品摘要。"
symbols = [{ value = "CompilationMetrics", kind = "type" }]
references = [{ document = "design-compiler-foundation" }]

[[terms]]
id = "compilation-unit"
name = "编译单元"
english_aliases = ["compilation unit"]
domains = ["compiler"]
definition = "由一个正本来源模块图及其显式选项共同构成的原子编译输入。"
references = [{ document = "design-compiler-foundation" }]

[[terms]]
id = "compile-limits"
name = "编译配置档"
english_aliases = ["compile profile"]
domains = ["compiler"]
definition = "编译管线在分配前执行的来源处理限额、规范路网容量与操作资源预算组合；制品格式边界独立约束。"
symbols = [{ value = "CompileProfile", kind = "type" }]
references = [{ document = "adr-0035" }]

[[terms]]
id = "compile-limits-profile-qualification"
name = "配置档资格验证"
english_aliases = ["compile limits profile qualification"]
domains = ["compiler"]
definition = "验证具名配置档兑现其公开能力，包括可成功规模、规范统计一致性、诊断与账本完整性，以及各类边界的拒绝行为。"
references = [{ document = "adr-0035" }]

[[terms]]
id = "compile-limits-profile-validation"
name = "配置档校验"
english_aliases = ["compile limits profile validation"]
domains = ["compiler"]
definition = "核对配置档的维度归属、单位、值域、相关整数与平台可表示性，以及失败出口最低资源要求；不包含具体对象格式检查或可选静态生成上界证明。"
references = [{ document = "adr-0035" }]

[[terms]]
id = "compiler-calibration-scale"
name = "编译器校准规模"
english_aliases = ["compiler calibration scale"]
domains = ["compiler"]
definition = "用于观察固定成本、复杂度及缓存/内存拐点的合成编制/中间表示规模；不表示真实城市或产品容量。"
references = [{ document = "design-compiler-foundation" }]

[[terms]]
id = "compiler-controlled-total-live-memory"
name = "编译器控制总存续内存"
english_aliases = ["compiler-controlled total live memory"]
domains = ["compiler"]
definition = "编译请求同时拥有的来源、各阶段记录、字符串、诊断、暂存区和输出构造的存续请求字节总量；不等于进程工作集。"
references = [{ document = "design-compiler-foundation" }]

[[terms]]
id = "compiler-emitter"
name = "编译发射器"
english_aliases = ["compiler emitter"]
domains = ["compiler"]
definition = "从已验证 LIR 生成规范制品的编译器后端。"
symbols = [{ value = "emitter", kind = "notation" }]

[[terms]]
id = "compiler-foundation"
name = "编译器基础设施"
english_aliases = ["compiler foundation"]
domains = ["compiler"]
definition = "承载表示类型、编译遍驱动器、诊断、区块分配、确定性和编译发射器边界的公共基础。"
references = [{ document = "design-compiler-foundation" }]

[[terms]]
id = "compiler-intermediate-representation"
name = "编译器中间表示"
english_aliases = ["compiler intermediate representation"]
domains = ["compiler"]
definition = "编译器内部从有类型抽象语法树经 HIR、MIR 到 canonical LIR 的有类型阶段表示总称；各阶段的精确职责由专门词条定义。"
symbols = [{ value = "compiler IR", kind = "acronym" }]
references = [{ document = "design-compiler-foundation" }]

[[terms]]
id = "compiler-owned-static-network"
name = "编译器拥有的静态路网"
english_aliases = ["compiler-owned static network"]
domains = ["compiler"]
definition = "全部静态标识、拓扑、几何、规则和索引由编译器统一裁决的静态路网职责划分。"

[[terms]]
id = "compiler-pass"
name = "编译遍"
english_aliases = ["compiler pass"]
domains = ["compiler"]
definition = "具有显式输入、输出、诊断和确定性要求的一次编译转换或验证步骤。"
symbols = [{ value = "pass", kind = "notation" }]
references = [{ document = "design-compiler-foundation" }]

[[terms]]
id = "compiler-resource-ledger"
name = "编译器资源账本"
english_aliases = ["compiler resource ledger"]
domains = ["compiler"]
definition = "按宿主顶层操作记录受控存储、计划、预留与授予，并在分配前对照操作资源预算的包内记账结构。"
references = [{ document = "design-compiler-resource-ledger" }, { document = "adr-0035" }]
scope_notes = ["计划准入、同时存续的授予守恒、转交与峰值报告以资源账本设计为准。"]

[[terms]]
id = "compiler-stress-scale"
name = "编译器压力规模"
english_aliases = ["compiler stress scale"]
domains = ["compiler"]
definition = "放大编制/中间表示对象、用于暴露资源增长和失败边界的合成规模；不构成产品 SLA。"
references = [{ document = "design-compiler-foundation" }]

[[terms]]
id = "crate-dependency-graph"
name = "包依赖图"
english_aliases = ["crate dependency graph"]
domains = ["compiler"]
definition = "Rust 包之间必须保持无环、且不得让静态组件反向依赖动态运行时的依赖关系图。"
symbols = [{ value = "crate DAG", kind = "notation" }]

[[terms]]
id = "current-core-object-graph"
name = "当前核心对象图"
english_aliases = ["current Core object graph"]
domains = ["compiler"]
definition = "旧动态执行层的对象、句柄与登记表构造。"
references = [{ document = "design-traffic-runtime-shared-consumption" }]
retirement = { reason = "旧核心运行时已拆除，不作为可运行世界或编译器中间表示。", replacements = [] }

[[terms]]
id = "current-json"
name = "当前 JSON"
english_aliases = ["current JSON"]
domains = ["compiler"]
definition = "已删除的 Traffic、SpatialPackage 与 ScenarioManifest JSON 生产入口的历史合称。"
references = [{ document = "design-traffic-runtime-shared-consumption" }]
retirement = { reason = "生产编制与消费已转为编译器、可移植规范制品与共享静态路网。", replacements = [] }

[[terms]]
id = "determinism"
name = "确定性"
english_aliases = ["determinism"]
domains = ["compiler"]
definition = "相同规范输入在冻结条件下产生相同语义、顺序和要求范围内相同字节。"

[[terms]]
id = "deterministic-merge-order"
name = "确定性合并顺序"
english_aliases = ["deterministic merge order"]
domains = ["compiler"]
definition = "并行或分片结果按固定规则合并，使输出不依赖线程调度。"
references = [{ document = "design-compiler-foundation" }]

[[terms]]
id = "deterministic-oracle"
name = "确定性预言机"
english_aliases = ["deterministic oracle"]
domains = ["compiler"]
definition = "其他执行模式必须在冻结的语义或精确字节边界上匹配的参考执行路径。"
references = [{ document = "design-compiler-foundation" }]

[[terms]]
id = "diagnostic"
name = "诊断"
english_aliases = ["diagnostic"]
domains = ["compiler"]
definition = "带稳定代码、严重程度、来源位置、原因和建议的编译或验证反馈。"

[[terms]]
id = "domain-budget"
name = "领域预算"
english_aliases = ["domain budget"]
domains = ["compiler"]
definition = "单个静态语义领域对持久表、查找表与暂存区字节的独立估算；聚合规则由编译器内存设计规定。"
symbols = [{ value = "DomainBudget", kind = "type" }]
references = [{ document = "design-compiler-resource-ledger" }]

[[terms]]
id = "editor-authoring-surface"
name = "编辑器编制界面"
english_aliases = ["editor authoring surface"]
domains = ["compiler"]
definition = "编辑并持久化来源模块、显示来源诊断的交互界面；它不私有化编译语义。"
references = [{ document = "design-compiler-foundation" }]

[[terms]]
id = "feature-bits"
name = "特性位"
english_aliases = ["feature bits"]
domains = ["compiler"]
definition = "可组合的功能位；不能用任意特性位组合替代合同规定的封闭配置档。"

[[terms]]
id = "fingerprint"
name = "指纹"
english_aliases = ["fingerprint"]
domains = ["compiler"]
definition = "用于快速候选匹配的短摘要；命中后仍须比较完整正本值。"

[[terms]]
id = "freeze-plan"
name = "冻结计划"
english_aliases = ["freeze plan"]
domains = ["compiler"]
definition = "编译器根据 MIR 统一规划 LIR 记录计数、暂存与输出字节、限额观测的私有结构。"
symbols = [{ value = "LirFreezePlan", kind = "type" }]
references = [{ document = "design-compiler-resource-ledger" }]

[[terms]]
id = "frontend"
name = "前端"
english_aliases = ["frontend"]
domains = ["compiler"]
definition = "只负责特定来源语言的解析、类型化与来源位置，不拥有后续全局静态语义。"
references = [{ document = "design-compiler-foundation" }]

[[terms]]
id = "generated-binding-boundary"
name = "生成绑定边界"
english_aliases = ["generated binding boundary"]
domains = ["compiler"]
definition = "只承载固定 `flatc` Rust 生成物并隔离 generated accessor `unsafe` 的私有、不可发布 package；不成为公共 SDK、第二套领域模型或第三方前端接口。"
symbols = [{ value = "laneflow-road-editing-wire", kind = "crate" }]
references = [{ document = "design-road-editing-source-and-geometry-frontend" }]

[[terms]]
id = "geometry-accuracy-profile"
name = "几何精度配置档"
english_aliases = ["Geometry accuracy profile"]
domains = ["compiler"]
definition = "规定编制曲线转换为规范几何时位置误差工程目标的封闭配置档；固定采样与离线观测不构成连续最大误差保证。"
symbols = [{ value = "GeometryAccuracyProfile", kind = "type" }]
references = [{ document = "design-road-editing-source-and-geometry-frontend" }]

[[terms]]
id = "geometry-direction-profile"
name = "几何方向配置档"
english_aliases = ["Geometry direction profile"]
domains = ["compiler"]
definition = "规定折线方向连续性工程目标的封闭配置档；与位置精度配置档正交组合，同一编译单元内一致。"
symbols = [{ value = "GeometryDirectionProfile", kind = "type" }]
references = [{ document = "design-road-editing-source-and-geometry-frontend" }]

[[terms]]
id = "geometry-direction-profile-applicability-flag"
name = "几何方向配置档适用标记"
english_aliases = ["Geometry direction profile applicability flag"]
domains = ["compiler"]
definition = "逐规范几何的二值标记，决定哪些内部弦与连接应用同次编译的全局方向配置档；不引入逐行配置档。"
symbols = [{ value = "directionProfileApplies", kind = "field" }]
references = [{ document = "design-portable-canonical-artifact" }]

[[terms]]
id = "geometry-document-frontend"
name = "几何文档前端"
english_aliases = ["Geometry document frontend"]
domains = ["compiler"]
definition = "严格 JSON 几何文档方案中的编制前端。"
references = [{ document = "design-road-editing-source-and-geometry-frontend" }]
retirement = { reason = "道路编辑来源已采用 FlatBuffers，该方案不再作为实现输入。", replacements = [{ target = "road-editing-frontend", condition = "现行职责对应；不表示 API 或字节兼容。" }] }

[[terms]]
id = "geometry-source-module"
name = "几何来源模块"
english_aliases = ["Geometry source module"]
domains = ["compiler"]
definition = "旧 JSON 几何方案拟公开的预构造模块类型。"
symbols = [{ value = "GeometryModule", kind = "type" }]
references = [{ document = "design-compiler-foundation" }]
retirement = { reason = "道路编辑前端使用借用来源输入和共同受检接入，不公开该模块类型。", replacements = [{ target = "road-editing-source-input", condition = "现行职责对应；不表示 API 或字节兼容。" }] }

[[terms]]
id = "handle"
name = "句柄"
english_aliases = ["handle"]
domains = ["compiler"]
definition = "进程或世界内使用的有类型实体引用。"

[[terms]]
id = "high-level-intermediate-representation"
name = "高层中间表示"
english_aliases = ["high-level intermediate representation"]
domains = ["compiler"]
definition = "已完成模块、命名空间、符号、引用、单位和编制语义解析的表示。交通一维存储正本为整数毫米。"
symbols = [{ value = "HIR", kind = "acronym" }]
references = [{ document = "design-compiler-foundation" }]

[[terms]]
id = "import-frontend"
name = "导入前端"
english_aliases = ["import frontend"]
domains = ["compiler"]
definition = "把外部来源及其工具、选项和来源链显式转换为来源模块的前端。"
references = [{ document = "design-compiler-foundation" }]

[[terms]]
id = "incremental-compile"
name = "增量编译"
english_aliases = ["incremental compile"]
domains = ["compiler"]
