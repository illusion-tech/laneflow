name = "已验证编译结果"
english_aliases = ["validated compilation output"]
domains = ["compiler"]
definition = "原子拥有 LIR、已验证源映射输入和非错误级诊断的成功编译结果；错误级诊断存在时不得构造。"
symbols = [{ value = "CompilationOutput", kind = "type" }]
references = [{ document = "design-compiler-foundation" }]

[[terms]]
id = "validated-current-source-bundle"
name = "已验证当前态来源包"
english_aliases = ["validated current-source bundle"]
domains = ["compiler"]
definition = "旧 JSON 加载链路中的历史内部来源 DTO。"
symbols = [{ value = "ValidatedCurrentSourceBundle", kind = "type" }]
references = [{ document = "design-traffic-runtime-shared-consumption" }]
retirement = { reason = "所属加载组件已拆除，不是现行编译器输入。", replacements = [] }

[[terms]]
id = "validated-source-map-input"
name = "已验证源映射输入"
english_aliases = ["validated source-map input"]
domains = ["compiler"]
definition = "与 LIR 同次成功编译冻结、只保存来源模块、来源位置、来源链及 LIR 键关联且不能补充静态语义的伴随数据。"
symbols = [{ value = "ValidatedSourceMapInput", kind = "type" }]
references = [{ document = "design-compiler-foundation" }]

[[terms]]
id = "view"
name = "视图"
english_aliases = ["view"]
domains = ["compiler"]
definition = "借用或共享已验证底层存储、且不复制正本数据的只读访问接口。"

[[terms]]
id = "single-network-10k-compile-profile"
name = "一万实体单路网配置档"
english_aliases = ["single-network ten-thousand stable-entity compile profile"]
domains = ["compiler"]
definition = "在较小操作资源预算下编制一个含一万个稳定实体的局部完整路网的具名常规配置档；以登记的互补工作负载及操作矩阵取得资格，不承诺任意一万个实体组合均成功。"
symbols = [{ value = "LF-COMP-SINGLE-NETWORK-10K-STABLE-ENTITIES", kind = "constant" }]
references = [{ document = "design-compiler-foundation" }]

[[terms]]
id = "canonical-consumer-policy"
name = "规范制品消费政策"
english_aliases = ["canonical artifact consumer policy"]
domains = ["compiler"]
definition = "公开规范制品检查入口使用的规范路网容量与操作资源预算组合，类型中不含来源处理限额；制品格式边界由调用方另外提供。"
symbols = [{ value = "CanonicalConsumerPolicy", kind = "type" }]
references = [{ document = "adr-0035" }]
