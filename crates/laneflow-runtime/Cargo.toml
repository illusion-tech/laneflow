[package]
name = "laneflow-runtime"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "LaneFlow 交通运行时：消费共享静态路网修订的每世界可变状态与固定步进。"
publish = false

[lib]
name = "laneflow_runtime"
path = "src/lib.rs"

# 测量入口与共享夹具放在同一目录，单测和集成测试均无需上级源码引用。
[[test]]
name = "cutover_scale_evidence"
path = "src/kernel/tests/performance_profile/cutover_scale_evidence.rs"

[[test]]
name = "cutover_scale_allocation"
path = "src/kernel/tests/performance_profile/cutover_scale_allocation.rs"

[[test]]
name = "runtime_profile_evidence"
path = "src/kernel/tests/performance_profile/runtime_profile_evidence.rs"

[[test]]
name = "runtime_profile_allocation"
path = "src/kernel/tests/performance_profile/runtime_profile_allocation.rs"

[dependencies]
laneflow-format = { version = "0.0.0", path = "../laneflow-format" }
laneflow-runtime-snapshot-wire = { version = "0.0.0", path = "../laneflow-runtime-snapshot-wire" }
laneflow-static-contract = { version = "0.0.0", path = "../laneflow-static-contract" }
laneflow-static-network = { version = "0.0.0", path = "../laneflow-static-network" }
sha2 = { version = "0.11", default-features = false }
thiserror = "2.0"

[dev-dependencies]
dhat = "=0.3.3"
laneflow-compiler = { version = "0.0.0", path = "../laneflow-compiler" }
laneflow-corridor-generator = { version = "0.0.0", path = "../../tools/laneflow-corridor-generator" }
laneflow-scenario = { version = "0.0.0", path = "../laneflow-scenario" }
laneflow-spatial = { version = "0.0.0", path = "../laneflow-spatial" }
stats_alloc = "=0.1.10"
toml = "1.1.3"

[lints]
workspace = true
