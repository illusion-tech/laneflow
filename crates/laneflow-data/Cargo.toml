[package]
name = "laneflow-data"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "LaneFlow 当前外部数据格式与 Core normalization crate。"
publish = false

[lib]
name = "laneflow_data"
path = "src/lib.rs"

[dependencies]
laneflow-core = { version = "0.0.0", path = "../laneflow-core" }
laneflow-current-source = { version = "0.0.0", path = "../laneflow-current-source" }
laneflow-spatial = { version = "0.0.0", path = "../laneflow-spatial" }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
jsonschema = { version = "0.49", default-features = false }
sha2 = { version = "0.11", default-features = false }

[lints]
workspace = true
