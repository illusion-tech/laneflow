[package]
name = "laneflow-scenario"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "LaneFlow 的可选、引擎无关 reference scenario catalog 线格式。"
publish = false

[lib]
name = "laneflow_scenario"
path = "src/lib.rs"

[dependencies]
laneflow-compiler = { version = "0.0.0", path = "../laneflow-compiler" }
laneflow-static-contract = { version = "0.0.0", path = "../laneflow-static-contract" }
laneflow-static-network = { version = "0.0.0", path = "../laneflow-static-network" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
toml = "1.1.3"

[lints]
workspace = true
