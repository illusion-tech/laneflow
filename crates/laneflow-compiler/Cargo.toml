[package]
name = "laneflow-compiler"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "LaneFlow 编译器拥有的静态路网生产编译器。"
publish = false

[lib]
name = "laneflow_compiler"
path = "src/lib.rs"

[dependencies]
blake3 = "1.8"
laneflow-format = { version = "0.0.0", path = "../laneflow-format" }
laneflow-static-contract = { version = "0.0.0", path = "../laneflow-static-contract" }
laneflow-road-editing-wire = { version = "0.0.0", path = "../laneflow-road-editing-wire" }
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
stats_alloc = "=0.1.10"

[lints]
workspace = true
