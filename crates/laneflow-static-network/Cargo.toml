[package]
name = "laneflow-static-network"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "从受检 LFCA 构建 LaneFlow 进程内共享静态路网。"
publish = false

[lib]
name = "laneflow_static_network"
path = "src/lib.rs"

[features]
# 默认关闭；跨包测试只替换认证比较视图，不改写在用修订。
attestation-fixtures = []

[dependencies]
laneflow-format = { version = "0.0.0", path = "../laneflow-format" }
laneflow-static-contract = { version = "0.0.0", path = "../laneflow-static-contract" }
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
laneflow-compiler = { version = "0.0.0", path = "../laneflow-compiler" }
page_size = "=0.6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
tempfile = "=3.27.0"

[lints]
workspace = true
