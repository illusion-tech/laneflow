[package]
name = "laneflow-road-editing-wire"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "LaneFlow 道路编辑来源的私有 FlatBuffers 生成绑定。"
publish = false
# 关闭 Cargo 自动 target 发现：src/bin/、tests/、examples/、benches/ 下的文件
# 不经 manifest 段即成编译入口，会逃逸 check-wire-audit 的钉版边界。
autobins = false
autotests = false
autoexamples = false
autobenches = false

[lib]
name = "laneflow_road_editing_wire"
path = "src/lib.rs"

[dependencies]
flatbuffers = { version = "=25.12.19", default-features = false, features = ["std"] }

# 本 package 只承载固定 flatc 生成物：生成 .rs 由 CI clean-regeneration 钉版，
# src/lib.rs 包装器与 xtask/src/wire_pins/ 钉版副本字节相等；手写 LaneFlow crate
# 继承 workspace `unsafe_code = forbid` 并由 check-wire-audit hermetic 编译验证。
[lints.rust]
unsafe_code = "allow"
