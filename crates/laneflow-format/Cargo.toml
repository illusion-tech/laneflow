[package]
name = "laneflow-format"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "LaneFlow 可移植规范制品的受限精确编码、读取与结构预检。"
publish = false

[features]
default = []
std = ["dep:memmap2", "dep:tempfile"]

[lib]
name = "laneflow_format"
path = "src/lib.rs"

[dependencies]
laneflow-static-contract = { version = "0.0.0", path = "../laneflow-static-contract" }
sha2 = { version = "0.11", default-features = false }
memmap2 = { version = "0.9.11", optional = true }
tempfile = { version = "3.27.0", optional = true }

[lints.rust]
# checker/writer core remains safe and `no_std`; the optional staged adapter contains one
# audited read-only mmap call because Rust's mapping contract is necessarily unsafe.
unsafe_code = "deny"
