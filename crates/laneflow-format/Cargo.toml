[package]
name = "laneflow-format"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "LaneFlow 可移植规范制品的受限精确编码、读取与结构预检。"
publish = false

[features]
default = []
std = ["dep:laneflow-format-mmap"]

[lib]
name = "laneflow_format"
path = "src/lib.rs"

[dependencies]
laneflow-static-contract = { version = "0.0.0", path = "../laneflow-static-contract" }
laneflow-format-mmap = { version = "0.0.0", path = "../laneflow-format-mmap", optional = true }
sha2 = { version = "0.11", default-features = false }

# checker/writer core remains safe and `no_std`; the optional staged adapter delegates
# its single audited read-only mapping to the separately audited `laneflow-format-mmap`
# crate, so this crate inherits the workspace `unsafe_code = "forbid"` boundary.
[lints]
workspace = true
