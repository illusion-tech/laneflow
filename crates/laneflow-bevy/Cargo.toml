[package]
name = "laneflow-bevy"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "LaneFlow 的 Bevy 0.19 Reference Adapter crate。"
publish = false

[lib]
name = "laneflow_bevy"
path = "src/lib.rs"

[features]
default = []
native-example = ["dep:bevy", "dep:bevy_mesh"]

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "3d_bevy_render",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_winit",
    "default_app",
    "default_font",
    "multi_threaded",
    "std",
    "x11",
], optional = true }
bevy_app = { version = "0.19", default-features = false, features = ["std"] }
bevy_ecs = { version = "0.19", default-features = false, features = ["std"] }
bevy_mesh = { version = "0.19", optional = true }
bevy_time = { version = "0.19", default-features = false, features = ["std"] }
bevy_transform = { version = "0.19", default-features = false, features = ["bevy-support", "std"] }
laneflow-runtime = { version = "0.0.0", path = "../laneflow-runtime" }
laneflow-spatial = { version = "0.0.0", path = "../laneflow-spatial" }
laneflow-static-contract = { version = "0.0.0", path = "../laneflow-static-contract" }

[dev-dependencies]
bevy_math = { version = "0.19", default-features = false }
laneflow-format = { version = "0.0.0", path = "../laneflow-format" }
laneflow-scenario = { version = "0.0.0", path = "../laneflow-scenario" }
laneflow-static-contract = { version = "0.0.0", path = "../laneflow-static-contract" }
laneflow-static-network = { version = "0.0.0", path = "../laneflow-static-network" }
toml = "1.1.3"

[[example]]
name = "runtime_min"
required-features = ["native-example"]

[[example]]
name = "signalized_corridor"
required-features = ["native-example"]

[lints]
workspace = true
