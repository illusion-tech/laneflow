[package]
name = "issue-308-compiler-budget-calibration-research"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "#308 编译器资源上限与性能预算的非生产校准研究。"
publish = false
autobins = false

[[bin]]
name = "issue-308-compiler-budget-calibration-research"
path = "src/main.rs"

[[bin]]
name = "issue-308-compiler-budget-calibration-timing"
path = "src/bin/timing.rs"

[[bin]]
name = "issue-308-compiler-budget-calibration-attribution"
path = "src/bin/attribution.rs"

[[bin]]
name = "issue-308-compiler-budget-calibration-oracle"
path = "src/bin/oracle.rs"

[features]
default = []
candidate-hashbrown-randomstate = ["dep:hashbrown"]
candidate-hashbrown-xxh3 = ["dep:hashbrown", "dep:xxhash-rust", "xxhash-rust/xxh3"]
candidate-hashbrown-xxh64 = ["dep:hashbrown", "dep:xxhash-rust", "xxhash-rust/xxh64"]
candidate-hashbrown-fnv1a64 = ["dep:hashbrown"]
candidate-indexmap-randomstate = ["dep:indexmap"]
fixture-oracle = []
research-runner-full = [
    "candidate-hashbrown-randomstate",
    "candidate-hashbrown-xxh3",
    "candidate-hashbrown-xxh64",
    "candidate-hashbrown-fnv1a64",
    "candidate-indexmap-randomstate",
    "fixture-oracle",
]

[dependencies]
blake3 = "1.8"
hashbrown = { version = "0.17.1", optional = true, default-features = false, features = ["inline-more"] }
indexmap = { version = "2.14", optional = true, default-features = false, features = ["std"] }
jsonschema = { version = "0.49.1", default-features = false }
num-bigint = { version = "0.5.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.11", default-features = false }
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
thiserror = "2.0"
toml = { version = "1.1.3", default-features = false, features = ["parse", "serde"] }
xxhash-rust = { version = "0.8.18", optional = true, default-features = false }

[target.'cfg(windows)'.dependencies]
win32job = "=2.0.3"

[lints]
workspace = true
