[format]
codec = "tar + zstd（--ultra -22 --long=28 -T0，CLI 1.5.7）"
decompress = "zstd -d --long=28（需 zstd >= 1.3.0；解压窗口内存 256 MB）"
unpacked_total_bytes = 3043909632

[verify]
steps = [
  "先做外部核对：sha256sum <资产>.tar.zst 须与本索引 [[assets]] 登记一致（本索引经 Git 仓库认证，为信任锚；发布页 SHA256SUMS 资产本体另按其登记的 bytes/sha256 核对）",
  "zstd -d --long=28 <资产>.tar.zst -o <资产>.tar",
  "mkdir <组名> && tar -xf <资产>.tar -C <组名>",
  "cd <组名> && sha256sum -c SHA256SUMS",
  "archive-manifest.json 为逐文件清单：未替换文件的 SHA-256 与各 run result.json 登记逐项一致；替换文件另记替换前摘要，替换前摘要与登记一致；excluded_from_archive 转录 events/commands 的登记摘要（原件仅存采集机）。",
]
replacement = "仅把采集机路径前缀替换为占位符（<evidence-root>/<worktree>/<checkout>/<cargo-home>，定义见 research/README.md），其余字节不变"
exceptions = [
  "laneflow-urban-harness.exe 字节冻结（formal/sweep 组 SHA-256 25d60a3b…，证据构建组 664c96ad…），内嵌编译期 cargo registry 路径字符串按例外记录于清单",
  "run-one.ps1 引用的厂商控制中心位于 Program Files 标准安装位置，按 research/README.md 豁免",
]

[scope]
included_per_run = ["result.json", "measurements.toml", "diagnostics.json", "timings.jsonl", "ticks.jsonl", "resolved-plan.toml"]
excluded = [
  "runs/*/events.jsonl、runs/*/commands.jsonl（摘要经 result.json 登记可核对，原件仅存采集机）",
  "plans/（与各 run resolved-plan.toml 逐字节重复，计划 SHA-256 见认证报告 §2）",
  "aborted/",
]
inputs_note = "不含 #857 冻结输入原包；输入身份见认证报告 §2 与各组 measurement-freeze.json"
