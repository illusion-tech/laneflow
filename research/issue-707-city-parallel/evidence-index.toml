# #707 第二切片证据索引（E:/projects/laneflow-evidence/issue-707/4de40e04/）
# pilot 小型证据封套已绑定入本目录 evidence/（comparison/diagnostics/manifest
# 共 14 份，另有 1 份冻结计划重放记录）；D1/D2 r1 另绑定 1 份机器记录与
# 8 份现场核查、diagnostics、comparison 原始小封套，以及 4 份 D1/D2 电源边界记录；
# WPR trace/导出另有 1 份不可变身份记录和 25 份隐私筛选紧凑报告。M16 retained-best
# 另绑定源码补丁、机器 manifest、release 记录、8 份原运行小封套与 2 份 fresh-smoke
# 小封套；四次 M16 A/A 重复另绑定完整输出树身份与 768 个逐拍紧凑样本；M21 校准
# 审计另绑定五文件 Rust 增量、机器 manifest 与 4 份紧凑结果。M2 屏障跳过另绑定
# 三份 Rust/Cargo 二进制 Git 补丁、十次完整输出树身份与 1,920 个逐拍紧凑样本；
# M3 稠密 binding 另绑定两份 Rust/Cargo 二进制 Git 补丁、四次完整输出树身份与
# 768 个逐拍紧凑样本；M8 frontier 复用同样绑定两份 Rust/Cargo 二进制 Git 补丁、
# 四次完整输出树身份与 768 个逐拍紧凑样本。
# 大文件（逐拍日志、LFCA、计划本体）不入 Git；冻结 EXE 进入独立 Research
# Evidence prerelease，不进入普通 Git 历史。

