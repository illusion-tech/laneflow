[package]
name = "laneflow-post-p3-research"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "laneflow-p3-cache-research"
path = "src/cache_research.rs"

[[bin]]
name = "laneflow-p2-cost-research"
path = "src/p2_cost.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.11"
toml = "1.1.3"
uuid = { version = "1.24", features = ["v4"] }

[lints]
workspace = true
