[package]
name = "laneflow-post-p3-research"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "laneflow-p3-cache-research"
path = "src/cache_research.rs"

[[bin]]
name = "laneflow-p2-cost-research"
path = "src/p2_cost.rs"

[dependencies]
cc = "=1.2.66"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.11"
toml = "1.1.3"
uuid = { version = "1.24", features = ["v4"] }
wide = "=1.5.0"

[lints]
workspace = true

[[bin]]
name = "laneflow-p2-scope-research"
path = "src/p2_scope_research.rs"

[[bin]]
name = "laneflow-p5-cost-research"
path = "src/p5_cost.rs"

[[bin]]
name = "laneflow-p5-direct-research"
path = "src/p5_direct_research.rs"

[[bin]]
name = "laneflow-empty-ranges-research"
path = "src/empty_ranges.rs"

[[bin]]
name = "laneflow-current-hotspots-research"
path = "src/current_cost.rs"

[[bin]]
name = "laneflow-p5-chunk-research"
path = "src/p5_chunks.rs"

[[bin]]
name = "laneflow-p5-simd-research"
path = "src/p5_simd.rs"

[[bin]]
name = "laneflow-p5-hot-simd-research"
path = "src/p5_hot.rs"
