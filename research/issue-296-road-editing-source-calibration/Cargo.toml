[package]
name = "issue-296-road-editing-source-calibration"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "#296 RoadEditingSource P100 generator and formal calibration evidence."
publish = false
autobins = false

[[bin]]
name = "calibrate"
path = "src/main.rs"

[dependencies]
laneflow-compiler = { version = "0.0.0", path = "../../crates/laneflow-compiler", features = ["road-editing-g3-evidence"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "0.11", default-features = false }

[lints]
workspace = true
