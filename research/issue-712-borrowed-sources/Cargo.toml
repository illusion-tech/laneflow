[package]
name = "laneflow-issue-712"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace]

[features]
# 分配计数构建（stats_alloc 全局插桩）。
allocation = ["dep:stats_alloc"]
# A 侧（before）薄适配：按值 Vec API 的消费写法。研究程序源码在两侧字节
# 相同，只由构建 feature 选择；生产 crate 不保留任何新旧开关。
legacy-source = []

[dependencies]
laneflow-bevy = { path = "../../crates/laneflow-bevy" }
laneflow-compiler = { path = "../../crates/laneflow-compiler" }
laneflow-format = { path = "../../crates/laneflow-format" }
laneflow-runtime = { path = "../../crates/laneflow-runtime" }
laneflow-spatial = { path = "../../crates/laneflow-spatial" }
laneflow-static-contract = { path = "../../crates/laneflow-static-contract" }
laneflow-static-network = { path = "../../crates/laneflow-static-network" }
bevy_math = { version = "0.19", default-features = false }
sha2 = "0.11"
stats_alloc = { version = "=0.1.10", optional = true }

[profile.release]
debug = 1

[lints.rust]
unsafe_code = "forbid"
